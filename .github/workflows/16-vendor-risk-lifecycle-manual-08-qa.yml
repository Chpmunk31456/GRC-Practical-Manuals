name: "16 - Vendor Risk Lifecycle Manual 08 QA"

# Lifecycle-aware validation preserves the legacy controlled-intake gate after publication.
on:
  pull_request:
    branches:
      - "main"
    paths:
      - "07-third-party-risk/Vendor_Risk_Lifecycle/**"
      - ".compliance/vendor-risk-lifecycle-manual-08-baseline.json"
      - ".compliance/authoritative-sources.json"
      - ".compliance/manual-catalog.json"
      - ".compliance/work-product-releases.json"
      - "scripts/vendor_risk_lifecycle_manual_08_qa.py"
      - "scripts/run_legacy_manual_qa_release_state.py"
      - "scripts/compliance_qa.py"
      - ".github/workflows/16-vendor-risk-lifecycle-manual-08-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-risk-lifecycle-manual-08-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vendor-risk-lifecycle-manual-08:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Manual 08 controlled implementation intake
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('.compliance/manual-catalog.json').read_text(encoding='utf-8'))
          match = [m for m in catalog['manuals'] if m.get('id') == 'vendor-risk-lifecycle']
          if len(match) != 1:
              raise SystemExit('Manual 08 catalog entry must be unique')
          print(match[0].get('status', ''))
          PY
          )"
          if [[ "$STATUS" == "published" ]]; then
            python3 scripts/run_legacy_manual_qa_release_state.py \
              --manual-id vendor-risk-lifecycle \
              --script scripts/vendor_risk_lifecycle_manual_08_qa.py
          else
            python3 scripts/vendor_risk_lifecycle_manual_08_qa.py
          fi
      - name: Validate authoritative-source registry
        run: python3 scripts/compliance_qa.py sources
      - name: Validate controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog
