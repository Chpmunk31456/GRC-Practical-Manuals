name: "25 - Manual 24 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/25-manual24-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 24 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual24-candidate
          mkdir -p /tmp/manual24-candidate
          gh run download 33386933300 -R "$GITHUB_REPOSITORY" -n manual24-six-binary-candidate -D /tmp/manual24-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual24-candidate
          printf '%s  %s\n' \
            5cd618a0ef6fd2e14b2ca5af9ee87d6f87eb70085f543ae7108719f44038e222 Manual_24_NIS2_Controlled_EN.docx \
            b6e64f9058dd7f673942f0efc60498f252f3f36e1816454024fceeac94f178e9 Manual_24_NIS2_Controlled_EN.pdf \
            d6cce898c4606a27dc7bc500b667568f5d3336becc9a050a9e2cf9bbb45fda66 Manual_24_NIS2_Controlled_ES-419.docx \
            b2fe9222b79750f4a3dabf69292184a4cd5f4008980514947b40616d0ae6667c Manual_24_NIS2_Controlled_ES-419.pdf \
            185783033f3880c5f1654e6342632f7c2bbeb924438efddd252c7129ad606631 Manual_24_NIS2_Controlled_PT-BR.docx \
            4ffc1eb318ad1d9c399036828fbf5c46691659a84c1b2817ef51a511604a1a8e Manual_24_NIS2_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='04-regulatory-compliance/NIS2_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual24-candidate/Manual_24_NIS2_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual24-candidate/Manual_24_NIS2_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual24-candidate/Manual_24_NIS2_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual24-candidate/Manual_24_NIS2_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual24-candidate/Manual_24_NIS2_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual24-candidate/Manual_24_NIS2_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/25-manual24-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/25-manual24-exact-staging.yml
          git commit -m 'Stage Manual 24 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
