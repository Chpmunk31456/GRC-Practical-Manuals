name: "21 - NIST CSF 2.0 Manual 09 QA"

on:
  pull_request:
    paths:
      - '.compliance/nist-csf-2-manual-09-baseline.json'
      - '.compliance/manual-catalog.json'
      - '.compliance/work-product-releases.json'
      - '.compliance/authoritative-sources.json'
      - '01-foundations/NIST_CSF_2_Controlled_Implementation/**'
      - 'scripts/nist_csf_2_manual_09_qa.py'
      - 'scripts/run_legacy_manual_qa_release_state.py'
      - 'scripts/compliance_qa.py'
      - '.github/workflows/21-nist-csf-2-manual-09-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nist-csf-2-manual-09-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-09-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run fail-closed Manual 09 QA
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('.compliance/manual-catalog.json').read_text(encoding='utf-8'))
          match = [m for m in catalog['manuals'] if m.get('id') == 'nist-csf-2-controlled']
          if len(match) != 1:
              raise SystemExit('Manual 09 catalog entry must be unique')
          print(match[0].get('status', ''))
          PY
          )"
          if [[ "$STATUS" == "published" ]]; then
            python3 scripts/run_legacy_manual_qa_release_state.py \
              --manual-id nist-csf-2-controlled \
              --script scripts/nist_csf_2_manual_09_qa.py
          else
            python3 scripts/nist_csf_2_manual_09_qa.py
          fi
      - name: Validate authoritative-source registry
        run: python3 scripts/compliance_qa.py sources
      - name: Validate controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog
