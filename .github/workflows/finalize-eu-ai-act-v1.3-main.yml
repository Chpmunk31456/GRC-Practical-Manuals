name: Finalize EU AI Act v1.3 main publication candidate

on:
  push:
    branches:
      - release/eu-ai-act-v1.3-main
    paths:
      - '.github/workflows/finalize-eu-ai-act-v1.3-main.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eu-ai-act-v1.3-main
          fetch-depth: 0

      - name: Update publication catalogs without replacing unrelated content
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          text = text.replace('**Repository version:** 1.1', '**Repository version:** 1.3', 1)
          text = text.replace('**Last updated:** July 2026', '**Last updated:** 31 July 2026', 1)
          old = '| [04 — Regulatory Compliance](./04-regulatory-compliance/) | [GDPR](./04-regulatory-compliance/GDPR/), [HIPAA](./04-regulatory-compliance/HIPAA/), and [PCI DSS v4.0.1](./04-regulatory-compliance/PCI_DSS_v4.0.1/) |'
          new = '| [04 — Regulatory Compliance](./04-regulatory-compliance/) | [EU AI Act GRC Compliance Manual](./04-regulatory-compliance/EU_AI_Act_GRC/), [GDPR](./04-regulatory-compliance/GDPR/), [HIPAA](./04-regulatory-compliance/HIPAA/), and [PCI DSS v4.0.1](./04-regulatory-compliance/PCI_DSS_v4.0.1/) |'
          if old not in text:
              raise SystemExit('Root README regulatory catalog row not found')
          text = text.replace(old, new, 1)
          marker = '> **Publication status:** The Spanish and Brazilian Portuguese editions are machine-assisted educational drafts. Package integrity and embedded media have been validated, but human language, legal, technical, accessibility, and final visual review may still be pending. Do not treat availability here as a claim of certification, legal advice, or completed editorial approval.\n'
          addition = marker + '\n**EU AI Act exception:** The EU AI Act GRC Compliance Manual has separately validated English, Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`) publication packages containing 138 chapters, Appendices A–Z, controlled Markdown, DOCX, PDF, manifests, automated QA evidence, PDF metadata, and SHA-256 checksums.\n'
          if 'EU AI Act exception:' not in text:
              if marker not in text:
                  raise SystemExit('Root README publication-status marker not found')
              text = text.replace(marker, addition, 1)
          root.write_text(text, encoding='utf-8')

          reg = Path('04-regulatory-compliance/README.md')
          text = reg.read_text(encoding='utf-8')
          text = text.replace('major privacy, healthcare, and payment-card compliance requirements', 'major AI-governance, privacy, healthcare, and payment-card compliance requirements', 1)
          eu = '''### EU Artificial Intelligence Act\n\n- [Open the EU AI Act GRC Compliance Manual](./EU_AI_Act_GRC/)\n- [Open the Spanish and Brazilian Portuguese publication packages](./EU_AI_Act_GRC/translations/)\n\nPublished and validated editions are available in English, Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`). Each package contains 138 chapters, Appendices A–Z, controlled Markdown, DOCX, PDF, manifests, QA evidence, PDF metadata, and SHA-256 checksums.\n\n'''
          if '### EU Artificial Intelligence Act' not in text:
              marker = '## Included Manuals\n\n'
              if marker not in text:
                  raise SystemExit('Regulatory README included-manuals marker not found')
              text = text.replace(marker, marker + eu, 1)
          text = text.replace('- Compliance analysts\n', '- Compliance analysts\n- AI-governance professionals\n', 1)
          text = text.replace('Version 1.0 — July 2026', 'Version 1.3 — July 2026', 1)
          reg.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## [1.3] — 31 July 2026\n\n### Added\n\n- Published the EU AI Act GRC Compliance Manual on the default branch in English, Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`).\n- Added 138 chapters and Appendices A–Z per language, controlled Markdown masters, DOCX and PDF editions, manifests, automated QA reports, PDF metadata, and SHA-256 checksums.\n- Added maintainable English and Spanish/Portuguese EU AI Act publication workflows.\n\n### Verified\n\n- Spanish and Brazilian Portuguese automated QA reports have `PASS` status with zero failures.\n- Both localized build manifests record 138 chapters, 26 appendices, and 164 source records.\n\n---\n\n'''
          if '## [1.3] — 31 July 2026' not in text:
              marker = '## [1.0] — July 2026\n'
              if marker not in text:
                  raise SystemExit('Changelog 1.0 marker not found')
              text = text.replace(marker, entry + marker, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

      - name: Verify publication evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('04-regulatory-compliance/EU_AI_Act_GRC/translations')
          for lang in ('es-419', 'pt-BR'):
              manifest = json.loads((base / 'quality' / lang / f'CANONICAL_BUILD_MANIFEST_{lang}.json').read_text(encoding='utf-8'))
              assert manifest['chapter_count'] == 138
              assert manifest['appendix_count'] == 26
              assert manifest['record_count'] == 164
              qa = json.loads((base / 'quality' / lang / f'AUTOMATED_QA_REPORT_{lang}.json').read_text(encoding='utf-8'))
              assert qa['status'] == 'PASS'
              assert qa['failures'] == []
              assert list((base / lang / 'docx').glob('*.docx'))
              assert list((base / lang / 'pdf').glob('*.pdf'))
          checksums = (base / 'quality' / 'PUBLICATION_SHA256SUMS.txt').read_text(encoding='utf-8')
          for required in ('es-419/source/', 'es-419/docx/', 'es-419/pdf/', 'pt-BR/source/', 'pt-BR/docx/', 'pt-BR/pdf/'):
              assert required in checksums
          PY

      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/finalize-eu-ai-act-v1.3-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md 04-regulatory-compliance/README.md CHANGELOG.md
          git commit -m 'Finalize EU AI Act v1.3 publication catalogs and evidence'
          git push origin HEAD:release/eu-ai-act-v1.3-main
