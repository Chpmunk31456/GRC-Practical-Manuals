name: Audit CIS Controls localized figures

on:
  push:
    branches:
      - audit/cis-controls-v8.1-localized-figures
    paths:
      - scripts/audit_cis_controls_localized_figures.py
      - .github/workflows/audit-cis-controls-localized-figures.yml
      - qa/images/LEGACY_IMAGE_PROVENANCE_INVENTORY.json
      - 01-foundations/CIS_Controls_v8.1/Espanol/**
      - 01-foundations/CIS_Controls_v8.1/Portugues_BR/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/cis-controls-v8.1-localized-figures

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run read-only CIS figure audit
        run: python scripts/audit_cis_controls_localized_figures.py

      - name: Verify report constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          report = Path('qa/images/CIS_CONTROLS_V8_1_LOCALIZED_FIGURE_AUDIT.md')
          text = report.read_text(encoding='utf-8')
          required = [
              'Total unresolved reference records: **11**',
              'Unique authoritative English source assets: **10**',
              'Latin American Spanish reference records: **1**',
              'Brazilian Portuguese reference records: **10**',
              'Cross-language duplicate source groups: **1**',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing audit assertions: {missing}')
          print('CIS localized figure audit assertions passed.')
          PY

      - name: Commit audit report
        run: |
          if git diff --quiet -- qa/images/CIS_CONTROLS_V8_1_LOCALIZED_FIGURE_AUDIT.md; then
            echo 'Audit report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/images/CIS_CONTROLS_V8_1_LOCALIZED_FIGURE_AUDIT.md
          git commit -m 'Record CIS localized figure audit'
          git push

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cis-controls-localized-figure-audit
          path: qa/images/CIS_CONTROLS_V8_1_LOCALIZED_FIGURE_AUDIT.md
          if-no-files-found: error
          retention-days: 30
