name: Rebuild and validate ISO localized packages

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/triggers/iso-final-package-rebuild.md'

permissions:
  contents: read

concurrency:
  group: iso-localized-final-package-qa
  cancel-in-progress: false

jobs:
  rebuild-validate-and-commit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Install document and raster tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils unzip
          python -m pip install --upgrade pip pillow

      - name: Remove exactly two PT-BR collapsed rule remnants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('02-management-systems/ISO_IEC_27001_27002/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          indexes = [i for i, line in enumerate(lines) if re.fullmatch(r'-{20,}', line)]
          if len(indexes) != 2:
              raise SystemExit(f'expected exactly 2 standalone collapsed rule rows, found {len(indexes)}')
          for i in reversed(indexes):
              del lines[i]
          updated = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          if re.search(r'(?m)^-{20,}$', updated):
              raise SystemExit('collapsed rule row remains after bounded cleanup')
          path.write_text(updated, encoding='utf-8')
          print('Removed exactly two standalone ISO PT-BR collapsed rule rows')
          PY

      - name: Re-run localized source gates
        run: |
          set -euo pipefail
          python3 qa/tools/audit_iso_localized_sources.py
          python3 qa/tools/audit_iso_localized_section_parity.py

      - name: Rebuild ISO Spanish and Portuguese DOCX/PDF
        run: |
          set -euo pipefail
          ROOT='02-management-systems/ISO_IEC_27001_27002'
          for source in \
            "$ROOT/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md" \
            "$ROOT/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md"; do
            stem="${source%.md}"
            pandoc "$source" --toc --resource-path="$(dirname "$source")" -o "${stem}.docx"
            libreoffice --headless --convert-to pdf --outdir "$(dirname "$source")" "${stem}.docx" >/dev/null
            test -s "${stem}.docx"
            test -s "${stem}.pdf"
            unzip -t "${stem}.docx" >/dev/null
            pdftotext "${stem}.pdf" - | grep -q '[[:alnum:]]'
          done

      - name: Render every PDF page and run raster preflight
        run: |
          set -euo pipefail
          rm -rf qa/rendered/iso-final
          mkdir -p qa/rendered/iso-final/es-419 qa/rendered/iso-final/pt-BR
          ES='02-management-systems/ISO_IEC_27001_27002/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.pdf'
          PT='02-management-systems/ISO_IEC_27001_27002/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.pdf'
          pdftoppm -png -r 110 "$ES" qa/rendered/iso-final/es-419/page >/dev/null 2>&1
          pdftoppm -png -r 110 "$PT" qa/rendered/iso-final/pt-BR/page >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json

          root = Path('qa/rendered/iso-final')
          report = {'editions': {}, 'failures': []}
          for edition in ('es-419', 'pt-BR'):
              pages = sorted((root / edition).glob('page-*.png'))
              if not pages:
                  report['failures'].append(f'{edition}: no rendered pages')
                  continue
              details = []
              for page in pages:
                  with Image.open(page).convert('L') as im:
                      stat = ImageStat.Stat(im)
                      mean = stat.mean[0]
                      extrema = im.getextrema()
                      nonwhite = sum(1 for value in im.resize((100, 140)).getdata() if value < 250)
                      if extrema == (255, 255) or nonwhite < 5:
                          report['failures'].append(f'{edition}: blank or near-blank {page.name}')
                      details.append({'page': page.name, 'width': im.width, 'height': im.height, 'mean_gray': round(mean, 2), 'sample_nonwhite': nonwhite})
              report['editions'][edition] = {'page_count': len(pages), 'pages': details}
          Path('qa/ISO_LOCALIZED_FINAL_RASTER_PREFLIGHT.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          md = ['# ISO Localized Final Raster Preflight', '', 'Automated page-rendering evidence. This detects missing or blank pages but does not replace native-language or human page-layout review.', '']
          for edition, data in report['editions'].items():
              md += [f'## {edition}', '', f"- Rendered pages: {data['page_count']}", '- Blank or near-blank pages: 0', '']
          md += ['## Result', '', '- Status: ' + ('FAIL' if report['failures'] else 'PASS'), '']
          if report['failures']:
              md.extend(f'- {item}' for item in report['failures'])
          Path('qa/ISO_LOCALIZED_FINAL_RASTER_PREFLIGHT.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
          if report['failures']:
              raise SystemExit('\n'.join(report['failures']))
          PY

      - name: Validate ISO DOCX embedded media and write checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          from xml.etree import ElementTree
          import json
          import re
          import zipfile

          ROOT = Path('02-management-systems/ISO_IEC_27001_27002')
          EDITIONS = {
              'es-419': ROOT / 'Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md',
              'pt-BR': ROOT / 'Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md',
          }
          MARKDOWN_IMAGE_RE = re.compile(r'!\[[^\]]*]\((?:<([^>]+)>|([^) \t]+))(?:[ \t]+[^)]*)?\)')
          HTML_IMAGE_RE = re.compile(r'<img\b[^>]*\bsrc\s*=\s*["\']([^"\']+)["\'][^>]*>', re.I)
          IMAGE_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image'
          BLIP = '{http://schemas.openxmlformats.org/drawingml/2006/main}blip'
          EMBED = '{http://schemas.openxmlformats.org/officeDocument/2006/relationships}embed'
          report = {'editions': {}, 'failures': []}

          def local_targets(source: Path):
              text = source.read_text(encoding='utf-8')
              refs = [m.group(1) or m.group(2) for m in MARKDOWN_IMAGE_RE.finditer(text)]
              refs.extend(m.group(1) for m in HTML_IMAGE_RE.finditer(text))
              targets = []
              for ref in refs:
                  parsed = urlparse(ref)
                  if parsed.scheme or parsed.netloc or ref.startswith('#'):
                      continue
                  target = source.parent / unquote(parsed.path)
                  if target.is_file():
                      targets.append(target.resolve())
              return targets

          for edition, source in EDITIONS.items():
              docx = source.with_suffix('.docx')
              targets = local_targets(source)
              try:
                  with zipfile.ZipFile(docx) as package:
                      bad = package.testzip()
                      if bad:
                          raise ValueError(f'CRC failure in {bad}')
                      media = [n for n in package.namelist() if n.startswith('word/media/') and not n.endswith('/')]
                      rel_root = ElementTree.fromstring(package.read('word/_rels/document.xml.rels'))
                      image_rels = {
                          rel.attrib.get('Id'): rel.attrib.get('Target')
                          for rel in rel_root
                          if rel.attrib.get('Type') == IMAGE_REL and rel.attrib.get('Target', '').startswith('media/')
                      }
                      doc_root = ElementTree.fromstring(package.read('word/document.xml'))
                      embeds = [node.attrib.get(EMBED) for node in doc_root.iter(BLIP) if node.attrib.get(EMBED)]
              except Exception as exc:
                  report['failures'].append(f'{edition}: invalid DOCX package: {exc}')
                  continue

              unresolved_embeds = [rid for rid in embeds if rid not in image_rels]
              if targets and not media:
                  report['failures'].append(f'{edition}: source has {len(targets)} local image placements but DOCX has no media')
              if targets and not image_rels:
                  report['failures'].append(f'{edition}: source has local image placements but DOCX has no image relationships')
              if len(embeds) < len(targets):
                  report['failures'].append(f'{edition}: source has {len(targets)} image placements but DOCX has only {len(embeds)} embedded image occurrences')
              if unresolved_embeds:
                  report['failures'].append(f'{edition}: unresolved embedded relationship IDs: {sorted(set(unresolved_embeds))}')
              if edition == 'pt-BR' and len(targets) != 9:
                  report['failures'].append(f'pt-BR: expected 9 resolvable source image placements, found {len(targets)}')

              report['editions'][edition] = {
                  'source_image_placements': len(targets),
                  'unique_media_files': len(media),
                  'image_relationships': len(image_rels),
                  'embedded_image_occurrences': len(embeds),
                  'unresolved_embeds': unresolved_embeds,
                  'status': 'FAIL' if any(item.startswith(f'{edition}:') for item in report['failures']) else 'PASS',
              }

          Path('qa/ISO_LOCALIZED_FINAL_DOCX_MEDIA_AUDIT.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          md = ['# ISO Localized Final DOCX Media Audit', '', 'This audit is scoped only to the rebuilt ISO/IEC 27001/27002 localized packages.', '']
          for edition, data in report['editions'].items():
              md += [
                  f'## {edition}', '',
                  f"- Source image placements: {data['source_image_placements']}",
                  f"- Unique embedded media files: {data['unique_media_files']}",
                  f"- DOCX image relationships: {data['image_relationships']}",
                  f"- Embedded image occurrences: {data['embedded_image_occurrences']}",
                  f"- Unresolved embedded relationships: {len(data['unresolved_embeds'])}",
                  f"- Status: **{data['status']}**", '',
              ]
          md += ['## Result', '', '- Status: **' + ('FAIL' if report['failures'] else 'PASS') + '**', '']
          if report['failures']:
              md.extend(f'- {item}' for item in report['failures'])
          Path('qa/ISO_LOCALIZED_FINAL_DOCX_MEDIA_AUDIT.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
          if report['failures']:
              raise SystemExit('\n'.join(report['failures']))
          PY

          ROOT='02-management-systems/ISO_IEC_27001_27002'
          sha256sum \
            "$ROOT/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md" \
            "$ROOT/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.docx" \
            "$ROOT/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.pdf" \
            "$ROOT/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md" \
            "$ROOT/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.docx" \
            "$ROOT/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.pdf" \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.md \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.md \
            qa/ISO_LOCALIZED_FINAL_RASTER_PREFLIGHT.md \
            qa/ISO_LOCALIZED_FINAL_DOCX_MEDIA_AUDIT.md \
            > qa/ISO_LOCALIZED_FINAL_SHA256SUMS.txt

      - name: Commit controlled package and QA evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            02-management-systems/ISO_IEC_27001_27002/Espanol/*.docx \
            02-management-systems/ISO_IEC_27001_27002/Espanol/*.pdf \
            02-management-systems/ISO_IEC_27001_27002/Portugues_BR/*.md \
            02-management-systems/ISO_IEC_27001_27002/Portugues_BR/*.docx \
            02-management-systems/ISO_IEC_27001_27002/Portugues_BR/*.pdf \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.* \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.* \
            qa/ISO_LOCALIZED_FINAL_RASTER_PREFLIGHT.* \
            qa/ISO_LOCALIZED_FINAL_DOCX_MEDIA_AUDIT.* \
            qa/ISO_LOCALIZED_FINAL_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No package or QA changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild and validate final ISO localized packages'
          for attempt in 1 2 3; do
            if git push origin HEAD:production/multilingual-grc-editions; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            sleep $((attempt * 5))
          done

      - name: Upload rendered review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iso-localized-final-rendered-review
          path: |
            qa/rendered/iso-final/
            qa/ISO_LOCALIZED_FINAL_RASTER_PREFLIGHT.md
            qa/ISO_LOCALIZED_FINAL_RASTER_PREFLIGHT.json
            qa/ISO_LOCALIZED_FINAL_DOCX_MEDIA_AUDIT.md
            qa/ISO_LOCALIZED_FINAL_DOCX_MEDIA_AUDIT.json
            qa/ISO_LOCALIZED_FINAL_SHA256SUMS.txt
          if-no-files-found: error
