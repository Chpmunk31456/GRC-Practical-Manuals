name: "26 - Manual 08 Publication Candidate"

on:
  pull_request:
    branches:
      - "build/ai-security-lifecycle-manual-07-2026"
    paths:
      - ".github/workflows/26-manual08-publication-candidate.yml"
      - "07-third-party-risk/Vendor_Risk_Lifecycle/**"
      - ".compliance/vendor-risk-lifecycle-manual-08-baseline.json"
      - ".compliance/authoritative-sources.json"
      - "scripts/generate_vendor_risk_lifecycle_manual_08_publication.py"
      - "scripts/run_vendor_risk_lifecycle_manual_08_publication.py"
      - "scripts/generate_ai_security_lifecycle_manual_07_publication.py"
      - "scripts/generate_nist_ai_rmf_manual_03_publication.py"
      - "scripts/pdf_content_preflight.py"
      - "scripts/localized_publication_regression_qa.py"

permissions:
  contents: read

jobs:
  generate-publication-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LibreOffice conversion dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install publication dependencies
        run: python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate Manual 08 controlled publication package
        run: python3 scripts/run_vendor_risk_lifecycle_manual_08_publication.py --output-root "$RUNNER_TEMP/manual08-publication" --source-head "${{ github.event.pull_request.head.sha }}"
      - name: Fail closed on generated PDF content
        run: python3 scripts/pdf_content_preflight.py "$RUNNER_TEMP/manual08-publication/publication"
      - name: Fail closed on localized publication regressions
        run: python3 scripts/localized_publication_regression_qa.py "$RUNNER_TEMP/manual08-publication/publication" --manual-number 8
      - name: Upload controlled publication package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual08-publication-candidate
          path: |
            ${{ runner.temp }}/manual08-publication/publication
            ${{ runner.temp }}/manual08-publication/qa
            ${{ runner.temp }}/manual08-publication/contact-sheets
          if-no-files-found: error
          retention-days: 1
