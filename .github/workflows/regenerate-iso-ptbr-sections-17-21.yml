name: Regenerate ISO PT-BR sections 17-21

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/triggers/iso-ptbr-sections-17-21.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-ptbr-sections-17-21
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0
      - name: Regenerate PT-BR sections 17-21
        run: python3 qa/tools/regenerate_iso_ptbr_sections_17_21.py
      - name: Run localized source audit
        id: source_audit
        continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_sources.py
      - name: Run section parity audit
        id: parity_audit
        continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_section_parity.py
      - name: Commit source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '02-management-systems/ISO_IEC_27001_27002/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md' \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.md \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.json \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.md \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate ISO PT-BR sections 17-21'
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            git push origin HEAD:production/multilingual-grc-editions
          fi
      - name: Preserve fail-closed publication gate
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.source_audit.outcome }}' != 'success' || '${{ steps.parity_audit.outcome }}' != 'success' ]]; then
            echo 'Sections 17-21 were committed, but remaining blockers are still documented.'
            exit 1
          fi
