name: Build localized control mapping editions

on:
  pull_request:
    branches: [main]
    paths:
      - '08-templates-and-tools/Control_Mapping_and_Crosswalk/English/**'
      - '08-templates-and-tools/Control_Mapping_and_Crosswalk/translations/**'
      - '08-templates-and-tools/Control_Mapping_and_Crosswalk/scripts/translate_localized_editions.py'
      - '.github/workflows/build-control-mapping-localized.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-mapping-localized-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-localized:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install translation and document tooling
        run: |
          set -euo pipefail
          python -m pip install 'argostranslate==1.9.6'
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils unzip libimage-exiftool-perl

      - name: Install translation models
        run: |
          set -euo pipefail
          python - <<'PY'
          import argostranslate.package
          argostranslate.package.update_package_index()
          available = argostranslate.package.get_available_packages()
          for target in ('es', 'pt'):
              matches = [p for p in available if p.from_code == 'en' and p.to_code == target]
              if not matches:
                  raise SystemExit(f'No Argos package for en->{target}')
              argostranslate.package.install_from_path(matches[0].download())
          PY

      - name: Generate localized Markdown
        run: |
          set -euo pipefail
          python 08-templates-and-tools/Control_Mapping_and_Crosswalk/scripts/translate_localized_editions.py

      - name: Build and validate localized packages
        run: |
          set -euo pipefail
          root='08-templates-and-tools/Control_Mapping_and_Crosswalk'
          en="$root/English/Control_Mapping_and_Crosswalk_Practical_Manual_English_v1.0.md"
          en_h1=$(grep -c '^# ' "$en")
          en_h2=$(grep -c '^## ' "$en")
          for locale in es-419 pt-BR; do
            md=$(find "$root/translations/$locale" -maxdepth 1 -type f -name '*.md' ! -name 'LOCALIZED_QA.md' -print -quit)
            test -n "$md"
            stem="${md%.md}"
            pandoc "$md" --toc --toc-depth=3 --metadata author='Alberto Al Leiva' -o "${stem}.docx"
            libreoffice --headless --convert-to pdf --outdir "$(dirname "$md")" "${stem}.docx" >/dev/null
            test -s "${stem}.docx"
            test -s "${stem}.pdf"
            unzip -t "${stem}.docx" >/dev/null
            h1=$(grep -c '^# ' "$md")
            h2=$(grep -c '^## ' "$md")
            test "$h1" -eq "$en_h1"
            test "$h2" -eq "$en_h2"
            ! grep -q 'ZXQ[0-9][0-9][0-9][0-9]QXZ' "$md"
            words=$(pdftotext "${stem}.pdf" - | wc -w)
            test "$words" -ge 3000
            pages=$(pdfinfo "${stem}.pdf" | awk '/^Pages:/ {print $2}')
            exiftool -overwrite_original -Author='Alberto Al Leiva' "${stem}.pdf" >/dev/null
            cat > "$root/translations/$locale/LOCALIZED_QA.md" <<EOF
          # Localized Package QA — $locale

          - Heading level 1 parity: PASS ($h1)
          - Heading level 2 parity: PASS ($h2)
          - Protected-token restoration: PASS
          - DOCX ZIP integrity: PASS
          - PDF searchable text: PASS
          - PDF pages: $pages
          - Extracted PDF words: $words
          - Translation status: machine-assisted publication candidate
          - Automated result: **PASS**

          Native-language, legal, regulatory, licensing, control, audit, accessibility, standards, and page-by-page human review are not represented as completed.
          EOF
            sha256sum "$md" "${stem}.docx" "${stem}.pdf" > "$root/translations/$locale/SHA256SUMS.txt"
          done

      - name: Commit localized candidates
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          branch='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 08-templates-and-tools/Control_Mapping_and_Crosswalk/translations
          if git diff --cached --quiet; then
            echo 'No localized changes.'
          else
            git commit -m 'Build and validate localized control mapping editions'
            git fetch origin "$branch"
            git rebase "origin/$branch"
            git push origin "HEAD:$branch"
          fi

      - name: Upload localized review package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-mapping-localized-candidates
          path: 08-templates-and-tools/Control_Mapping_and_Crosswalk/translations
          if-no-files-found: error
          retention-days: 30
