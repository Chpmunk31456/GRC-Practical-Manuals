name: "35 - Manual 14 Publication Candidate"

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/35-manual14-publication-candidate.yml"
      - "04-regulatory-compliance/PCI_DSS_v4.0.1_Controlled_Implementation/**"
      - "scripts/generate_pci_dss_manual_14_publication.py"
      - "scripts/pdf_content_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-publication-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LibreOffice conversion dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install publication dependencies
        run: python3 -m pip install --disable-pip-version-check python-docx pymupdf
      - name: Generate exact trilingual Manual 14 package
        run: python3 scripts/generate_pci_dss_manual_14_publication.py
      - name: Fail closed on generated PDF content
        run: python3 scripts/pdf_content_preflight.py "04-regulatory-compliance/PCI_DSS_v4.0.1_Controlled_Implementation/publication"
      - name: Upload exact candidate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual14-publication-candidate
          path: |
            04-regulatory-compliance/PCI_DSS_v4.0.1_Controlled_Implementation/publication
            04-regulatory-compliance/PCI_DSS_v4.0.1_Controlled_Implementation/qa
          if-no-files-found: error
          retention-days: 1
