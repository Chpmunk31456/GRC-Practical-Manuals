name: "72 - Manual 36 Publication Reconcile"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/72-manual36-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fail closed and reconcile Manual 36 publication state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          releases_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          releases = json.loads(releases_path.read_text(encoding='utf-8'))

          predecessor = 'singapore-ai-privacy-governance-controlled'
          manual_id = 'brazil-lgpd-controlled'
          root = Path('04-regulatory-compliance/Brazil_LGPD_Controlled_Implementation/publication')
          files = [
              root/'en/Manual_36_Brazil_LGPD_Controlled_EN.docx',
              root/'en/Manual_36_Brazil_LGPD_Controlled_EN.pdf',
              root/'es-419/Manual_36_Brazil_LGPD_Controlled_ES-419.docx',
              root/'es-419/Manual_36_Brazil_LGPD_Controlled_ES-419.pdf',
              root/'pt-BR/Manual_36_Brazil_LGPD_Controlled_PT-BR.docx',
              root/'pt-BR/Manual_36_Brazil_LGPD_Controlled_PT-BR.pdf',
          ]
          for p in files:
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'missing or empty staged artifact: {p}')

          manuals = catalog.get('manuals')
          released = releases.get('released_work_products')
          if not isinstance(manuals, list) or not isinstance(released, list):
              raise SystemExit('unexpected registry schema')
          if not any(x.get('id') == predecessor and x.get('status') == 'published' and x.get('release_state') == 'published' for x in manuals):
              raise SystemExit('Manual 35 predecessor is not published in catalog')
          if not any(x.get('id') == predecessor and x.get('release_state') == 'published' for x in released):
              raise SystemExit('Manual 35 predecessor is not published in release registry')
          if any(x.get('id') == manual_id for x in manuals) or any(x.get('id') == manual_id for x in released):
              raise SystemExit('Manual 36 already exists in a release registry; refusing duplicate append')

          manuals.append({
              'id': manual_id,
              'title': 'Manual 36 — Brazil LGPD Controlled Implementation',
              'path': '04-regulatory-compliance/Brazil_LGPD_Controlled_Implementation',
              'status': 'published',
              'release_state': 'published',
              'layout': 'controlled-build',
              'series_order': 36,
          })
          released.append({
              'id': manual_id,
              'type': 'manual',
              'release_state': 'published',
              'release_evidence': 'Manual 36 Brazil LGPD controlled EN/es-419/pt-BR package merged through PR #427 after release-time verification of the LGPD plus current binding ANPD regulations, including incident communication, encarregado/DPO, small-agent, sanctions/enforcement, international-transfer controls, and current adequacy/change-watch boundaries. Exact six-binary candidate workflow run 33426527901 / artifact 9770956924 is bound to artifact digest sha256:c94b5d53ac5a80e6c668d99d10eb1acf1fd7d2ef8891e2815b9a9d542ad84886. PR #430 bound all six exact SHA-256/byte identities plus 32-chapter completeness, zero-finding DOCX accessibility audits, searchable PDF checks, and full rendered-page review without regeneration. PR #431 durably staged the exact six binaries after fail-closed SHA-256 verification; its exact staging head passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA. Predecessor Manual 35 is published; no unresolved material source, applicability, localization, integrity, packaging, accessibility, provenance, workflow-security, copyright-boundary, or substantive defect is recorded.'
          })
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          releases_path.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Self-remove reconciliation workflow and push state
        shell: bash
        run: |
          rm .github/workflows/72-manual36-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/72-manual36-publication-reconcile.yml
          git commit -m 'Reconcile Manual 36 publication state and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
