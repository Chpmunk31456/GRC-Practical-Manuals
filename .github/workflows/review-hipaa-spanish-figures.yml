name: Generate and promote Spanish HIPAA figures

on:
  push:
    branches:
      - restore/hipaa-spanish-figures-1-7
    paths:
      - scripts/generate_hipaa_spanish_review_figures.py
      - scripts/promote_hipaa_spanish_figures.py
      - .github/workflows/review-hipaa-spanish-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-validate-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HIPAA restoration branch
        uses: actions/checkout@v4
        with:
          ref: restore/hipaa-spanish-figures-1-7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Spanish HIPAA figures
        run: python scripts/generate_hipaa_spanish_review_figures.py

      - name: Validate generated candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('review/hipaa-spanish-figures')
          expected = {
              'image1.png': (1828, 886),
              'image2.png': (1666, 886),
              'image3.png': (1635, 886),
              'image4.png': (1628, 915),
              'image5.png': (1628, 945),
              'image6.png': (1646, 886),
              'image7.png': (1628, 915),
          }
          for name, size in expected.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing candidate: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.format != 'PNG' or image.size != size:
                      raise SystemExit(
                          f'Invalid {path}: format={image.format}, size={image.size}, expected={size}'
                      )
          print('Validated seven Spanish HIPAA PNG candidates.')
          PY

      - name: Promote figures and repair references
        run: python scripts/promote_hipaa_spanish_figures.py

      - name: Validate promoted figures and Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          media = Path('04-regulatory-compliance/HIPAA/Espanol/media')
          markdown = Path('04-regulatory-compliance/HIPAA/Espanol/HIPAA_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md')
          expected = {
              'image1.png': (1828, 886),
              'image2.png': (1666, 886),
              'image3.png': (1635, 886),
              'image4.png': (1628, 915),
              'image5.png': (1628, 945),
              'image6.png': (1646, 886),
              'image7.png': (1628, 915),
          }
          text = markdown.read_text(encoding='utf-8')
          for name, size in expected.items():
              path = media / name
              if not path.is_file():
                  raise SystemExit(f'Missing promoted figure: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.format != 'PNG' or image.size != size:
                      raise SystemExit(f'Invalid promoted figure {path}')
              if text.count(f'](media/{name})') != 1:
                  raise SystemExit(f'Expected exactly one Markdown reference for {name}')
          for malformed in ('■img src=', 'لimg src=', 'Altura:3.56987in" alt='):
              if malformed in text:
                  raise SystemExit(f'Malformed image remnant remains: {malformed}')
          print('Validated seven promoted figures and repaired Markdown references.')
          PY

      - name: Commit promoted figures and Markdown repair
        run: |
          git add \
            04-regulatory-compliance/HIPAA/Espanol/HIPAA_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md \
            04-regulatory-compliance/HIPAA/Espanol/media/image1.png \
            04-regulatory-compliance/HIPAA/Espanol/media/image2.png \
            04-regulatory-compliance/HIPAA/Espanol/media/image3.png \
            04-regulatory-compliance/HIPAA/Espanol/media/image4.png \
            04-regulatory-compliance/HIPAA/Espanol/media/image5.png \
            04-regulatory-compliance/HIPAA/Espanol/media/image6.png \
            04-regulatory-compliance/HIPAA/Espanol/media/image7.png
          if git diff --cached --quiet; then
            echo 'Spanish HIPAA figures and references are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore Spanish HIPAA figures 1-7'
          git push origin HEAD:restore/hipaa-spanish-figures-1-7

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: hipaa-spanish-validated-figures
          path: review/hipaa-spanish-figures/*.png
          if-no-files-found: error
          retention-days: 14
