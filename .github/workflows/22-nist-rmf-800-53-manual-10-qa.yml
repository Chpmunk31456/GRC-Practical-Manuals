name: "22 - Manual 10 NIST RMF 800-53 QA"

on:
  pull_request:
    branches:
      - main
    paths:
      - '.compliance/nist-rmf-800-53-manual-10-baseline.json'
      - '.compliance/nist-rmf-800-53-manual-10-sources.json'
      - '.compliance/authoritative-sources.json'
      - '.compliance/manual-catalog.json'
      - '.compliance/work-product-releases.json'
      - '01-foundations/NIST_RMF_SP_800-53_Controlled_Implementation/**'
      - 'scripts/nist_rmf_800_53_manual_10_qa.py'
      - 'scripts/run_legacy_manual_qa_release_state.py'
      - '.github/workflows/22-nist-rmf-800-53-manual-10-qa.yml'

permissions:
  contents: read

jobs:
  preflight-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Manual 10 fail-closed preflight QA
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('.compliance/manual-catalog.json').read_text(encoding='utf-8'))
          match = [m for m in catalog['manuals'] if m.get('id') == 'nist-rmf-800-53-controlled']
          if len(match) != 1:
              raise SystemExit('Manual 10 catalog entry must be unique')
          print(match[0].get('status', ''))
          PY
          )"
          if [[ "$STATUS" == "published" ]]; then
            python3 scripts/run_legacy_manual_qa_release_state.py \
              --manual-id nist-rmf-800-53-controlled \
              --script scripts/nist_rmf_800_53_manual_10_qa.py
          else
            python3 scripts/nist_rmf_800_53_manual_10_qa.py
          fi
