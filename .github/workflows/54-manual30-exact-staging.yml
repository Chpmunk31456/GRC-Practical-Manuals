name: "54 - Manual 30 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/54-manual30-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 30 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual30-candidate
          mkdir -p /tmp/manual30-candidate
          gh run download 33409871076 -R "$GITHUB_REPOSITORY" -n manual30-six-binary-candidate -D /tmp/manual30-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual30-candidate
          printf '%s  %s\n' \
            9c8ab6e1cc6e167ba541274d9178d7468767ed44c6f85bcedb8bbe167d753492 Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_EN.docx \
            0c862907c4e8c5c98c7bb932a3a0d3cff1ad0a29db2ffc64983d9f1f88efabc8 Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_EN.pdf \
            e40f0e6b37c154af1ce7478b72e5a93b86c7f5acbd6ffea116ac1485df70e7fa Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_ES-419.docx \
            933bf7e6d3b789362a0b1bff9dec5b45dc01e815d15b98ec8274de1989cb5423 Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_ES-419.pdf \
            4d77a25896d6e6915079cf532b3c80274265999b567ecb2aa88e79f93bd61207 Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_PT-BR.docx \
            b65ef04c3dd24a2613fd0c885c5f03df1081cd71a83f4615f9296b3edb5a55f0 Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='08-templates-and-tools/Enterprise_GRC_Integration_Crosswalks/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual30-candidate/Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual30-candidate/Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual30-candidate/Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual30-candidate/Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual30-candidate/Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual30-candidate/Manual_30_Enterprise_GRC_Integration_Crosswalks_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/54-manual30-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/54-manual30-exact-staging.yml
          git commit -m 'Stage Manual 30 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
