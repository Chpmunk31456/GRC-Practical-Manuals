name: Rebuild CIS Spanish publication

on:
  pull_request:
    paths:
      - 'qa/requests/TRIGGER_CIS_PORTUGUESE_OPENING_FROM_MAIN.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-cis-spanish-publication
  cancel-in-progress: false

jobs:
  rebuild-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Rebuild CIS Spanish DOCX and PDF
        shell: bash
        run: |
          set -euo pipefail
          source='01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md'
          stem="${source%.md}"
          pandoc "$source" --resource-path="$(dirname "$source")" -o "${stem}.docx"
          libreoffice --headless --convert-to pdf --outdir "$(dirname "$source")" "${stem}.docx"
          test -s "${stem}.docx"
          test -s "${stem}.pdf"

      - name: Validate package integrity and searchable text
        shell: bash
        run: |
          set -euo pipefail
          base='01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0'
          unzip -t "${base}.docx" >/dev/null
          pdftotext "${base}.pdf" /tmp/cis-es.txt
          grep -q 'SERIE PRÁCTICA DE CIBERSEGURIDAD' /tmp/cis-es.txt
          grep -q 'Fundamentos de CIS Controls v8.1' /tmp/cis-es.txt
          grep -q 'Modelos, glosario, índice y referencias' /tmp/cis-es.txt
          ! grep -q 'realineed mappings' /tmp/cis-es.txt
          ! grep -q 'Contenido de la palabra' /tmp/cis-es.txt

      - name: Validate embedded media
        shell: bash
        run: |
          set -euo pipefail
          base='01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0'
          media_count=$(unzip -Z1 "${base}.docx" | grep -c '^word/media/' || true)
          test "$media_count" -ge 1
          echo "Embedded media files: $media_count"

      - name: Record checksums
        shell: bash
        run: |
          set -euo pipefail
          base='01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0'
          sha256sum "${base}.md" "${base}.docx" "${base}.pdf" > qa/CIS_CONTROLS_V8_1_ES_PUBLICATION_SHA256SUMS.txt

      - name: Commit rebuilt publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.docx' \
            '01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.pdf' \
            'qa/CIS_CONTROLS_V8_1_ES_PUBLICATION_SHA256SUMS.txt'
          if git diff --cached --quiet; then
            echo 'No rebuilt publication changes to commit.'
          else
            git commit -m 'Rebuild validated CIS Spanish publication'
            git push origin HEAD:production/multilingual-grc-editions
          fi
