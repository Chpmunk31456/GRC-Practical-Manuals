name: Integrate CIS Portuguese opening and Sections 1-5

on:
  workflow_dispatch:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - 'qa/requests/INTEGRATE_CIS_PORTUGUESE_OPENING_SECTIONS_1_5.md'
      - 'qa/rewrite/CIS_CONTROLS_V8_1_PTBR_OPENING_SECTIONS_1_5_REVIEWED.md'
      - 'qa/tools/integrate_cis_portuguese_opening_sections_1_5.py'
      - 'qa/tools/audit_cis_portuguese_full_manual.py'
      - '.github/workflows/integrate-cis-portuguese-opening-sections-1-5.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Integrate reviewed opening block
        run: python3 qa/tools/integrate_cis_portuguese_opening_sections_1_5.py

      - name: Refresh Portuguese full-manual audit
        run: python3 qa/tools/audit_cis_portuguese_full_manual.py

      - name: Commit controlled repair and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            01-foundations/CIS_Controls_v8.1/Portugues_BR/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md \
            qa/CIS_CONTROLS_V8_1_PTBR_FULL_MANUAL_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No controlled changes to commit.'
          else
            git commit -m 'Integrate reviewed CIS Portuguese opening and Sections 1-5'
            git push origin HEAD:production/multilingual-grc-editions
          fi
