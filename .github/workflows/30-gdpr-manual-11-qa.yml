name: "30 - GDPR Manual 11 QA"

on:
  pull_request:
    branches:
      - main
    paths:
      - "04-regulatory-compliance/GDPR_Controlled_Implementation/**"
      - ".compliance/gdpr-manual-11-baseline.json"
      - ".compliance/gdpr-manual-11-sources.json"
      - ".compliance/manual-catalog.json"
      - ".compliance/work-product-releases.json"
      - "scripts/gdpr_manual_11_qa.py"
      - "scripts/run_legacy_manual_qa_release_state.py"
      - ".github/workflows/30-gdpr-manual-11-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdpr-manual-11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-gdpr-manual-11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Manual 11 fail-closed lifecycle-aware QA
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('.compliance/manual-catalog.json').read_text(encoding='utf-8'))
          matches = [m for m in catalog.get('manuals', []) if m.get('id') == 'gdpr-controlled']
          if len(matches) != 1:
              raise SystemExit('Manual 11 catalog entry must exist exactly once')
          print(matches[0].get('status', ''))
          PY
          )"
          if [ "$STATUS" = "published" ]; then
            python3 scripts/run_legacy_manual_qa_release_state.py --manual-id gdpr-controlled --script scripts/gdpr_manual_11_qa.py
          else
            python3 scripts/gdpr_manual_11_qa.py
          fi
