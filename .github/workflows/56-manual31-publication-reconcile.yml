name: "56 - Manual 31 Publication Reconcile"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/56-manual31-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fail closed and reconcile Manual 31 publication state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          releases_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          releases = json.loads(releases_path.read_text(encoding='utf-8'))

          pred_id = 'enterprise-grc-integration-crosswalks-controlled'
          new_id = 'nydfs-part-500-controlled'

          cats = catalog.get('manuals', catalog if isinstance(catalog, list) else [])
          rels = releases.get('work_products', releases.get('releases', releases if isinstance(releases, list) else []))
          if not isinstance(cats, list) or not isinstance(rels, list):
              raise SystemExit('unexpected registry structure')

          pred_cat = next((x for x in cats if x.get('id') == pred_id), None)
          pred_rel = next((x for x in rels if x.get('id') == pred_id), None)
          if not pred_cat or pred_cat.get('status') != 'published' or pred_cat.get('release_state') != 'published':
              raise SystemExit('Manual 30 not published in catalog')
          if not pred_rel or pred_rel.get('release_state') != 'published':
              raise SystemExit('Manual 30 not published in release registry')
          if any(x.get('id') == new_id for x in cats) or any(x.get('id') == new_id for x in rels):
              raise SystemExit('Manual 31 publication record already exists')

          root = Path('04-regulatory-compliance/NYDFS_Part_500_Controlled_Implementation/publication')
          files = [
            root/'en/Manual_31_NYDFS_Part_500_Controlled_EN.docx',
            root/'en/Manual_31_NYDFS_Part_500_Controlled_EN.pdf',
            root/'es-419/Manual_31_NYDFS_Part_500_Controlled_ES-419.docx',
            root/'es-419/Manual_31_NYDFS_Part_500_Controlled_ES-419.pdf',
            root/'pt-BR/Manual_31_NYDFS_Part_500_Controlled_PT-BR.docx',
            root/'pt-BR/Manual_31_NYDFS_Part_500_Controlled_PT-BR.pdf',
          ]
          for p in files:
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'missing/empty staged artifact: {p}')

          entry = {
            'id': new_id,
            'title': 'Manual 31 — NYDFS 23 NYCRR Part 500 Controlled Implementation',
            'path': '04-regulatory-compliance/NYDFS_Part_500_Controlled_Implementation',
            'status': 'published',
            'release_state': 'published',
            'layout': 'controlled-build',
            'series_order': 31,
          }
          toolkit_index = next((i for i,x in enumerate(cats) if x.get('id') == 'ai-governance-audit-toolkit'), len(cats))
          cats.insert(toolkit_index, entry)

          rels.append({
            'id': new_id,
            'type': 'manual',
            'release_state': 'published',
            'release_evidence': 'Manual 31 NYDFS 23 NYCRR Part 500 controlled EN/es-419/pt-BR package merged through PR #399 after release-time source verification confirmed the November 1, 2023 Second Amendment baseline and preserved binding-regulation versus DFS-guidance versus organization-practice versus legal-determination boundaries. The exact six-binary candidate was generated by workflow run 33414345441 / artifact 9766406222 with artifact digest sha256:9e1c5df829d29730fed5398ea432940b5f478cdac2af4567b0c3dd089052ca7d. Candidate Build, Workflow Security, Release Pipeline Meta QA, Manual Structure QA, Trilingual Publication Parity, and Release Package QA passed. PR #401 bound all six immutable SHA-256 identities plus deterministic DOCX/PDF integrity, 32-chapter completeness, zero-finding DOCX accessibility, searchable PDF checks, and complete rendered-page review with no defect requiring regeneration. PR #402 durably staged the exact six binaries after fail-closed hash verification; its owner-authored exact staging head 44e43f949973edfdfb5ce6a1b79b4d0d6d055424 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA before merge at 14ba1ad60d82aaacaa279e13bc7bb1a6219d5f8a. Predecessor Manual 30 is published. Standing release authorization applies because applicable objective gates are green and no unresolved material source, applicability, regulatory-boundary, localization, integrity, packaging, accessibility, provenance, workflow-security, or substantive defect is recorded.'
          })

          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          releases_path.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Self-remove reconciliation workflow and push state
        run: |
          rm .github/workflows/56-manual31-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/56-manual31-publication-reconcile.yml
          git commit -m 'Reconcile Manual 31 published state and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
