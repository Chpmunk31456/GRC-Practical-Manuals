name: "30 - GDPR Manual 11 QA"

on:
  pull_request:
    branches:
      - "build/nist-rmf-800-53-manual-10-2026"
    paths:
      - "04-regulatory-compliance/GDPR_Controlled_Implementation/**"
      - ".compliance/gdpr-manual-11-baseline.json"
      - ".compliance/gdpr-manual-11-sources.json"
      - ".compliance/manual-catalog.json"
      - "scripts/gdpr_manual_11_qa.py"
      - ".github/workflows/30-gdpr-manual-11-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdpr-manual-11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-gdpr-manual-11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Run Manual 11 fail-closed controlled-build QA
        run: python3 scripts/gdpr_manual_11_qa.py
