name: "03 - Authoritative Source Watch"

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authoritative-source-watch
  cancel-in-progress: false

jobs:
  check-current-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the protected default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check review deadlines and live authoritative URLs
        run: python3 scripts/compliance_qa.py sources --network

      - name: Queue source changes for human review
        run: python3 scripts/source_monitoring.py --network --output /tmp/source-review-queue.json
      - name: Retain public source observation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-review-queue
          path: /tmp/source-review-queue.json
          retention-days: 30
