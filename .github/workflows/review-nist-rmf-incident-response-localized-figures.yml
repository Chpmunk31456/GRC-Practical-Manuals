name: Review NIST RMF and Incident Response localized figures

on:
  push:
    branches:
      - audit/nist-rmf-incident-response-localized-figures
    paths:
      - scripts/generate_nist_rmf_incident_response_localized_review_figures.py
      - .github/workflows/review-nist-rmf-incident-response-localized-figures.yml
      - qa/images/LEGACY_IMAGE_PROVENANCE_INVENTORY.json
      - 01-foundations/NIST_RMF_SP_800-53/NIST_RMF_and_SP_800-53_Release_5.2.0_Practical_Manual_v1.0.docx
      - 05-operational-resilience/Incident_Response_BCDR/Incident_Response_Business_Continuity_and_Disaster_Recovery_Manual_v1.0.docx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4
        with:
          ref: audit/nist-rmf-incident-response-localized-figures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate localized review candidates
        run: python scripts/generate_nist_rmf_incident_response_localized_review_figures.py

      - name: Validate review candidates
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          out = Path('review/nist-rmf-incident-response-localized-figures')
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          if len(manifest) != 20:
              raise SystemExit(f'Expected 20 manifest records, found {len(manifest)}')
          counts = {
              'NIST RMF / SP 800-53': sum(item['manual_family'] == 'NIST RMF / SP 800-53' for item in manifest),
              'Incident Response / BCDR': sum(item['manual_family'] == 'Incident Response / BCDR' for item in manifest),
          }
          if counts != {'NIST RMF / SP 800-53': 10, 'Incident Response / BCDR': 10}:
              raise SystemExit(f'Unexpected family counts: {counts}')
          files = {item['review_file'] for item in manifest}
          if len(files) != 20:
              raise SystemExit('Review file paths are not unique')
          for item in manifest:
              path = Path(item['review_file'])
              if not path.is_file():
                  raise SystemExit(f'Missing review file: {path}')
              if hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit(f'SHA-256 mismatch: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.format != 'PNG' or image.size != (item['width'], item['height']):
                      raise SystemExit(f'PNG validation failed: {path}')
              if item['status'] != 'review_only_pending_owner_approval':
                  raise SystemExit(f'Unexpected status: {item["inventory_id"]}')
          print('All 20 Batch 4 review candidates validated.')
          PY

      - name: Commit validated review candidates
        run: |
          if git status --short -- review/nist-rmf-incident-response-localized-figures | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f review/nist-rmf-incident-response-localized-figures
            git commit -m 'Generate Batch 4 localized review figures'
            git push origin HEAD:audit/nist-rmf-incident-response-localized-figures
          else
            echo 'Batch 4 review candidates unchanged.'
          fi

      - name: Upload review candidates
        uses: actions/upload-artifact@v4
        with:
          name: nist-rmf-incident-response-localized-review-candidates
          path: review/nist-rmf-incident-response-localized-figures
          if-no-files-found: error
          retention-days: 30
