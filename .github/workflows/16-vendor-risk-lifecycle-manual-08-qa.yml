name: "16 - Vendor Risk Lifecycle Manual 08 QA"

on:
  pull_request:
    branches:
      - "build/ai-security-lifecycle-manual-07-2026"
    paths:
      - "07-third-party-risk/Vendor_Risk_Lifecycle/**"
      - ".compliance/vendor-risk-lifecycle-manual-08-baseline.json"
      - ".compliance/authoritative-sources.json"
      - ".compliance/manual-catalog.json"
      - "scripts/vendor_risk_lifecycle_manual_08_qa.py"
      - "scripts/compliance_qa.py"
      - ".github/workflows/16-vendor-risk-lifecycle-manual-08-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-risk-lifecycle-manual-08-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vendor-risk-lifecycle-manual-08:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Manual 08 controlled implementation intake
        run: python3 scripts/vendor_risk_lifecycle_manual_08_qa.py
      - name: Validate authoritative-source registry
        run: python3 scripts/compliance_qa.py sources
      - name: Validate controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog
