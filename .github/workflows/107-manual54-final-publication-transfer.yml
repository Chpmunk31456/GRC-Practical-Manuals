name: Manual 54 final publication transfer

on:
  push:
    branches:
      - publish/manual54-final-2026-09-02
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/manual54-final-2026-09-02
          fetch-depth: 0

      - name: Download frozen Manual 54 artifact
        uses: actions/download-artifact@v4
        with:
          name: manual54-six-binary-candidate
          run-id: 33573951471
          github-token: ${{ github.token }}
          repository: Chpmunk31456/GRC-Practical-Manuals
          path: /tmp/manual54-artifact

      - name: Verify exact frozen hashes and bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/manual54-artifact')
          expected={
            'Manual_54_AI_Model_Risk_Validation_EN.docx':(40875,'9353e2a96cd08156c4c62ed11b33dd7779cbb29bbbac7e6e001103e27dda6cd2'),
            'Manual_54_AI_Model_Risk_Validation_EN.pdf':(71920,'57d6d0de581fd5a3e8c01bde103c95dd89446bd6878961ad0c7fd768fab09449'),
            'Manual_54_AI_Model_Risk_Validation_ES-419.docx':(40541,'6a9f83336db8582eb4d2f6aaa073ec716298ec5020a6fbd4275a0054ca057b99'),
            'Manual_54_AI_Model_Risk_Validation_ES-419.pdf':(68584,'553ce047f4c4332480664150c5fd4c316e582a2c9e30e3625d7aed8e0f93d302'),
            'Manual_54_AI_Model_Risk_Validation_PT-BR.docx':(40574,'870678cf48923ef0fa8af0f82e0b9f81e0f66245a2f6b63ad8325e78fd70ed40'),
            'Manual_54_AI_Model_Risk_Validation_PT-BR.pdf':(69902,'508a381708d6a308d0d4880532c8574ee6ff9c7f49cb183c52fc69909ad41a07'),
          }
          found={p.name:p for p in root.rglob('*') if p.is_file() and p.name in expected}
          assert set(found)==set(expected)
          for name,(size,sha) in expected.items():
              data=found[name].read_bytes(); assert len(data)==size; assert hashlib.sha256(data).hexdigest()==sha
              print('verified',name,size,sha)
          PY

      - name: Stage exact bytes, controlled sources and publication registries
        shell: bash
        run: |
          set -euo pipefail
          ROOT='10-ai-governance/Manual_54_AI_Model_Risk_Validation'
          mkdir -p "$ROOT/controlled/en" "$ROOT/controlled/es-419" "$ROOT/controlled/pt-BR" "$ROOT/qa"
          find /tmp/manual54-artifact -type f \( -name '*.docx' -o -name '*.pdf' \) -exec cp {} "$ROOT/" \;
          manifest=$(find /tmp/manual54-artifact -name MANUAL_54_CANDIDATE_MANIFEST.json -type f -print -quit); test -n "$manifest"; cp "$manifest" "$ROOT/qa/MANUAL_54_CANDIDATE_MANIFEST.json"
          git fetch origin release/manual54-candidate-2026-09-01
          git show origin/release/manual54-candidate-2026-09-01:"$ROOT/controlled/en/MANUAL_54_CONTROLLED_EN.md" > "$ROOT/controlled/en/MANUAL_54_CONTROLLED_EN.md"
          git show origin/release/manual54-candidate-2026-09-01:"$ROOT/controlled/es-419/MANUAL_54_CONTROLLED_ES_419.md" > "$ROOT/controlled/es-419/MANUAL_54_CONTROLLED_ES_419.md"
          git show origin/release/manual54-candidate-2026-09-01:"$ROOT/controlled/pt-BR/MANUAL_54_CONTROLLED_PT_BR.md" > "$ROOT/controlled/pt-BR/MANUAL_54_CONTROLLED_PT_BR.md"
          python - <<'PY'
          from pathlib import Path
          import json
          cp=Path('.compliance/manual-catalog.json'); c=json.loads(cp.read_text()); ms=c.setdefault('manuals',[])
          e={'id':'manual-54-ai-model-risk-validation','title':'Manual 54 — AI Model Risk Management & Independent Validation','path':'10-ai-governance/Manual_54_AI_Model_Risk_Validation','layout':'controlled-build','series_order':54,'status':'published','release_state':'published'}
          idx=[i for i,m in enumerate(ms) if m.get('series_order')==54 or m.get('id')==e['id'] or m.get('path')==e['path']]
          if idx:
              ms[idx[0]]=e
              for i in reversed(idx[1:]): del ms[i]
          else: ms.append(e)
          cp.write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          rp=Path('.compliance/work-product-releases.json'); r=json.loads(rp.read_text()); ps=r.setdefault('released_work_products',[])
          rid=e['id']; ev='Manual 54 exact trilingual candidate: workflow 33573951471, artifact 9825953331, source head f4b0de7a66368a69a0133c6c15c1adcd9c6d3d69, archive digest sha256:8c6295fe257cc1ec64282ff73f1775b65606689272bd90e425b45c462769f0f6. Six DOCX/PDF binaries passed deterministic build, visible-text, raster-render and MRM-01 through MRM-16 parity checks; exact bytes were hash/size verified before durable staging. Predecessor Manual 53 is published.'
          ne={'id':rid,'type':'manual','release_state':'published','release_evidence':ev}; ix=[i for i,p in enumerate(ps) if p.get('id')==rid]
          if ix: ps[ix[0]]=ne
          else: ps.append(ne)
          r['last_updated']='2026-09-02'; rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Remove temporary workflow and commit publication transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/107-manual54-final-publication-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Manual 54 exact frozen binaries and registry state'
          git push origin HEAD:publish/manual54-final-2026-09-02
