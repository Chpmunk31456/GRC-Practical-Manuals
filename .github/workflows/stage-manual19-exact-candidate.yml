name: "Stage Manual 19 exact candidate"

on:
  push:
    branches:
      - release/manual19-durable-staging-2026-08-31
    paths:
      - ".github/workflows/stage-manual19-exact-candidate.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage:
    if: github.event.head_commit.message != 'Stage Manual 19 exact candidate and remove staging workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/manual19-durable-staging-2026-08-31
          fetch-depth: 0
      - name: Download bound candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual19-candidate
          mkdir -p /tmp/manual19-candidate
          gh run download 33366244377 --repo "$GITHUB_REPOSITORY" --name manual19-six-binary-candidate --dir /tmp/manual19-candidate
      - name: Verify exact candidate hashes and stage publication tree
        run: |
          set -euo pipefail
          cd /tmp/manual19-candidate
          echo '8be565e36f5b5111aebe3954bf6a80f0bedc51d099575d80c0262ed520a04b0a  Manual_19_FedRAMP_FISMA_Controlled_EN.docx' | sha256sum -c -
          echo '30c873924814994d5ce0c96aa0d8d0433715a50d9dcd37701b5ff3b3e0bd8ed4  Manual_19_FedRAMP_FISMA_Controlled_EN.pdf' | sha256sum -c -
          echo '026f15c21c3441be9688a314d22a0c7d3937f51ba4b7a10d5e22ce35bf33539e  Manual_19_FedRAMP_FISMA_Controlled_ES-419.docx' | sha256sum -c -
          echo '639b039e2d918625fb3acff416ad0e2bcdc28573a8a959118c73f3bd5b78e7b4  Manual_19_FedRAMP_FISMA_Controlled_ES-419.pdf' | sha256sum -c -
          echo '384480e1a212519b50dfe615fa4e87b1a01d9481288e680959e1a1aedbf7a6f3  Manual_19_FedRAMP_FISMA_Controlled_PT-BR.docx' | sha256sum -c -
          echo '43cacc4bcc1fe0883b9d2c9c8c6a777dd91dab3a1f795f43b16738418736cda6  Manual_19_FedRAMP_FISMA_Controlled_PT-BR.pdf' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          base='04-regulatory-compliance/FedRAMP_FISMA_Controlled_Implementation/publication'
          mkdir -p "$base/en" "$base/es-419" "$base/pt-BR"
          cp /tmp/manual19-candidate/Manual_19_FedRAMP_FISMA_Controlled_EN.docx "$base/en/"
          cp /tmp/manual19-candidate/Manual_19_FedRAMP_FISMA_Controlled_EN.pdf "$base/en/"
          cp /tmp/manual19-candidate/Manual_19_FedRAMP_FISMA_Controlled_ES-419.docx "$base/es-419/"
          cp /tmp/manual19-candidate/Manual_19_FedRAMP_FISMA_Controlled_ES-419.pdf "$base/es-419/"
          cp /tmp/manual19-candidate/Manual_19_FedRAMP_FISMA_Controlled_PT-BR.docx "$base/pt-BR/"
          cp /tmp/manual19-candidate/Manual_19_FedRAMP_FISMA_Controlled_PT-BR.pdf "$base/pt-BR/"
          rm .github/workflows/stage-manual19-exact-candidate.yml
      - name: Commit exact bytes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage Manual 19 exact candidate and remove staging workflow'
          git push origin HEAD:release/manual19-durable-staging-2026-08-31
