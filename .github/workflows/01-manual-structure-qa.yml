name: "01 - Manual Structure QA"

on:
  pull_request:
    branches:
      - main
    paths:
      - "01-foundations/**"
      - "02-management-systems/**"
      - "03-assurance-and-audit/**"
      - "04-regulatory-compliance/**"
      - "05-operational-resilience/**"
      - "06-cloud-and-technology-risk/**"
      - "07-third-party-risk/**"
      - "08-templates-and-tools/**"
      - "10-ai-governance/**"
      - ".compliance/manual-catalog.json"
      - "scripts/compliance_qa.py"
      - "scripts/compliance_qa_controlled_build.py"
      - ".github/workflows/01-manual-structure-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-structure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manual-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the controlled manual catalog
        run: python3 scripts/compliance_qa_controlled_build.py catalog
      - name: Validate repository and publication structure
        run: python3 scripts/compliance_qa_controlled_build.py structure
