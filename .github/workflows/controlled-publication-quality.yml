name: Controlled Publication Quality

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".compliance/**"
      - "governance/**"
      - "qa/**"
      - "docs/**"
      - "0*/**"
      - "10-ai-governance/**"
      - "WRITING_SYSTEM_RECOVERY.md"
      - ".github/workflows/controlled-publication-quality.yml"
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-publication-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-publication-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Provision and verify PDF inspection tools
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y poppler-utils
          fi
          command -v pdftotext
          command -v pdfinfo
          pdftotext -v 2>&1 | head -n 1
          pdfinfo -v 2>&1 | head -n 1

      - name: Test Phase 4 controls
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/controlled_publication_qa.py
          python -m py_compile scripts/publication_roundtrip_qa.py
          python -m py_compile scripts/publication_layout_qa.py
          python -m py_compile scripts/publication_accessibility_qa.py
          python -m py_compile scripts/semantic_writing_qa.py
          python -m py_compile scripts/writing_observability_history.py
          python -m py_compile scripts/writing_system_recovery_exercise.py

      - name: Validate every registered publication
        run: python scripts/repository_publication_qa.py --output /tmp/publication-e2e.json

      - name: Enforce observability baseline
        if: always()
        run: python scripts/writing_observability_history.py /tmp/publication-e2e.json --output /tmp/publication-observability.json

      - name: Exercise disaster recovery
        run: |
          python scripts/writing_system_recovery_exercise.py             --require-pdf-tools             --output /tmp/recovery-exercise.json

      - name: Report translation dependencies
        run: python scripts/translation_lifecycle.py --output /tmp/translation-lifecycle.json

      - name: Produce publication quality summary
        if: always()
        run: python scripts/publication_dashboard.py --output /tmp/publication-dashboard.json --summary /tmp/publication-dashboard.md

      - name: Report independent accessibility requirements
        run: python scripts/accessibility_validation.py --output /tmp/accessibility-review.json

      - name: Generate exact reviewer-readiness packets
        run: python scripts/review_readiness_packets.py --queue /tmp/review-readiness-queue.json --packet-dir /tmp/review-readiness-packets

      - name: Verify backup restoration and recovered tests
        run: python scripts/production_recovery.py --output /tmp/production-recovery.json

      - name: Measure publication performance and verify gate equivalence
        run: python scripts/publication_performance.py --output /tmp/publication-performance.json
      - name: Retain sanitized production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-control-evidence
          path: |
            /tmp/publication-performance.json
            /tmp/production-recovery.json
            /tmp/publication-dashboard.json
            /tmp/publication-dashboard.md
            /tmp/accessibility-review.json
            /tmp/review-readiness-queue.json
            /tmp/review-readiness-packets/*.json
          retention-days: 30
