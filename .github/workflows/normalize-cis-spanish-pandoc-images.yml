name: Normalize CIS Spanish Pandoc images

on:
  workflow_dispatch:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - 'qa/requests/NORMALIZE_CIS_SPANISH_PANDOC_IMAGES.md'
      - 'qa/tools/normalize_cis_spanish_pandoc_images.py'
      - '.github/workflows/normalize-cis-spanish-pandoc-images.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Normalize Spanish CIS image references
        run: python3 qa/tools/normalize_cis_spanish_pandoc_images.py

      - name: Refresh CIS Spanish audit
        id: audit
        continue-on-error: true
        run: python3 qa/tools/audit_cis_spanish_full_manual.py

      - name: Commit normalized source and refreshed audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md' \
            'qa/CIS_CONTROLS_V8_1_ES_FULL_MANUAL_AUDIT.md'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Normalize CIS Spanish images for Pandoc embedding'
            git push origin HEAD:production/multilingual-grc-editions
          fi

      - name: Report remaining audit status
        if: steps.audit.outcome != 'success'
        run: echo 'Image references were normalized; remaining publication defects are recorded in the refreshed audit.'
