name: Repository localized release audit v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/triggers/repository-localized-release-audit-v2.md'

permissions:
  contents: write

concurrency:
  group: repository-localized-release-audit-v2
  cancel-in-progress: false

jobs:
  audit-and-record:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out production candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Install audit tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip
          python -m pip install --upgrade pip pillow

      - name: Run corrected repository-wide localized package audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, tempfile, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from PIL import Image, ImageStat

          ROOT = Path('.')
          QA = ROOT / 'qa'
          QA.mkdir(exist_ok=True)
          OUT_JSON = QA / 'REPOSITORY_LOCALIZED_AUTOMATED_RELEASE_AUDIT.json'
          OUT_MD = QA / 'REPOSITORY_LOCALIZED_AUTOMATED_RELEASE_AUDIT.md'
          NS = {
              'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main',
              'r': 'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
              'a': 'http://schemas.openxmlformats.org/drawingml/2006/main',
              'wp': 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing',
              'dc': 'http://purl.org/dc/elements/1.1/',
          }

          mds = sorted(p for p in ROOT.rglob('*.md') if any(x in {'Espanol','Portugues_BR'} for x in p.parts) and '/qa/' not in p.as_posix())
          failures, warnings, editions = [], [], []

          def command(args):
              return subprocess.run(args, check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE).stdout

          for md in mds:
              # Preserve dotted version names such as v1.0; replace only the terminal .md.
              docx = Path(md.as_posix()[:-3] + '.docx')
              pdf = Path(md.as_posix()[:-3] + '.pdf')
              language = 'es-419' if 'Espanol' in md.parts else 'pt-BR'
              item = {'language': language, 'markdown': md.as_posix(), 'docx': docx.as_posix(), 'pdf': pdf.as_posix(), 'checks': {}, 'status': 'PASS'}
              item_failures = []

              text = md.read_text(encoding='utf-8', errors='replace')
              refs = []
              refs += re.findall(r'!\[[^\]]*\]\(([^)\s]+)', text)
              refs += re.findall(r'<img\b[^>]*\bsrc=["\']([^"\']+)', text, flags=re.I)
              refs = [x for x in refs if not re.match(r'^[a-z]+://', x, flags=re.I)]
              missing_refs = [x for x in refs if not (md.parent / x).exists()]
              item['checks']['source_local_image_references'] = len(refs)
              item['checks']['missing_local_images'] = missing_refs
              if missing_refs:
                  item_failures.append(f'{md}: missing local images {missing_refs}')

              if not docx.exists() or docx.stat().st_size == 0:
                  item_failures.append(f'{docx}: missing or empty DOCX')
              else:
                  try:
                      with zipfile.ZipFile(docx) as zf:
                          bad = zf.testzip()
                          if bad:
                              item_failures.append(f'{docx}: corrupt ZIP member {bad}')
                          names = set(zf.namelist())
                          required = {'word/document.xml','word/_rels/document.xml.rels','docProps/core.xml'}
                          absent = sorted(required - names)
                          if absent:
                              item_failures.append(f'{docx}: missing OOXML members {absent}')
                          if 'word/document.xml' in names:
                              root = ET.fromstring(zf.read('word/document.xml'))
                              headings = root.findall('.//w:pStyle', NS)
                              tables = root.findall('.//w:tbl', NS)
                              embeds = [x.attrib.get('{%s}embed' % NS['r']) for x in root.findall('.//a:blip', NS)]
                              docprs = root.findall('.//wp:docPr', NS)
                              missing_alt = [x.attrib.get('id') for x in docprs if not (x.attrib.get('descr') or '').strip()]
                              item['checks'].update({'docx_heading_style_occurrences':len(headings),'docx_tables':len(tables),'docx_embedded_image_occurrences':len([x for x in embeds if x]),'docx_images_missing_alt_text':len(missing_alt)})
                              if not headings:
                                  warnings.append(f'{docx}: no explicit heading-style occurrences detected')
                              if missing_alt:
                                  item_failures.append(f'{docx}: {len(missing_alt)} embedded image object(s) lack alternative text')
                          if 'docProps/core.xml' in names:
                              core = ET.fromstring(zf.read('docProps/core.xml'))
                              title = (core.findtext('dc:title', default='', namespaces=NS) or '').strip()
                              creator = (core.findtext('dc:creator', default='', namespaces=NS) or '').strip()
                              item['checks']['docx_core_title_present'] = bool(title)
                              item['checks']['docx_core_creator_present'] = bool(creator)
                              if not title: warnings.append(f'{docx}: core metadata title is empty')
                              if not creator: warnings.append(f'{docx}: core metadata creator is empty')
                  except (zipfile.BadZipFile, ET.ParseError) as exc:
                      item_failures.append(f'{docx}: OOXML parse failure {exc}')

              if not pdf.exists() or pdf.stat().st_size == 0:
                  item_failures.append(f'{pdf}: missing or empty PDF')
              else:
                  try:
                      info = command(['pdfinfo', str(pdf)])
                      match = re.search(r'^Pages:\s+(\d+)', info, flags=re.M)
                      pages = int(match.group(1)) if match else 0
                      title_match = re.search(r'^Title:\s*(.*)$', info, flags=re.M)
                      title_present = bool(title_match and title_match.group(1).strip())
                      text_out = command(['pdftotext', str(pdf), '-']).strip()
                      item['checks'].update({'pdf_pages':pages,'pdf_title_present':title_present,'pdf_searchable_characters':len(text_out)})
                      if pages < 1: item_failures.append(f'{pdf}: zero or unavailable page count')
                      if len(text_out) < 100: item_failures.append(f'{pdf}: insufficient searchable text')
                      if not title_present: warnings.append(f'{pdf}: PDF title metadata is empty')
                      samples=[]
                      if pages:
                          with tempfile.TemporaryDirectory() as td:
                              for pageno in sorted(set([1,max(1,(pages+1)//2),pages])):
                                  prefix=Path(td)/f'p{pageno}'
                                  subprocess.run(['pdftoppm','-f',str(pageno),'-l',str(pageno),'-singlefile','-png','-r','96',str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                                  with Image.open(prefix.with_suffix('.png')).convert('L') as im:
                                      mean=ImageStat.Stat(im).mean[0]
                                      nonwhite=sum(1 for v in im.resize((100,140)).getdata() if v<250)
                                      blank=nonwhite<5
                                      samples.append({'page':pageno,'mean_gray':round(mean,2),'sample_nonwhite':nonwhite,'blank':blank})
                                      if blank: item_failures.append(f'{pdf}: sampled page {pageno} blank or near-blank')
                      item['checks']['pdf_sampled_raster_pages']=samples
                  except (subprocess.CalledProcessError, ValueError) as exc:
                      item_failures.append(f'{pdf}: PDF audit failure {exc}')

              if item_failures:
                  item['status']='FAIL'
                  failures.extend(item_failures)
              editions.append(item)

          if len(editions) < 22:
              failures.append(f'repository inventory: expected at least 22 localized editions, found {len(editions)}')

          sha=command(['git','rev-parse','HEAD']).strip()
          report={'candidate_sha':sha,'localized_editions':len(editions),'status':'FAIL' if failures else 'PASS','failures':failures,'warnings':warnings,'editions':editions,'limitations':['Automated checks do not constitute native-language approval.','Automated checks do not constitute legal, regulatory, standards-currency, or technical approval.','Raster sampling covers first, middle, and final pages; it is not a human page-by-page visual review.','Assistive-technology behavior and reading order require human testing in native applications.']}
          OUT_JSON.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          lines=['# Repository Localized Automated Release Audit','',f'- Candidate SHA: `{sha}`',f'- Localized editions inspected: {len(editions)}',f"- Automated result: **{report['status']}**",f'- Failures: {len(failures)}',f'- Warnings: {len(warnings)}','','## Automated scope','','- Markdown/DOCX/PDF triplet inventory','- Local image-reference resolution','- DOCX ZIP/XML integrity, headings, tables, embedded images, alternative text, and core metadata','- PDF page count, searchable text, title metadata, and first/middle/final raster sampling','- Repository-wide embedded-media validation','']
          if failures: lines += ['## Failures','']+[f'- {x}' for x in failures]+['']
          if warnings: lines += ['## Warnings','']+[f'- {x}' for x in warnings]+['']
          lines += ['## Human gates not replaced','']+[f'- {x}' for x in report['limitations']]+['']
          OUT_MD.write_text('\n'.join(lines),encoding='utf-8')
          Path('/tmp/audit_status.txt').write_text(report['status'],encoding='utf-8')
          print(f"Corrected localized release audit: {report['status']} ({len(failures)} failures, {len(warnings)} warnings)")
          PY
          echo "status=$(cat /tmp/audit_status.txt)" >> "$GITHUB_OUTPUT"

      - name: Run repository embedded-media validator
        run: |
          set -euo pipefail
          python3 scripts/validate_docx_embedded_media.py

      - name: Commit corrected exact-candidate audit evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/REPOSITORY_LOCALIZED_AUTOMATED_RELEASE_AUDIT.json qa/REPOSITORY_LOCALIZED_AUTOMATED_RELEASE_AUDIT.md
          if git diff --cached --quiet; then
            echo 'Audit evidence unchanged.'
          else
            git commit -m 'Record corrected repository localized release audit'
            git push origin HEAD:production/multilingual-grc-editions
          fi

      - name: Upload corrected audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-localized-automated-release-audit-v2
          path: |
            qa/REPOSITORY_LOCALIZED_AUTOMATED_RELEASE_AUDIT.json
            qa/REPOSITORY_LOCALIZED_AUTOMATED_RELEASE_AUDIT.md
          if-no-files-found: error

      - name: Enforce corrected automated gate
        if: always()
        run: |
          set -euo pipefail
          test '${{ steps.audit.outputs.status }}' = 'PASS'
