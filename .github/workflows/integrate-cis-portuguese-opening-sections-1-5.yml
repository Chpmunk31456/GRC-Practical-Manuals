name: Audit CIS Portuguese final source

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'qa/requests/TRIGGER_CIS_PORTUGUESE_OPENING_FROM_MAIN.md'

permissions:
  contents: write

concurrency:
  group: cis-portuguese-controlled-writes
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Refresh Portuguese full-manual audit
        run: python3 qa/tools/audit_cis_portuguese_full_manual.py

      - name: Require structural PASS
        run: grep -q '^\*\*PASS\*\*$' qa/CIS_CONTROLS_V8_1_PTBR_FULL_MANUAL_AUDIT.md

      - name: Commit final audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/CIS_CONTROLS_V8_1_PTBR_FULL_MANUAL_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git commit -m 'Record final CIS Portuguese structural audit'
          for attempt in 1 2 3; do
            if git push origin HEAD:production/multilingual-grc-editions; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            sleep $((attempt * 5))
          done
