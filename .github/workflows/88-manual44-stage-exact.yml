name: "88 - Manual 44 Exact-Byte Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/88-manual44-stage-exact.yml"

permissions:
  actions: read
  contents: write

jobs:
  stage-exact-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Download frozen Manual 44 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9778053898/zip" \
            --output manual44-candidate.zip
          rm -rf candidate
          mkdir candidate
          unzip -q manual44-candidate.zip -d candidate
      - name: Verify immutable candidate identities
        run: |
          set -euo pipefail
          cd candidate
          echo "a0e37a4d015e8b1e11b73d241f5f7daefb6cc45b28bf38ea492eea538cf154a8  Manual_44_NIST_SSDF_SP_800-218_Controlled_EN.docx" | sha256sum -c -
          echo "c766fe9649a78d3487e9c8400cfe6b72fa7c8d5a280d90fb760518ed6c7351bd  Manual_44_NIST_SSDF_SP_800-218_Controlled_EN.pdf" | sha256sum -c -
          echo "cbcfe93b3ecaf2f415541f0a7aafc8f8fab1523f91887df1858489619f64521f  Manual_44_NIST_SSDF_SP_800-218_Controlled_ES-419.docx" | sha256sum -c -
          echo "80f3467ef2e294cbcc30dded61881855c19bc98f193d3a7b8c4c20c3be07d2e8  Manual_44_NIST_SSDF_SP_800-218_Controlled_ES-419.pdf" | sha256sum -c -
          echo "910a8cbe1d7ffb7701d220d35a162c2c69967e7926de20713cdc18df7b6e32b6  Manual_44_NIST_SSDF_SP_800-218_Controlled_PT-BR.docx" | sha256sum -c -
          echo "6b26602c65fb64fe29b609124e23b8945a6241474995ea0482d62532eba662a7  Manual_44_NIST_SSDF_SP_800-218_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact publication bytes and self-remove
        run: |
          set -euo pipefail
          root="06-cloud-and-technology-risk/NIST_SSDF_SP_800-218_Controlled_Implementation/publication"
          mkdir -p "$root/en" "$root/es-419" "$root/pt-BR"
          cp candidate/Manual_44_NIST_SSDF_SP_800-218_Controlled_EN.docx "$root/en/"
          cp candidate/Manual_44_NIST_SSDF_SP_800-218_Controlled_EN.pdf "$root/en/"
          cp candidate/Manual_44_NIST_SSDF_SP_800-218_Controlled_ES-419.docx "$root/es-419/"
          cp candidate/Manual_44_NIST_SSDF_SP_800-218_Controlled_ES-419.pdf "$root/es-419/"
          cp candidate/Manual_44_NIST_SSDF_SP_800-218_Controlled_PT-BR.docx "$root/pt-BR/"
          cp candidate/Manual_44_NIST_SSDF_SP_800-218_Controlled_PT-BR.pdf "$root/pt-BR/"
          cat > .compliance/MANUAL_44_EXACT_STAGED_HEAD_QA_2026-08-31.md <<'EOF'
          # Manual 44 — Exact Staged-Head QA Handoff

          The six NIST SSDF / SP 800-218 publication binaries on this branch match the frozen Manual 44 candidate from workflow run `33446019599` / artifact `9778053898`. The staging transaction verified every provenance-bound SHA-256 identity before copying the exact bytes. This marker changes no reviewed binary and exists to attach ordinary repository QA to the cleaned exact staged head after this temporary workflow removes itself.
          EOF
          git rm .github/workflows/88-manual44-stage-exact.yml
          git add "$root" .compliance/MANUAL_44_EXACT_STAGED_HEAD_QA_2026-08-31.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage exact Manual 44 publication bytes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
