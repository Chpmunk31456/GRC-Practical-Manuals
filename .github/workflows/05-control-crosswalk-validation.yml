name: "05 - Control Crosswalk Validation"

on:
  pull_request:
    branches:
      - main
    paths:
      - "08-templates-and-tools/Control_Mapping_and_Crosswalk/**"
      - "scripts/compliance_qa.py"
      - ".github/workflows/05-control-crosswalk-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-crosswalk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-crosswalk-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate crosswalk schemas and record identifiers
        run: python3 scripts/compliance_qa.py crosswalks
