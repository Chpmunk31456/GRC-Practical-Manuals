name: Rebaseline ISO Spanish controlled source

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/requests/TRIGGER_ISO_SPANISH_CONTROLLED_REBASELINE.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebaseline-iso-spanish-controlled
  cancel-in-progress: false

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0
      - name: Restore exact reviewed baseline
        run: |
          set -euo pipefail
          target='02-management-systems/ISO_IEC_27001_27002/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md'
          git fetch origin fix/publication-readiness-batch-1-spanish
          git show origin/fix/publication-readiness-batch-1-spanish:"$target" > "$target"
          test "$(git hash-object "$target")" = '1dec4df93c0ce5c279d958d56ed23553535c0170'
      - name: Apply validated cleanup batch 01
        run: python3 qa/tools/repair_iso_spanish_recovered_baseline_batch_01.py
      - name: Apply validated parity batch A
        run: python3 qa/tools/repair_iso_spanish_parity_batch_a.py
      - name: Run strengthened localized-source audit
        id: audit
        continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_sources.py
      - name: Run section-level parity audit
        id: parity
        continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_section_parity.py
      - name: Commit controlled Spanish source and evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '02-management-systems/ISO_IEC_27001_27002/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md' \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.md \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.json \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.md \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Rebaseline ISO Spanish source with validated repairs'
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            git push origin HEAD:production/multilingual-grc-editions
          fi
      - name: Enforce remaining blockers
        if: steps.audit.outcome != 'success' || steps.parity.outcome != 'success'
        run: |
          echo 'Controlled Spanish source remains fail-closed; see committed evidence.'
          exit 1
