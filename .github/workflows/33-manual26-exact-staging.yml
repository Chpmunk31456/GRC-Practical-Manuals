name: "33 - Manual 26 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/33-manual26-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 26 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual26-candidate
          mkdir -p /tmp/manual26-candidate
          gh run download 33391892785 -R "$GITHUB_REPOSITORY" -n manual26-six-binary-candidate -D /tmp/manual26-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual26-candidate
          printf '%s  %s\n' \
            bd5198b29e75a5b27555674452af97c17896315ae652578e7118c60afadabafa Manual_26_Incident_Response_Cyber_Crisis_Controlled_EN.docx \
            3de26e8361dee87ed5594f1db1eb6a0df56b4e6081d511364039f90cde3184cc Manual_26_Incident_Response_Cyber_Crisis_Controlled_EN.pdf \
            eb9ff6773cbb06b883cdc71857c04f909c5202939eaeb12597978772deb69db7 Manual_26_Incident_Response_Cyber_Crisis_Controlled_ES-419.docx \
            412a1597938dc28fc37ecb8e364399d6259cfa1586e9947ed04ade0c8bd36e18 Manual_26_Incident_Response_Cyber_Crisis_Controlled_ES-419.pdf \
            5e0a7ca31d441e092deb6781ea2fbc02f43ca5c84a4cf0882bae1726e8914a0a Manual_26_Incident_Response_Cyber_Crisis_Controlled_PT-BR.docx \
            6f57f7c9dd8ab7488ce45d197cbcb75e19185a588dfa9d444f1607211a09dceb Manual_26_Incident_Response_Cyber_Crisis_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='05-operational-resilience/Incident_Response_Cyber_Crisis_Management/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual26-candidate/Manual_26_Incident_Response_Cyber_Crisis_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual26-candidate/Manual_26_Incident_Response_Cyber_Crisis_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual26-candidate/Manual_26_Incident_Response_Cyber_Crisis_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual26-candidate/Manual_26_Incident_Response_Cyber_Crisis_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual26-candidate/Manual_26_Incident_Response_Cyber_Crisis_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual26-candidate/Manual_26_Incident_Response_Cyber_Crisis_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/33-manual26-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/33-manual26-exact-staging.yml
          git commit -m 'Stage Manual 26 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
