name: Diagnose ISO Spanish final sections

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/requests/TRIGGER_ISO_SPANISH_FINAL_SECTION_DIAGNOSTIC.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0
      - run: python3 qa/tools/diagnose_iso_spanish_final_sections.py
      - name: Commit evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/ISO_IEC_27001_27002_ES_FINAL_SECTION_DIAGNOSTIC.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record ISO Spanish final-section diagnostic'
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            git push origin HEAD:production/multilingual-grc-editions
          fi
