name: "ZZ - Manual 37 Publication Reconcile"

on:
  push:
    branches:
      - publish/manual37-colombia-2026-08-31
    paths:
      - "scripts/reconcile_manual37_publication.py"
      - ".github/workflows/zz-manual37-publication-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: publish/manual37-colombia-2026-08-31
          fetch-depth: 0
      - name: Reconcile publication state fail closed
        run: python scripts/reconcile_manual37_publication.py
      - name: Commit reconciled state and remove temporary reconciler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/reconcile_manual37_publication.py .github/workflows/zz-manual37-publication-reconcile.yml
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .compliance/MANUAL_37_PUBLICATION_HANDOFF_2026-08-31.md
          git commit -m "Reconcile Manual 37 published state"
          git push origin HEAD:publish/manual37-colombia-2026-08-31
