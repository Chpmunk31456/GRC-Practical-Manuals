name: Manual 47 publication registry reconcile

on:
  push:
    branches:
      - publish/manual47-final-binaries-2026-09-01

permissions:
  contents: write

jobs:
  reconcile-publication-records:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/manual47-final-binaries-2026-09-01
          fetch-depth: 0

      - name: Reconcile catalog and release registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          target = None
          for item in catalog.get('manuals', []):
              if item.get('series_order') == 47 or item.get('path') == '10-ai-governance/Manual_47_EU_AI_Act_Training':
                  target = item
                  break
          if target is None:
              target = {
                  'id': 'manual-47-eu-ai-act-training',
                  'title': 'Manual 47 — EU AI Act Training & Operationalization',
                  'path': '10-ai-governance/Manual_47_EU_AI_Act_Training',
                  'layout': 'controlled-build',
                  'series_order': 47,
              }
              catalog.setdefault('manuals', []).append(target)
          target['status'] = 'published'
          target['release_state'] = 'published'
          catalog['last_updated'] = '2026-09-01'
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          registry_path = Path('.compliance/work-product-releases.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          rid = target['id']
          entry = None
          for item in registry.get('released_work_products', []):
              if item.get('id') == rid:
                  entry = item
                  break
          if entry is None:
              entry = {'id': rid, 'type': 'manual'}
              registry.setdefault('released_work_products', []).append(entry)
          entry['release_state'] = 'published'
          entry['release_evidence'] = (
              'Manual 47 controlled trilingual package and clean-candidate release decision were reconciled through PRs #490, #491, #492, #496, #500, #503 and #504. '
              'The exact frozen six-binary candidate from workflow run 33529251541 / artifact 9809032518 / digest sha256:d3c668a9cd5330dbb56a0bd7d4af6b9d947eb14d69ee41d9000c412e187bc213 was transferred without regeneration after fail-closed SHA-256 verification. '
              'Durable publication files are EN DOCX/PDF e2a4b770952ebf67ead3a9806a29534b16fc052fb8f24221a790ca63c37b73f3 / eaf3aa6e7b5dea8ebe018393879e792c27dfc25ec964f7c52ca66aeaa48edc25; '
              'es-419 DOCX/PDF b867a54d28505fa6957c9a7c7d35a9e0b276535f4c78a2ebc25c00ebf760eaef / 2d92b5a168571f50c042a8c1a08b8659aef6b4c857f29f6ec9c7a52d9dbcff53; '
              'pt-BR DOCX/PDF 648f87ab3f78603b8ecd52fe009ed0d2eadb049f4587749e94f4d1ca3ec9a15d / 0c1cc67879558c5f36aff941c8103fdd180a14ab39114ea1145ce4883608e3ce. '
              'Standing repository-owner release authorization applies under the canonical clean-candidate automatic release rule because the exact candidate controls are green and no unresolved substantive defect is documented.'
          )
          registry['last_updated'] = '2026-09-01'
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Remove one-shot reconciliation workflow and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/98-manual47-publication-registry-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "No reconciliation changes found"; exit 1; } || true
          git commit -m "Reconcile Manual 47 published catalog and release registry"
          git push origin HEAD:publish/manual47-final-binaries-2026-09-01
