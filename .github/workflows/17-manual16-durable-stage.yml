name: "17 - Manual 16 Durable Stage"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/17-manual16-durable-stage.yml"
      - "02-management-systems/ISO_IEC_27001_27002/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-artifact:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Download exact green Manual 16 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: manual16-six-binary-candidate
          path: /tmp/manual16-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33347930892
      - name: Verify exact artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/manual16-candidate
          echo 'd5fdb1b5d2bf7d01dde13e9553534c77951f96994737fc4c5648c5722f82d206  Manual_16_ISO_IEC_27001_27002_Controlled_EN.docx' | sha256sum -c -
          echo 'cbcc87ff31faaff4fa1f20030a48342e23e369cdfabf966ad9018133b0a1879a  Manual_16_ISO_IEC_27001_27002_Controlled_EN.pdf' | sha256sum -c -
          echo '004f674a21d9e90d17d9ec349a4d81aee300b4f7e2ae34a4412256e754d90025  Manual_16_ISO_IEC_27001_27002_Controlled_ES-419.docx' | sha256sum -c -
          echo '0c01b378c3d16d6c290f20f575378d95fe4a5f820ac67d2dc8ff26381d6d5382  Manual_16_ISO_IEC_27001_27002_Controlled_ES-419.pdf' | sha256sum -c -
          echo 'ff74735811aeb26b55402cc05084a360337045d21544ad0d5a537453ecaef34e  Manual_16_ISO_IEC_27001_27002_Controlled_PT-BR.docx' | sha256sum -c -
          echo 'ed5ef1e2058037bd88876cff0eaea06c8e70f980a29cd2e488d3a006cd2c3320  Manual_16_ISO_IEC_27001_27002_Controlled_PT-BR.pdf' | sha256sum -c -
      - name: Stage exact binaries and provenance
        shell: bash
        run: |
          set -euo pipefail
          root='02-management-systems/ISO_IEC_27001_27002'
          mkdir -p "$root/publication/en" "$root/publication/es-419" "$root/publication/pt-BR"
          cp /tmp/manual16-candidate/Manual_16_ISO_IEC_27001_27002_Controlled_EN.docx "$root/publication/en/"
          cp /tmp/manual16-candidate/Manual_16_ISO_IEC_27001_27002_Controlled_EN.pdf "$root/publication/en/"
          cp /tmp/manual16-candidate/Manual_16_ISO_IEC_27001_27002_Controlled_ES-419.docx "$root/publication/es-419/"
          cp /tmp/manual16-candidate/Manual_16_ISO_IEC_27001_27002_Controlled_ES-419.pdf "$root/publication/es-419/"
          cp /tmp/manual16-candidate/Manual_16_ISO_IEC_27001_27002_Controlled_PT-BR.docx "$root/publication/pt-BR/"
          cp /tmp/manual16-candidate/Manual_16_ISO_IEC_27001_27002_Controlled_PT-BR.pdf "$root/publication/pt-BR/"
          cp /tmp/manual16-candidate/MANUAL_16_CANDIDATE_MANIFEST.json "$root/publication/MANUAL_16_CANDIDATE_MANIFEST.json"
          cat > "$root/publication/MANUAL_16_PROVENANCE.md" <<'EOF'
          # Manual 16 Publication Provenance

          Candidate workflow run: `33347930892`  
          Artifact ID: `9742628038`  
          Artifact digest: `sha256:f621e6330ee834ee8c0e3f596e4533070ed52e8e4996b339103b9d6dc0112e55`

          Exact artifact SHA-256 identities:
          - EN DOCX: `d5fdb1b5d2bf7d01dde13e9553534c77951f96994737fc4c5648c5722f82d206`
          - EN PDF: `cbcc87ff31faaff4fa1f20030a48342e23e369cdfabf966ad9018133b0a1879a`
          - ES-419 DOCX: `004f674a21d9e90d17d9ec349a4d81aee300b4f7e2ae34a4412256e754d90025`
          - ES-419 PDF: `0c01b378c3d16d6c290f20f575378d95fe4a5f820ac67d2dc8ff26381d6d5382`
          - PT-BR DOCX: `ff74735811aeb26b55402cc05084a360337045d21544ad0d5a537453ecaef34e`
          - PT-BR PDF: `ed5ef1e2058037bd88876cff0eaea06c8e70f980a29cd2e488d3a006cd2c3320`

          Render review completed against the exact artifact package before durable staging. No catalog or release-registry promotion is authorized by this record alone.
          EOF
      - name: Commit durable artifact staging to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 02-management-systems/ISO_IEC_27001_27002/publication
            git commit -m 'Stage exact Manual 16 publication binaries and provenance'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo 'Exact Manual 16 publication package already staged.'
          fi
