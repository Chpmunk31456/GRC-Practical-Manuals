name: Promote CIS Controls localized figures

on:
  push:
    branches:
      - audit/cis-controls-v8.1-localized-figures
    paths:
      - scripts/promote_cis_localized_figures.py
      - .github/workflows/promote-cis-controls-localized-figures.yml
      - review/cis-controls-v8.1-localized-figures/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CIS restoration branch
        uses: actions/checkout@v4
        with:
          ref: audit/cis-controls-v8.1-localized-figures

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Promote approved CIS figures
        run: python scripts/promote_cis_localized_figures.py

      - name: Verify final media and Markdown references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          es_md = root / '01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md'
          pt_md = root / '01-foundations/CIS_Controls_v8.1/Portugues_BR/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md'
          es_text = es_md.read_text(encoding='utf-8')
          pt_text = pt_md.read_text(encoding='utf-8')

          assert '![La especificación oficial pasa de los datos definidos' in es_text
          assert '<img src="media/image3.png"' not in es_text
          for number in range(1, 11):
              assert f'](media/image{number}.png)' in pt_text
              assert f'<img src="media/image{number}.png"' not in pt_text

          files = [es_md.parent / 'media/image3.png'] + [pt_md.parent / f'media/image{i}.png' for i in range(1, 11)]
          for path in files:
              if not path.exists():
                  raise SystemExit(f'Missing promoted image: {path}')
              with Image.open(path) as image:
                  image.verify()
          print('All 11 promoted CIS images and Markdown references verified.')
          PY

      - name: Commit promoted CIS restoration
        run: |
          if git status --short | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f \
              01-foundations/CIS_Controls_v8.1/Espanol/media/image3.png \
              01-foundations/CIS_Controls_v8.1/Portugues_BR/media/image*.png
            git add \
              01-foundations/CIS_Controls_v8.1/Espanol/*.md \
              01-foundations/CIS_Controls_v8.1/Portugues_BR/*.md \
              qa/images/LEGACY_IMAGE_PROVENANCE_INVENTORY.json
            git commit -m 'Promote approved CIS localized figures'
            git push
          else
            echo 'Promoted CIS restoration unchanged.'
          fi
