name: "17 - AI Governance and Audit Toolkit QA"

on:
  pull_request:
    branches:
      - "build/vendor-risk-lifecycle-manual-08-2026"
    paths:
      - "08-templates-and-tools/AI_Governance_and_Audit_Toolkit/**"
      - ".compliance/ai-governance-audit-toolkit-baseline.json"
      - ".compliance/isaca-aaia-source.json"
      - ".compliance/manual-catalog.json"
      - "scripts/ai_governance_audit_toolkit_qa.py"
      - "scripts/compliance_qa.py"
      - ".github/workflows/17-ai-governance-audit-toolkit-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-governance-audit-toolkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ai-governance-audit-toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate controlled toolkit intake and schemas
        run: python3 scripts/ai_governance_audit_toolkit_qa.py
      - name: Validate controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog
