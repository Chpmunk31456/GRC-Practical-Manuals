name: Audit ISO localized sources

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/requests/TRIGGER_CIS_PORTUGUESE_OPENING_FROM_MAIN.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-iso-localized-sources
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0
      - name: Apply structural repair batch 01
        run: python3 qa/tools/repair_iso_localized_structural_batch_01.py
      - name: Run fail-closed localized-source audit
        id: audit
        continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_sources.py
      - name: Commit repaired sources and audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '02-management-systems/ISO_IEC_27001_27002/Espanol/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md' \
            '02-management-systems/ISO_IEC_27001_27002/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md' \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.md \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply ISO localized structural repair batch 01'
            git push origin HEAD:production/multilingual-grc-editions
          fi
      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: |
          echo 'ISO localized-source audit remains fail-closed; see committed reports.'
          exit 1
