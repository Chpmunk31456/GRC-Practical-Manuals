name: "34 - Manual 13 Publication Candidate"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/34-manual13-publication-candidate.yml"
      - "04-regulatory-compliance/SOX_ITGC_ICFR_Controlled_Implementation/**"
      - ".compliance/sox-itgc-icfr-manual-13-*.json"
      - "scripts/generate_sox_itgc_icfr_manual_13_publication.py"
      - "scripts/run_sox_itgc_icfr_manual_13_publication.py"
      - "scripts/generate_ccpa_cpra_manual_12_publication.py"
      - "scripts/run_ccpa_cpra_manual_12_publication.py"
      - "scripts/pdf_content_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-publication-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LibreOffice conversion dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install publication dependencies
        run: python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate Manual 13 controlled publication package
        run: python3 scripts/run_sox_itgc_icfr_manual_13_publication.py --output-root "$RUNNER_TEMP/manual13-publication" --source-head "${{ github.event.pull_request.head.sha }}"
      - name: Fail closed on generated PDF content
        run: python3 scripts/pdf_content_preflight.py "$RUNNER_TEMP/manual13-publication/publication"
      - name: Upload controlled publication package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual13-publication-candidate
          path: |
            ${{ runner.temp }}/manual13-publication/publication
            ${{ runner.temp }}/manual13-publication/qa
            ${{ runner.temp }}/manual13-publication/contact-sheets
          if-no-files-found: error
          retention-days: 1
