name: "24 - Manual 22 Publication Reconciliation"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/24-manual22-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile Manual 22 publication state fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog_path=Path('.compliance/manual-catalog.json')
          release_path=Path('.compliance/work-product-releases.json')
          c=json.loads(catalog_path.read_text(encoding='utf-8'))
          r=json.loads(release_path.read_text(encoding='utf-8'))
          mid='cloud-security-controlled'
          if not any(x.get('series_order')==21 and x.get('status')=='published' for x in c['manuals']):
              raise SystemExit('Manual 21 predecessor is not published in catalog')
          if not any(x.get('id')=='ot-ics-security-controlled' and x.get('release_state')=='published' for x in r['released_work_products']):
              raise SystemExit('Manual 21 predecessor is not published in release registry')
          entry={
            'id':mid,
            'title':'Manual 22 — Cloud Security Controlled Implementation',
            'path':'06-cloud-and-technology-risk/Cloud_Security_Controlled_Implementation',
            'status':'published','release_state':'published','layout':'controlled-build','series_order':22
          }
          found=[x for x in c['manuals'] if x.get('id')==mid]
          if found:
              found[0].update(entry)
          else:
              insert_at=next((i for i,x in enumerate(c['manuals']) if x.get('id')=='ai-governance-audit-toolkit'), len(c['manuals']))
              c['manuals'].insert(insert_at,entry)
          evidence=(
            'Manual 22 controlled English was frozen to blob a056997ce359c3a37acc5b931e5f808cc09921be and controlled es-419/pt-BR localizations were merged through PR #341. '
            'The exact six-binary candidate was generated successfully by workflow run 33370864191 / artifact 9750008264 at candidate head e822132a5328c8f79350964de494f09dcdcb7030, with artifact digest sha256:5b48e263701761cdcf8a545c827dafd537bfaed2a6afd37d69ad996e5e515c90. '
            'Manual 22 Candidate Build, Workflow Security, Release Pipeline Meta QA, Manual Structure QA, Trilingual Publication Parity, and Release Package QA passed on the exact candidate. PR #343 bound exact SHA-256 identities plus deterministic rendered PDF/DOCX and accessibility QA with no identified defect requiring regeneration. '
            'PR #344 durably staged the exact EN/es-419/pt-BR DOCX/PDF bytes after fail-closed hash verification; staging head 9561c8e6ccb2a82e59474c3c15c0760924b41808 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA after the README structure defect was corrected. '
            'Predecessor Manual 21 is published. Standing release authorization applies under the canonical no-errors/no-unresolved-material-issues rule because applicable objective gates are green and no unresolved material source, technical, localization, integrity, packaging, accessibility, provenance, workflow-security, or substantive defect is recorded.'
          )
          rent={'id':mid,'type':'manual','release_state':'published','release_evidence':evidence}
          rf=[x for x in r['released_work_products'] if x.get('id')==mid]
          if rf:
              rf[0].update(rent)
          else:
              r['released_work_products'].append(rent)
          c['last_updated']='2026-08-31'; r['last_updated']='2026-08-31'
          catalog_path.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          release_path.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit publication state and self-remove workflow
        shell: bash
        run: |
          rm .github/workflows/24-manual22-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/24-manual22-publication-reconcile.yml
          git diff --cached --quiet && { echo 'No reconciliation changes'; exit 1; }
          git commit -m 'Publish Manual 22 and remove temporary reconciliation workflow'
          git push origin HEAD:${{ github.head_ref }}
