name: "89 - Manual 45 Exact-Byte Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/89-manual45-stage-exact.yml"

permissions:
  actions: read
  contents: write

jobs:
  stage-exact-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Download frozen Manual 45 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9780831264/zip" \
            --output manual45-candidate.zip
          rm -rf candidate
          mkdir candidate
          unzip -q manual45-candidate.zip -d candidate
      - name: Verify immutable candidate identities
        run: |
          set -euo pipefail
          cd candidate
          echo "078c111730fdaa347a2dd61c9204737e0aa9c997bb1a070d044e37fc95f6dae7  Manual_45_Enterprise_Compliance_Training_Capstone_EN.docx" | sha256sum -c -
          echo "804dba729a2e4211f9395aa083cfb4196d1dd1eacb4a6d9ff40b09e3c7e10946  Manual_45_Enterprise_Compliance_Training_Capstone_EN.pdf" | sha256sum -c -
          echo "697add493368c8493f072a7820f88ac0488560a107029c4d0653cd7fac358601  Manual_45_Enterprise_Compliance_Training_Capstone_ES-419.docx" | sha256sum -c -
          echo "b6e40afbe7269dbee35f07b7e17f693b2b7da843f0e226d02d7bfa3d2dfecb25  Manual_45_Enterprise_Compliance_Training_Capstone_ES-419.pdf" | sha256sum -c -
          echo "5a9ab4a5b596e0ee7fdbdf09ea1dd2839e6db9130507f827d5301a7c1a0266d1  Manual_45_Enterprise_Compliance_Training_Capstone_PT-BR.docx" | sha256sum -c -
          echo "44ea996171a6a8cf6cac06650cdf65837574ce08610017fd832454b8c10ac03f  Manual_45_Enterprise_Compliance_Training_Capstone_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact publication bytes and self-remove
        run: |
          set -euo pipefail
          root="08-templates-and-tools/Enterprise_Compliance_Training_Capstone/publication"
          mkdir -p "$root/en" "$root/es-419" "$root/pt-BR"
          cp candidate/Manual_45_Enterprise_Compliance_Training_Capstone_EN.docx "$root/en/"
          cp candidate/Manual_45_Enterprise_Compliance_Training_Capstone_EN.pdf "$root/en/"
          cp candidate/Manual_45_Enterprise_Compliance_Training_Capstone_ES-419.docx "$root/es-419/"
          cp candidate/Manual_45_Enterprise_Compliance_Training_Capstone_ES-419.pdf "$root/es-419/"
          cp candidate/Manual_45_Enterprise_Compliance_Training_Capstone_PT-BR.docx "$root/pt-BR/"
          cp candidate/Manual_45_Enterprise_Compliance_Training_Capstone_PT-BR.pdf "$root/pt-BR/"
          cat > .compliance/MANUAL_45_EXACT_STAGED_HEAD_QA_2026-08-31.md <<'EOF'
          # Manual 45 — Exact Staged-Head QA Handoff

          The six Enterprise Compliance Training Capstone publication binaries on this branch match the frozen Manual 45 candidate from workflow run `33454151001` / artifact `9780831264`. The staging transaction verified every provenance-bound SHA-256 identity before copying the exact bytes. This marker changes no reviewed binary and exists to attach ordinary repository QA to the cleaned exact staged head after this temporary workflow removes itself.
          EOF
          git rm .github/workflows/89-manual45-stage-exact.yml
          git add "$root" .compliance/MANUAL_45_EXACT_STAGED_HEAD_QA_2026-08-31.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage exact Manual 45 publication bytes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
