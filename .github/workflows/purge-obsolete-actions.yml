name: Purge obsolete GitHub Actions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/triggers/purge-obsolete-actions.md'

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy workflows and triggers
        shell: bash
        run: |
          set -euo pipefail
          before=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)
          trigger_before=$(find .github/triggers -maxdepth 1 -type f 2>/dev/null | wc -l || true)
          rm -rf .github/workflows .github/triggers
          mkdir -p qa
          cat > qa/ACTIONS_CLEANUP_REPORT.md <<EOF
          # GitHub Actions Cleanup Report

          - Workflows removed: ${before}
          - Trigger files removed: ${trigger_before}
          - Remaining workflow files: 0
          - Cleanup policy: all legacy manual-specific, repair, translation, build, audit, reconciliation, and trigger workflows removed after the multilingual release was merged into main.
          - Future policy: create only narrowly scoped workflows required for the next manual; remove them after completion unless they are proven reusable controls.
          EOF

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github qa/ACTIONS_CLEANUP_REPORT.md
          git commit -m 'Remove obsolete GitHub Actions workflows and triggers'
          git push origin HEAD:main
