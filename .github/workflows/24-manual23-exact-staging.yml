name: "24 - Manual 23 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/24-manual23-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 23 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual23-candidate
          mkdir -p /tmp/manual23-candidate
          gh run download 33382887620 -R "$GITHUB_REPOSITORY" -n manual23-six-binary-candidate -D /tmp/manual23-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual23-candidate
          printf '%s  %s\n' \
            08ffb0a987cbdd5cad865fed168fdb8991594fb2afba3c01934de1a827c03ade Manual_23_DORA_Controlled_EN.docx \
            b49509066b183ec6422b191ca900be437551e2a92d85b11975ee3866ac633d36 Manual_23_DORA_Controlled_EN.pdf \
            1e5c158fa9dc86fa72f3bf9b433ee455b5a1625a38a4812d18623921d47c617d Manual_23_DORA_Controlled_ES-419.docx \
            56b06a2c3a931202ea02ce4b754eb678552192215a31f4842cabc77b59842ce6 Manual_23_DORA_Controlled_ES-419.pdf \
            00e054b2254eda7be0be7a326b8b7f3df22930a872ef5d687d3bc3ab35277456 Manual_23_DORA_Controlled_PT-BR.docx \
            67ce7d40643c3288f7170fb6539763e016412065b7c731510245863e6bb1406c Manual_23_DORA_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='04-regulatory-compliance/DORA_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual23-candidate/Manual_23_DORA_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual23-candidate/Manual_23_DORA_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual23-candidate/Manual_23_DORA_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual23-candidate/Manual_23_DORA_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual23-candidate/Manual_23_DORA_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual23-candidate/Manual_23_DORA_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/24-manual23-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/24-manual23-exact-staging.yml
          git commit -m 'Stage Manual 23 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
