name: "36 - Manual 05 Corrected Durable Restage"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/36-manual04-corrected-durable-restage.yml"

# Temporary same-repository repair workflow. Writes only to this dedicated
# repair branch and is deleted before the PR may merge.
permissions:
  contents: write

jobs:
  restage-manual05:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fail closed outside repair branch
        run: test "$(git branch --show-current)" = "repair/manual04-05-localization-preflight-2026-08-29"
      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate and validate corrected Manual 05 package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/manual05-corrected"
          python3 scripts/generate_ai_auditing_assurance_manual_05_publication_v3.py --output-root "$OUT" --source-head "${{ github.event.pull_request.head.sha }}"
          python3 scripts/pdf_content_preflight.py "$OUT/publication"
          python3 scripts/localized_publication_regression_qa.py "$OUT/publication" --manual-number 5
          test "$(find "$OUT/publication" -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT/publication" -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 3
      - name: Stage corrected Manual 05 package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/manual05-corrected"
          DEST="03-assurance-and-audit/AI_Auditing_and_Assurance/publication"
          mkdir -p "$DEST/qa"
          cp "$OUT/publication/"*.docx "$DEST/"
          cp "$OUT/publication/"*.pdf "$DEST/"
          cp -a "$OUT/qa/." "$DEST/qa/"
      - name: Commit corrected Manual 05 durable package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03-assurance-and-audit/AI_Auditing_and_Assurance/publication
          if git diff --cached --quiet; then
            echo "Manual 05 durable package already matches corrected candidate."
            exit 0
          fi
          git commit -m "Durably restage corrected Manual 05 publication package"
          git push origin HEAD:${{ github.head_ref }}
