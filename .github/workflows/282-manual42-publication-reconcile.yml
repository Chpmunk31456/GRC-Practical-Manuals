name: "282 - Manual 42 Publication Reconciliation"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/282-manual42-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify exact staged publication bytes
        run: |
          ROOT='04-regulatory-compliance/Canada_Privacy_Controlled_Implementation/publication'
          echo "ef3911d260c4c222d54b47e8959e744275dc1ab93f1a583fe6f63d8bd9611f3f  $ROOT/en/Manual_42_Canada_Privacy_Controlled_EN.docx" | sha256sum -c -
          echo "b9646b813e376655b8d764a44f8438a46ba34c61422d4813850cd055b817ca20  $ROOT/en/Manual_42_Canada_Privacy_Controlled_EN.pdf" | sha256sum -c -
          echo "520e54d6b5c71b16c14945fba2e80864b9dd765d793deec4ed1a8ae1ad7bd62c  $ROOT/es-419/Manual_42_Canada_Privacy_Controlled_ES-419.docx" | sha256sum -c -
          echo "647159d160f533d9dd6e448a0aeb5d9d79b740872ed8bf674b71ebd979648747  $ROOT/es-419/Manual_42_Canada_Privacy_Controlled_ES-419.pdf" | sha256sum -c -
          echo "833ea6c2f25b23facbef3edd9b1b27c6c3cc2f2de02dab9dd6b29b9f7489788d  $ROOT/pt-BR/Manual_42_Canada_Privacy_Controlled_PT-BR.docx" | sha256sum -c -
          echo "88ee01f84ec3d1eecd716aa3adeecba4fed5711c6e5b36ccfc7ab25f1a1e1aac  $ROOT/pt-BR/Manual_42_Canada_Privacy_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Reconcile catalog and release registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          registry_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          registry = json.loads(registry_path.read_text(encoding='utf-8'))

          pred = next((m for m in catalog['manuals'] if m.get('series_order') == 41), None)
          assert pred and pred.get('status') == 'published' and pred.get('release_state') == 'published', 'Manual 41 predecessor is not published in catalog'
          pred_r = next((m for m in registry['released_work_products'] if m.get('id') == 'uk-gdpr-dpa-controlled'), None)
          assert pred_r and pred_r.get('release_state') == 'published', 'Manual 41 predecessor is not published in registry'

          manual_id = 'canada-privacy-controlled'
          entry = {
              'id': manual_id,
              'title': 'Manual 42 — Canada Privacy Controlled Implementation',
              'path': '04-regulatory-compliance/Canada_Privacy_Controlled_Implementation',
              'status': 'published',
              'release_state': 'published',
              'layout': 'controlled-build',
              'series_order': 42,
          }
          existing = next((m for m in catalog['manuals'] if m.get('id') == manual_id), None)
          if existing is None:
              catalog['manuals'].append(entry)
          else:
              existing.update(entry)

          evidence = (
              'Manual 42 Canada Privacy controlled EN/es-419/pt-BR package merged through PR #456 with federal PIPEDA, applicable provincial/private-sector laws, sector rules, and regulator guidance maintained as distinct source layers. '
              'Exact six-binary candidate workflow run 33445214696 / artifact 9777769425 is bound to artifact digest sha256:ac270e6af7e514fada095a3a2d6898ce97bc3064bf526788b8828b46e4d33ee7. '
              'PR #460 bound all six immutable SHA-256/byte identities after independent artifact verification confirmed manifest equality, 32 chapters in every DOCX, searchable nonblank unencrypted four-page PDFs, and rendered inspection of all 12 PDF pages without a material layout defect. '
              'PR #461 durably staged the exact six binaries after fail-closed SHA-256 verification; cleaned staged head d706cad947f92ff8a689c23ed5c2ddcfdc46c8b6 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA. '
              'Predecessor Manual 41 is published; the candidate build transaction also passed Workflow Security and Release Pipeline Meta QA, and no unresolved material source, applicability, localization, integrity, packaging, accessibility, provenance, workflow-security, or substantive defect is recorded.'
          )
          reg_entry = {'id': manual_id, 'type': 'manual', 'release_state': 'published', 'release_evidence': evidence}
          existing_r = next((m for m in registry['released_work_products'] if m.get('id') == manual_id), None)
          if existing_r is None:
              registry['released_work_products'].append(reg_entry)
          else:
              existing_r.update(reg_entry)

          catalog['last_updated'] = '2026-08-31'
          registry['last_updated'] = '2026-08-31'
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit reconciliation and self-remove workflow
        run: |
          rm .github/workflows/282-manual42-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/282-manual42-publication-reconcile.yml
          git commit -m 'Publish Manual 42 — reconcile Canada Privacy publication state'
          git push origin HEAD:${{ github.head_ref }}
