name: "33 - Manual 03 Durable Publication Stage"

on:
  push:
    branches:
      - "release/manual03-publication-repair-2026-08-28"
    paths:
      - ".github/workflows/33-manual03-durable-publication-stage.yml"
      - "01-foundations/NIST_AI_RMF_1.0/**"
      - "scripts/generate_nist_ai_rmf_manual_03_publication.py"
      - "scripts/generate_nist_ai_rmf_manual_03_publication_v2.py"
      - "scripts/generate_nist_ai_rmf_manual_03_publication_v3.py"
      - "scripts/pdf_content_preflight.py"

# This job writes only to the existing Manual 03 release branch. It never
# pushes to main, creates tags, publishes a GitHub Release, or marks human
# semantic/accessibility gates complete.
permissions:
  contents: write

jobs:
  stage-durable-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact release branch candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/manual03-publication-repair-2026-08-28
          fetch-depth: 0

      - name: Fail closed outside the authorized release branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "release/manual03-publication-repair-2026-08-28"
          test "$(git branch --show-current)" = "release/manual03-publication-repair-2026-08-28"

      - name: Install controlled publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx

      - name: Generate exact Manual 03 v3 publication package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/manual03-durable"
          python3 scripts/generate_nist_ai_rmf_manual_03_publication_v3.py \
            --output-root "$RUNNER_TEMP/manual03-durable" \
            --source-head "$GITHUB_SHA"

      - name: Fail closed on generated PDF content and package counts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pdf_content_preflight.py "$RUNNER_TEMP/manual03-durable/publication"
          test "$(find "$RUNNER_TEMP/manual03-durable/publication" -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 3
          test "$(find "$RUNNER_TEMP/manual03-durable/publication" -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 3
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'manual03-durable'
          report = json.loads((root/'qa'/'MANUAL_03_PUBLICATION_REPORT.json').read_text())
          if report.get('source_head') != os.environ['GITHUB_SHA']:
              raise SystemExit('publication provenance source_head mismatch')
          if set(report.get('editions', {})) != {'en', 'es-419', 'pt-BR'}:
              raise SystemExit('publication language set mismatch')
          print('Manual 03 generated provenance: PASS')
          PY

      - name: Stage only durable publication artifacts and compact QA evidence
        shell: bash
        run: |
          set -euo pipefail
          DEST="01-foundations/NIST_AI_RMF_1.0/publication"
          mkdir -p "$DEST/qa"
          rm -f "$DEST/.gitkeep"
          cp "$RUNNER_TEMP/manual03-durable/publication/"*.docx "$DEST/"
          cp "$RUNNER_TEMP/manual03-durable/publication/"*.pdf "$DEST/"
          cp "$RUNNER_TEMP/manual03-durable/qa/MANUAL_03_PUBLICATION_REPORT.json" "$DEST/qa/"
          cp "$RUNNER_TEMP/manual03-durable/qa/MANUAL_03_PUBLICATION_REPORT.md" "$DEST/qa/"
          cp "$RUNNER_TEMP/manual03-durable/qa/MANUAL_03_PAGE_QA.csv" "$DEST/qa/"
          cp "$RUNNER_TEMP/manual03-durable/qa/MANUAL_03_SHA256SUMS.txt" "$DEST/qa/"
          test "$(find "$DEST" -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 3
          test "$(find "$DEST" -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 3

      - name: Commit durable package to release branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-foundations/NIST_AI_RMF_1.0/publication
          if git diff --cached --quiet; then
            echo "Durable package already matches generated candidate."
            exit 0
          fi
          git commit -m "Durably stage Manual 03 publication artifacts from ${GITHUB_SHA}"
          git push origin HEAD:release/manual03-publication-repair-2026-08-28
