name: Prepare focused EU AI Act v1.3 publication

on:
  push:
    branches:
      - release/eu-ai-act-v1.3-main
    paths:
      - '.github/workflows/prepare-eu-ai-act-v1.3-main.yml'

permissions:
  contents: write

concurrency:
  group: prepare-eu-ai-act-v1.3-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused release branch
        uses: actions/checkout@v4
        with:
          ref: release/eu-ai-act-v1.3-main
          fetch-depth: 0

      - name: Fetch validated production branch
        run: git fetch origin production/multilingual-grc-editions

      - name: Import only validated EU AI Act publication content
        run: |
          git checkout origin/production/multilingual-grc-editions -- \
            04-regulatory-compliance/EU_AI_Act_GRC \
            .github/workflows/build-eu-ai-act-english-publication.yml \
            .github/workflows/build-eu-ai-act-spanish-portuguese.yml

      - name: Remove one-time preparation workflow
        run: git rm .github/workflows/prepare-eu-ai-act-v1.3-main.yml

      - name: Commit focused publication candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 04-regulatory-compliance/EU_AI_Act_GRC \
                  .github/workflows/build-eu-ai-act-english-publication.yml \
                  .github/workflows/build-eu-ai-act-spanish-portuguese.yml
          git commit -m 'Prepare focused EU AI Act v1.3 publication for main'
          git push origin HEAD:release/eu-ai-act-v1.3-main
