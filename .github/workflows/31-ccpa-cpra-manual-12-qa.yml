name: "31 - CCPA CPRA Manual 12 QA"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "04-regulatory-compliance/CCPA_CPRA_Controlled_Implementation/**"
      - ".compliance/ccpa-cpra-manual-12-baseline.json"
      - ".compliance/ccpa-cpra-manual-12-sources.json"
      - ".compliance/manual-catalog.json"
      - "scripts/ccpa_cpra_manual_12_qa.py"
      - ".github/workflows/31-ccpa-cpra-manual-12-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccpa-cpra-manual-12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ccpa-cpra-manual-12:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Run Manual 12 fail-closed controlled-build QA
        run: python3 scripts/ccpa_cpra_manual_12_qa.py
