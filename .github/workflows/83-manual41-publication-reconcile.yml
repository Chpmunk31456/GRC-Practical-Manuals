name: "83 - Manual 41 Publication Reconcile"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/83-manual41-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile authoritative registries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catp=Path('.compliance/manual-catalog.json')
          relp=Path('.compliance/work-product-releases.json')
          cat=json.loads(catp.read_text())
          rel=json.loads(relp.read_text())
          assert any(x.get('series_order')==40 and x.get('release_state')=='published' for x in cat['manuals'])
          entry={
            'id':'uk-gdpr-dpa-controlled',
            'title':'Manual 41 — UK GDPR / Data Protection Act Controlled Implementation',
            'path':'04-regulatory-compliance/UK_GDPR_Data_Protection_Act_Controlled_Implementation',
            'status':'published','release_state':'published','layout':'controlled-build','series_order':41
          }
          if not any(x.get('id')==entry['id'] for x in cat['manuals']): cat['manuals'].append(entry)
          evidence={
            'id':'uk-gdpr-dpa-controlled','type':'manual','release_state':'published',
            'release_evidence':'Manual 41 UK GDPR / Data Protection Act controlled EN/es-419/pt-BR package merged through PR #449. Exact six-binary candidate workflow run 33440744859 / artifact 9776138801 is bound to artifact digest sha256:c2fdde24ffa5e549b2e46cac474f244739f67125f369b0452f9c3664e875dd6f. PR #452 bound all six immutable SHA-256/byte identities after independent artifact verification confirmed 32 chapters in every DOCX and searchable, nonblank, unencrypted PDFs. PR #455 durably staged the exact six binaries after fail-closed SHA-256 verification; cleaned staged head dc606b1f8599187d131f5ba9d8ac046c4a6936e4 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA. Predecessor Manual 40 is published; no unresolved material source, applicability, localization, integrity, packaging, provenance, workflow-security, or substantive defect is recorded.'
          }
          if not any(x.get('id')==evidence['id'] for x in rel['released_work_products']): rel['released_work_products'].append(evidence)
          cat['last_updated']=rel['last_updated']='2026-08-31'
          catp.write_text(json.dumps(cat,indent=2,ensure_ascii=False)+'\n')
          relp.write_text(json.dumps(rel,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Self-remove and commit durable publication state
        run: |
          rm .github/workflows/83-manual41-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/83-manual41-publication-reconcile.yml
          git commit -m 'Reconcile Manual 41 publication state and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}