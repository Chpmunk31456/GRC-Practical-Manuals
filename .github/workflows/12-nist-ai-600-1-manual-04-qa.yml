name: "12 - NIST AI 600-1 Manual 04 QA"

on:
  pull_request:
    branches:
      - main
      - "build/nist-ai-rmf-manual-03-2026"
    paths:
      - "01-foundations/NIST_AI_600-1_Generative_AI_Profile/**"
      - ".compliance/nist-ai-600-1-manual-04-baseline.json"
      - ".compliance/authoritative-sources.json"
      - ".compliance/manual-catalog.json"
      - "VISUAL_LEARNING_STANDARD.md"
      - "scripts/nist_ai_600_1_manual_04_qa.py"
      - "scripts/compliance_qa.py"
      - ".github/workflows/12-nist-ai-600-1-manual-04-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nist-ai-600-1-manual-04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nist-ai-600-1-manual-04:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate the NIST AI 600-1 controlled implementation intake
        run: python3 scripts/nist_ai_600_1_manual_04_qa.py
      - name: Validate the authoritative-source registry
        run: python3 scripts/compliance_qa.py sources
      - name: Validate the controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog
