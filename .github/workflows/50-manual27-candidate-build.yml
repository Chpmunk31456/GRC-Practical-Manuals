name: "50 - Manual 27 Candidate Build"

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_manual27_candidate.py"
      - "scripts/pdf_content_preflight.py"
      - "04-regulatory-compliance/Data_Governance_Privacy_Engineering/controlled/**"
      - ".github/workflows/50-manual27-candidate-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-liberation
          python -m pip install --disable-pip-version-check python-docx
      - name: Build six publication candidates
        run: python scripts/build_manual27_candidate.py
      - name: Verify PDFs are nonblank
        run: python scripts/pdf_content_preflight.py qa/manual27-publication-candidate
      - name: Upload exact candidate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual27-six-binary-candidate
          path: qa/manual27-publication-candidate/
          if-no-files-found: error
          retention-days: 7
