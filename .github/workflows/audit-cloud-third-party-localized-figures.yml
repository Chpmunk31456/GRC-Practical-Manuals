name: Audit Cloud and Third-Party Risk localized figures

on:
  push:
    branches:
      - audit/cloud-third-party-localized-figures
    paths:
      - scripts/audit_cloud_third_party_localized_figures.py
      - .github/workflows/audit-cloud-third-party-localized-figures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 5 audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run read-only Batch 5 audit
        run: python scripts/audit_cloud_third_party_localized_figures.py

      - name: Verify audit report is reproducible
        run: git diff --exit-code -- qa/images/CLOUD_THIRD_PARTY_LOCALIZED_FIGURE_AUDIT.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cloud-third-party-localized-figure-audit
          path: qa/images/CLOUD_THIRD_PARTY_LOCALIZED_FIGURE_AUDIT.md
          if-no-files-found: error
          retention-days: 30
