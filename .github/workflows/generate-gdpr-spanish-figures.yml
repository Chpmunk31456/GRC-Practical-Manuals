name: Generate Spanish GDPR figures

on:
  push:
    branches:
      - restore/gdpr-spanish-figures-1-4
    paths:
      - scripts/generate_gdpr_spanish_figures.py
      - scripts/repair_gdpr_spanish_image_refs.py
      - .github/workflows/generate-gdpr-spanish-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: restore/gdpr-spanish-figures-1-4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate figures
        run: python scripts/generate_gdpr_spanish_figures.py

      - name: Repair Markdown references
        run: python scripts/repair_gdpr_spanish_image_refs.py

      - name: Validate PNG files and Markdown references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('04-regulatory-compliance/GDPR/Espanol/media')
          expected = {
              'image1.png': (1628, 857),
              'image2.png': (1628, 886),
              'image3.png': (1628, 886),
              'image4.png': (1628, 915),
          }
          for name, size in expected.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing generated file: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.format != 'PNG' or image.size != size:
                      raise SystemExit(f'Invalid {path}: format={image.format}, size={image.size}, expected={size}')

          source = Path('04-regulatory-compliance/GDPR/Espanol/GDPR_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md').read_text(encoding='utf-8')
          for index in range(1, 5):
              token = f'](media/image{index}.png)'
              if source.count(token) != 1:
                  raise SystemExit(f'Expected exactly one valid reference for image{index}.png')
          for malformed in ('יimg src=', '■img src='):
              if malformed in source:
                  raise SystemExit(f'Malformed image remnant remains: {malformed}')
          print('Validated four Spanish GDPR PNG figures and Markdown references.')
          PY

      - name: Commit generated figures and repaired source
        run: |
          git add 04-regulatory-compliance/GDPR/Espanol/media/image1.png \
            04-regulatory-compliance/GDPR/Espanol/media/image2.png \
            04-regulatory-compliance/GDPR/Espanol/media/image3.png \
            04-regulatory-compliance/GDPR/Espanol/media/image4.png \
            04-regulatory-compliance/GDPR/Espanol/GDPR_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md
          if git diff --cached --quiet; then
            echo 'Generated figures and references are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore Spanish GDPR figures 1-4 and references'
          git push origin HEAD:restore/gdpr-spanish-figures-1-4
