name: "51 - Manual 27 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/51-manual27-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 27 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual27-candidate
          mkdir -p /tmp/manual27-candidate
          gh run download 33395518151 -R "$GITHUB_REPOSITORY" -n manual27-six-binary-candidate -D /tmp/manual27-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual27-candidate
          printf '%s  %s\n' \
            209d494e8af35c414f431a7cbed17b994dd2e5fadcd1fa3866fa89df67cf41f1 Manual_27_Data_Governance_Privacy_Engineering_Controlled_EN.docx \
            be0df850f2aec17aad520fe0a20fb6aef0ec7bb2de063f11d215b943419c88c0 Manual_27_Data_Governance_Privacy_Engineering_Controlled_EN.pdf \
            a83679c60ad6d54e795b98e3058e7bba453b23cc99a7b997a32665d3f8f48abf Manual_27_Data_Governance_Privacy_Engineering_Controlled_ES-419.docx \
            9fdb609b0917f841013e369a422865b2b6ab44e8e7e26385c2933932cdc2dd93 Manual_27_Data_Governance_Privacy_Engineering_Controlled_ES-419.pdf \
            266125f144dba620c9017424b282e552f46b794e9cfb7708a7e110111f819f9f Manual_27_Data_Governance_Privacy_Engineering_Controlled_PT-BR.docx \
            df4dc0c3a2e9d69848649f568766e852bbdbe4ca93d282d9f56227cf391b0126 Manual_27_Data_Governance_Privacy_Engineering_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='04-regulatory-compliance/Data_Governance_Privacy_Engineering/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual27-candidate/Manual_27_Data_Governance_Privacy_Engineering_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual27-candidate/Manual_27_Data_Governance_Privacy_Engineering_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual27-candidate/Manual_27_Data_Governance_Privacy_Engineering_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual27-candidate/Manual_27_Data_Governance_Privacy_Engineering_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual27-candidate/Manual_27_Data_Governance_Privacy_Engineering_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual27-candidate/Manual_27_Data_Governance_Privacy_Engineering_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/51-manual27-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/51-manual27-exact-staging.yml
          git commit -m 'Stage Manual 27 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
