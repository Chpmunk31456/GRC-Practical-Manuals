name: "99 - Manual 07 Durable Stage Temporary"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/99-manual07-durable-stage-temporary.yml"

permissions:
  contents: write

jobs:
  stage-durable-package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Install document conversion and publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate and fail closed on Manual 07 package
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/manual07-publication"
          python3 scripts/run_ai_security_lifecycle_manual_07_publication.py --output-root "$OUT" --source-head "$SOURCE_HEAD"
          python3 scripts/pdf_content_preflight.py "$OUT/publication"
          python3 scripts/localized_publication_regression_qa.py "$OUT/publication" --manual-number 7
          DEST="06-cloud-and-technology-risk/AI_Security_and_Lifecycle/publication"
          rm -rf "$DEST"
          mkdir -p "$DEST/qa"
          cp "$OUT"/publication/* "$DEST/"
          cp "$OUT"/qa/MANUAL_07_PAGE_QA.csv "$DEST/qa/"
          cp "$OUT"/qa/MANUAL_07_PUBLICATION_REPORT.json "$DEST/qa/"
          cp "$OUT"/qa/MANUAL_07_PUBLICATION_REPORT.md "$DEST/qa/"
          cp "$OUT"/qa/MANUAL_07_SHA256SUMS.txt "$DEST/qa/"
      - name: Commit durable package and remove temporary write workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 06-cloud-and-technology-risk/AI_Security_and_Lifecycle/publication
          git rm .github/workflows/99-manual07-durable-stage-temporary.yml
          git diff --cached --check
          git commit -m "Durably stage verified Manual 07 publication package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
