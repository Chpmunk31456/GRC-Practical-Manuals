name: "89 - Manual 44 Publication Reconciliation"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/89-manual44-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile-publication:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Reconcile Manual 44 authoritative registries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          releases_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          releases = json.loads(releases_path.read_text(encoding='utf-8'))

          manuals = catalog['manuals']
          pred = [m for m in manuals if m.get('series_order') == 43]
          if len(pred) != 1 or pred[0].get('status') != 'published' or pred[0].get('release_state') != 'published':
              raise SystemExit('Manual 43 predecessor is not authoritatively published')

          manual_id = 'nist-ssdf-sp-800-218-controlled'
          entry = {
              'id': manual_id,
              'title': 'Manual 44 — NIST SSDF / SP 800-218 Controlled Implementation',
              'path': '06-cloud-and-technology-risk/NIST_SSDF_SP_800-218_Controlled_Implementation',
              'status': 'published',
              'release_state': 'published',
              'layout': 'controlled-build',
              'series_order': 44,
          }
          existing = [m for m in manuals if m.get('id') == manual_id or m.get('series_order') == 44]
          if existing:
              if len(existing) != 1:
                  raise SystemExit('Ambiguous Manual 44 catalog state')
              existing[0].update(entry)
          else:
              manuals.append(entry)

          products = releases['released_work_products']
          release_entry = {
              'id': manual_id,
              'type': 'manual',
              'release_state': 'published',
              'release_evidence': 'Manual 44 NIST SSDF / SP 800-218 controlled trilingual build merged through PR #459. Exact six-binary candidate from workflow run 33446019599 / artifact 9778053898 was bound to immutable SHA-256 provenance through PR #466 and staged without regeneration through PR #469 after fail-closed hash verification. The cleaned exact staged head passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA. Predecessor Manual 43 is published; this final transaction reconciles publication state only and changes no reviewed publication binary.'
          }
          rel_existing = [r for r in products if r.get('id') == manual_id]
          if rel_existing:
              if len(rel_existing) != 1:
                  raise SystemExit('Ambiguous Manual 44 work-product state')
              rel_existing[0].update(release_entry)
          else:
              products.append(release_entry)

          catalog['last_updated'] = '2026-08-31'
          releases['last_updated'] = '2026-08-31'
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          releases_path.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit registries and self-remove
        run: |
          set -euo pipefail
          git rm .github/workflows/89-manual44-publication-reconcile.yml
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Manual 44 NIST SSDF controlled implementation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
