name: Manual 52 final publication transfer

on:
  push:
    branches:
      - publish/manual52-final-2026-09-01
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/manual52-final-2026-09-01
          fetch-depth: 0

      - name: Download frozen Manual 52 artifact
        uses: actions/download-artifact@v4
        with:
          name: manual52-six-binary-candidate
          run-id: 33572657882
          github-token: ${{ github.token }}
          repository: Chpmunk31456/GRC-Practical-Manuals
          path: /tmp/manual52-artifact

      - name: Verify exact frozen hashes and bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/manual52-artifact')
          expected={
            'Manual_52_AI_Cybersecurity_EN.docx':(41052,'8f96740b87be8e0a35cb5aa998f4b23ccd640a2fdc319e04c6a8f3ba363da602'),
            'Manual_52_AI_Cybersecurity_EN.pdf':(70738,'fc0db0fd978f13b8de1dc719af0a3417bee6e34370b0bf5da9c21bc6a2dfe7ba'),
            'Manual_52_AI_Cybersecurity_ES-419.docx':(39707,'3243d69ef87f2cd017f3e1a5afa4e23955c5893dc1727c12c43a14e09a5f2fdc'),
            'Manual_52_AI_Cybersecurity_ES-419.pdf':(66239,'903be0e25b8698fe7263578004db0534fba8101f9516bfcb81df00848cbfb0e2'),
            'Manual_52_AI_Cybersecurity_PT-BR.docx':(39715,'d56fea909c93884839cae8b5819c1d493f9a989b7d12a5cee0e5ddbd671fa720'),
            'Manual_52_AI_Cybersecurity_PT-BR.pdf':(66903,'849bc04c3fa223dff0114ebb74c533b5945b01d01bec81dc3b56d83547a24e6d'),
          }
          found={p.name:p for p in root.rglob('*') if p.is_file() and p.name in expected}
          assert set(found)==set(expected), (set(expected)-set(found), set(found)-set(expected))
          for name,(size,sha) in expected.items():
              data=found[name].read_bytes()
              assert len(data)==size,(name,len(data),size)
              got=hashlib.sha256(data).hexdigest()
              assert got==sha,(name,got,sha)
              print('verified',name,size,sha)
          PY

      - name: Stage exact bytes, controlled sources and publication registries
        shell: bash
        run: |
          set -euo pipefail
          ROOT='10-ai-governance/Manual_52_AI_Cybersecurity'
          mkdir -p "$ROOT/controlled/en" "$ROOT/controlled/es-419" "$ROOT/controlled/pt-BR" "$ROOT/qa"
          find /tmp/manual52-artifact -type f \( -name 'Manual_52_AI_Cybersecurity_*.docx' -o -name 'Manual_52_AI_Cybersecurity_*.pdf' \) -exec cp {} "$ROOT/" \;
          manifest=$(find /tmp/manual52-artifact -name MANUAL_52_CANDIDATE_MANIFEST.json -type f -print -quit)
          test -n "$manifest"
          cp "$manifest" "$ROOT/qa/MANUAL_52_CANDIDATE_MANIFEST.json"
          git fetch origin release/manual52-candidate-2026-09-01
          git show origin/release/manual52-candidate-2026-09-01:"$ROOT/controlled/en/MANUAL_52_CONTROLLED_EN.md" > "$ROOT/controlled/en/MANUAL_52_CONTROLLED_EN.md"
          git show origin/release/manual52-candidate-2026-09-01:"$ROOT/controlled/es-419/MANUAL_52_CONTROLLED_ES_419.md" > "$ROOT/controlled/es-419/MANUAL_52_CONTROLLED_ES_419.md"
          git show origin/release/manual52-candidate-2026-09-01:"$ROOT/controlled/pt-BR/MANUAL_52_CONTROLLED_PT_BR.md" > "$ROOT/controlled/pt-BR/MANUAL_52_CONTROLLED_PT_BR.md"
          python - <<'PY'
          from pathlib import Path
          import json
          catalog_path=Path('.compliance/manual-catalog.json')
          catalog=json.loads(catalog_path.read_text(encoding='utf-8'))
          manuals=catalog.setdefault('manuals',[])
          entry={'id':'manual-52-ai-cybersecurity','title':'Manual 52 — AI Cybersecurity: Secure AI Lifecycle, OWASP & MITRE ATLAS','path':'10-ai-governance/Manual_52_AI_Cybersecurity','layout':'controlled-build','series_order':52,'status':'published','release_state':'published'}
          matches=[i for i,m in enumerate(manuals) if m.get('series_order')==52 or m.get('id')==entry['id'] or m.get('path')==entry['path']]
          if matches:
              manuals[matches[0]]=entry
              for i in reversed(matches[1:]): del manuals[i]
          else:
              insert=next((i+1 for i,m in enumerate(manuals) if m.get('series_order')==51),len(manuals))
              manuals.insert(insert,entry)
          catalog['last_updated']='2026-09-01'
          catalog_path.write_text(json.dumps(catalog,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          rel_path=Path('.compliance/work-product-releases.json')
          rel=json.loads(rel_path.read_text(encoding='utf-8'))
          products=rel.setdefault('released_work_products',[])
          rid='manual-52-ai-cybersecurity'
          evidence=('Manual 52 exact trilingual candidate was produced by successful workflow run 33572657882 / artifact 9825508927 at source head 92c33de440f0d043a80883308ca4cafb3e858453. The six EN/es-419/pt-BR DOCX/PDF binaries passed deterministic build, visible-text, raster-render and AC-01 through AC-20 trilingual parity checks; artifact archive digest sha256:ffad71cdb140b41108c73e247a58c8c575367b4bfa874ac9722fa7473f7b55db. Exact bytes were fail-closed hash/size verified before durable staging. OWASP is preserved as community guidance, MITRE ATLAS as a living knowledge base, and NIST AI RMF / AI 600-1 as voluntary guidance. Predecessor Manual 51 is published. The temporary write-enabled transfer workflow removes itself before the final publication tree; publication merge remains subject to retained exact-head CI.')
          entry={'id':rid,'type':'manual','release_state':'published','release_evidence':evidence}
          matches=[i for i,p in enumerate(products) if p.get('id')==rid]
          if matches:
              products[matches[0]]=entry
              for i in reversed(matches[1:]): del products[i]
          else: products.append(entry)
          rel['last_updated']='2026-09-01'
          rel_path.write_text(json.dumps(rel,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit publication transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/103-manual52-final-publication-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Manual 52 exact frozen binaries and registry state'
          git push origin HEAD:publish/manual52-final-2026-09-01
