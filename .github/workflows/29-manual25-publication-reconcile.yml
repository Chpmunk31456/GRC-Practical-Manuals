name: "29 - Manual 25 Publication Reconciliation"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/29-manual25-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile Manual 25 publication state fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog_path=Path('.compliance/manual-catalog.json')
          release_path=Path('.compliance/work-product-releases.json')
          c=json.loads(catalog_path.read_text(encoding='utf-8'))
          r=json.loads(release_path.read_text(encoding='utf-8'))
          mid='iso-22301-controlled'
          if not any(x.get('series_order')==24 and x.get('status')=='published' for x in c['manuals']):
              raise SystemExit('Manual 24 predecessor is not published in catalog')
          if not any(x.get('id')=='nis2-controlled' and x.get('release_state')=='published' for x in r['released_work_products']):
              raise SystemExit('Manual 24 predecessor is not published in release registry')
          pub=Path('05-operational-resilience/ISO_22301_Controlled_Implementation/publication')
          expected=[
              pub/'en/Manual_25_ISO_22301_Controlled_EN.docx',
              pub/'en/Manual_25_ISO_22301_Controlled_EN.pdf',
              pub/'es-419/Manual_25_ISO_22301_Controlled_ES-419.docx',
              pub/'es-419/Manual_25_ISO_22301_Controlled_ES-419.pdf',
              pub/'pt-BR/Manual_25_ISO_22301_Controlled_PT-BR.docx',
              pub/'pt-BR/Manual_25_ISO_22301_Controlled_PT-BR.pdf',
          ]
          missing=[str(p) for p in expected if not p.is_file() or p.stat().st_size == 0]
          if missing:
              raise SystemExit('Missing/empty staged publication artifacts: '+', '.join(missing))
          entry={
            'id':mid,
            'title':'Manual 25 — ISO 22301 Business Continuity Management Controlled Implementation',
            'path':'05-operational-resilience/ISO_22301_Controlled_Implementation',
            'status':'published','release_state':'published','layout':'controlled-build','series_order':25
          }
          found=[x for x in c['manuals'] if x.get('id')==mid]
          if found:
              found[0].update(entry)
          else:
              insert_at=next((i for i,x in enumerate(c['manuals']) if x.get('id')=='ai-governance-audit-toolkit'), len(c['manuals']))
              c['manuals'].insert(insert_at,entry)
          evidence=(
            'Manual 25 ISO 22301 controlled English master merged through PR #285. Release-time source revalidation and the controlled EN/es-419/pt-BR package merged through PR #360, preserving ISO 22301:2019 plus Amd 1:2024 as the published requirements baseline while treating ISO/CD 22301 Edition 3 and ISO/AWI 22313 Edition 3 as under-development change-watch only. '
            'The exact six-binary candidate was generated successfully by workflow run 33390353180 / artifact 9757204066 with artifact digest sha256:9f2f3e0775bab4d813f5c34f749bc33f570f1c3005b3fce5e7f86b800fc86342. '
            'Candidate Build, Workflow Security, Release Pipeline Meta QA, Manual Structure QA, Trilingual Publication Parity, and Release Package QA passed across the candidate transaction. '
            'PR #362 bound exact SHA-256 identities plus deterministic PDF/DOCX render, 32-chapter completeness, package, and accessibility checks with zero accessibility findings and no identified defect requiring regeneration. '
            'PR #363 durably staged the exact EN/es-419/pt-BR DOCX/PDF bytes after fail-closed verification of all six SHA-256 identities; its owner-authored exact staging head 46d6505802d03b78b023cd608e51e3a3b10b28b9 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA. '
            'Predecessor Manual 24 is published. Standing release authorization applies because applicable objective gates are green and no unresolved material source, applicability, technical, localization, integrity, packaging, accessibility, provenance, workflow-security, or substantive defect is recorded.'
          )
          rent={'id':mid,'type':'manual','release_state':'published','release_evidence':evidence}
          rf=[x for x in r['released_work_products'] if x.get('id')==mid]
          if rf:
              rf[0].update(rent)
          else:
              r['released_work_products'].append(rent)
          c['last_updated']='2026-08-31'; r['last_updated']='2026-08-31'
          catalog_path.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          release_path.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit publication state and self-remove workflow
        shell: bash
        run: |
          rm .github/workflows/29-manual25-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/29-manual25-publication-reconcile.yml
          git diff --cached --quiet && { echo 'No reconciliation changes'; exit 1; }
          git commit -m 'Publish Manual 25 and remove temporary reconciliation workflow'
          git push origin HEAD:${{ github.head_ref }}
