name: 18 - Manual 04 Localization QA

on:
  pull_request:
    paths:
      - '01-foundations/NIST_AI_600-1_Generative_AI_Profile/**'
      - 'scripts/manual04_localization_qa.py'
      - '.github/workflows/18-manual04-localization-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run fail-closed localization QA
        run: python scripts/manual04_localization_qa.py
