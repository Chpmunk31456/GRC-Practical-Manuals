name: Integrate reviewed CIS Spanish rewrite

on:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - '.github/workflows/integrate-cis-es-reviewed-rewrite.yml'
      - 'scripts/integrate_cis_es_reviewed_rewrite.py'
      - 'qa/rewrite/CIS_CONTROLS_V8_1_ES_CONTROL_18_AND_TOOLS_REVIEWED.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-cis-es-reviewed-rewrite
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Integrate reviewed sections 23 and 24
        run: python3 scripts/integrate_cis_es_reviewed_rewrite.py

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md')
          text = source.read_text(encoding='utf-8')
          start_marker = '# 23. Control 18 — Pruebas de penetración'
          end_marker = '# 25.'

          if text.count(start_marker) != 1:
              raise SystemExit('Expected exactly one repaired Section 23 heading.')

          start = text.index(start_marker)
          end = text.find(end_marker, start)
          if end == -1:
              end = len(text)

          repaired = text[start:end]
          if repaired.count('# 24. Herramientas de código abierto') != 1:
              raise SystemExit('Expected exactly one repaired Section 24 heading.')

          for safeguard in ('18.1', '18.2', '18.3', '18.4', '18.5'):
              if repaired.count(f'| {safeguard} |') != 1:
                  raise SystemExit(f'Expected exactly one complete row for {safeguard}.')

          tools = (
              'CIS Controls Navigator', 'CIS Controls Assessment Specification',
              'CIS-CAT Lite', 'CISO Assistant', 'Wazuh', 'osquery', 'OpenSCAP',
              'Lynis', 'Nmap', 'Greenbone Community Edition', 'Trivy', 'OWASP ZAP',
              'Suricata', 'Keycloak', 'DefectDojo', 'Velociraptor'
          )
          for tool in tools:
              if repaired.count(f'| {tool} |') != 1:
                  raise SystemExit(f'Expected exactly one tools-table row for {tool}.')

          forbidden = ('TEN TODO', 'tención', 'Silencioso', 'tóxico')
          found = [token for token in forbidden if token in repaired]
          if found:
              raise SystemExit(f'Forbidden tokens remain in repaired range: {found}')

          print('Validated repaired CIS Spanish Sections 23-24 only.')
          print('Broader source defects outside this controlled range remain separate QA blockers.')
          PY

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md'
          if git diff --cached --quiet; then
            echo 'No source change to commit.'
          else
            git commit -m 'Integrate reviewed CIS Spanish Control 18 and tools sections'
            git push origin HEAD:production/multilingual-grc-editions
          fi
