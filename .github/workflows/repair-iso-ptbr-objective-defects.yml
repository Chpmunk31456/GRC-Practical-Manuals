name: Repair ISO PT-BR objective defects

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/triggers/iso-ptbr-objective-defects.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-iso-ptbr-objective-defects
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Repair objective PT-BR defects and inventory table contexts
        run: python3 qa/tools/repair_iso_ptbr_objective_defects.py

      - name: Run localized source audit
        id: source_audit
        continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_sources.py

      - name: Run section parity audit
        id: parity_audit
        continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_section_parity.py

      - name: Commit source and evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '02-management-systems/ISO_IEC_27001_27002/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md' \
            qa/ISO_IEC_27001_27002_PTBR_COLLAPSED_TABLE_CONTEXTS.md \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.md \
            qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.json \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.md \
            qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Repair objective ISO PT-BR source defects'
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            git push origin HEAD:production/multilingual-grc-editions
          fi

      - name: Preserve fail-closed publication gate
        if: steps.source_audit.outcome != 'success' || steps.parity_audit.outcome != 'success'
        run: |
          echo 'Objective repairs committed; structural blockers remain documented.'
          exit 1
