name: "06 - Workflow Security"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/compliance_qa.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflow-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce read-only and immutable workflow dependencies
        run: python3 scripts/compliance_qa.py workflow-security
