name: "99 - Manual 10 Durable Stage Temporary"

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/99-manual10-durable-stage-temp.yml'

permissions:
  contents: write

jobs:
  stage-durable-package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Install document conversion and publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate and fail closed on Manual 10 package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/manual10-publication"
          python3 scripts/run_nist_rmf_800_53_manual_10_publication.py --output-root "$OUT" --source-head "${{ github.event.pull_request.base.sha }}"
          python3 scripts/pdf_content_preflight.py "$OUT/publication"
          python3 scripts/localized_publication_regression_qa.py "$OUT/publication" --manual-number 10
          DEST="01-foundations/NIST_RMF_SP_800-53_Controlled_Implementation/publication"
          rm -rf "$DEST"
          mkdir -p "$DEST/qa"
          cp "$OUT"/publication/*.docx "$DEST/"
          cp "$OUT"/publication/*.pdf "$DEST/"
          cp "$OUT"/qa/MANUAL_10_PAGE_QA.csv "$DEST/qa/"
          cp "$OUT"/qa/MANUAL_10_PUBLICATION_REPORT.json "$DEST/qa/"
          cp "$OUT"/qa/MANUAL_10_PUBLICATION_REPORT.md "$DEST/qa/"
          cp "$OUT"/qa/MANUAL_10_SHA256SUMS.txt "$DEST/qa/"
      - name: Commit durable package and remove temporary write workflow
        run: |
          set -euo pipefail
          rm .github/workflows/99-manual10-durable-stage-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-foundations/NIST_RMF_SP_800-53_Controlled_Implementation/publication .github/workflows/99-manual10-durable-stage-temp.yml
          git commit -m "Stage verified Manual 10 durable publication package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
