name: "73 - Manual 37 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/73-manual37-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download frozen candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33429536240 -n manual37-six-binary-candidate -D candidate
      - name: Verify exact provenance-bound hashes
        run: |
          echo "a485455e05dc54b92057251fc206912da0dff8015c081efbaa24acb0427fc471  candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_EN.docx" | sha256sum -c -
          echo "86fca9617a054fa2c0c70af0194749ac964a1c8ed0beb10670e357bdfd8819c6  candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_EN.pdf" | sha256sum -c -
          echo "3b28627cea09b28d09c4af033bb408c5d0a8931009db39e2fc2e88fb4a265125  candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_ES-419.docx" | sha256sum -c -
          echo "d54fa99ad668b9d00a3477c8d909cc4ac17a6ccf813ed3ff75358b185295ad73  candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_ES-419.pdf" | sha256sum -c -
          echo "97feac328e1f9a5c87ff1095af7c55bdd09dc1bfb16151db38ad8773d62556b2  candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_PT-BR.docx" | sha256sum -c -
          echo "52d80a7e6cd0a918074ab3c3e9771d722287089444d7afe916737881e5d40991  candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact bytes and self-remove workflow
        run: |
          ROOT='04-regulatory-compliance/Colombia_Data_Protection_Habeas_Data_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_EN.docx "$ROOT/en/"
          cp candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_EN.pdf "$ROOT/en/"
          cp candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_ES-419.docx "$ROOT/es-419/"
          cp candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp candidate/Manual_37_Colombia_Data_Protection_Habeas_Data_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/73-manual37-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/73-manual37-exact-staging.yml
          git commit -m 'Stage Manual 37 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
