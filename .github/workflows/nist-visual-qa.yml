name: NIST CSF localized visual QA assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nist-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-figure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick

      - name: Render figure pages and create contact sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/nist_visual_qa
          process_pdf() {
            lang="$1"
            pdf="$2"
            prefix="$3"
            work="qa/nist_visual_qa/${prefix}_work"
            mkdir -p "$work"
            pages=""
            total=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            for p in $(seq 1 "$total"); do
              text=$(pdftotext -f "$p" -l "$p" "$pdf" - 2>/dev/null || true)
              if printf '%s' "$text" | grep -Eqi 'Figura[[:space:]]+[1-6][\.:]'; then
                pages="$pages $p"
              fi
            done
            pages=$(printf '%s\n' "$pages" | xargs -n1 | awk '!seen[$0]++' | xargs)
            test -n "$pages"
            printf '%s\n' "$pages" > "qa/nist_visual_qa/${prefix}_figure_pages.txt"
            idx=0
            for p in $pages; do
              idx=$((idx+1))
              pdftoppm -f "$p" -l "$p" -jpeg -r 110 -jpegopt quality=70 "$pdf" "$work/page" >/dev/null 2>&1
              src=$(ls "$work"/page-*.jpg | tail -n1)
              convert "$src" -resize 720x950\> -gravity north -background white -splice 0x54 \
                -pointsize 28 -fill black -annotate +0+12 "${lang} - page ${p}" \
                "$work/thumb_${idx}.jpg"
            done
            montage "$work"/thumb_*.jpg -tile 2x -geometry +12+12 -background white \
              -quality 65 "qa/nist_visual_qa/${prefix}_contact_sheet.jpg"
            base64 -w 0 "qa/nist_visual_qa/${prefix}_contact_sheet.jpg" > "qa/nist_visual_qa/${prefix}_contact_sheet.b64"
            split -b 45000 -d -a 2 "qa/nist_visual_qa/${prefix}_contact_sheet.b64" "qa/nist_visual_qa/${prefix}_contact_sheet.b64.part"
            rm "qa/nist_visual_qa/${prefix}_contact_sheet.b64"
            rm -rf "$work"
          }

          process_pdf "Spanish" \
            "01-foundations/NIST_CSF_2/Espanol/NIST_CSF_2_Practical_GRC_and_Junior_Analyst_Manual_Espanol_v1.0.pdf" \
            "es"
          process_pdf "Portuguese" \
            "01-foundations/NIST_CSF_2/Portugues_BR/NIST_CSF_2_Practical_GRC_and_Junior_Analyst_Manual_Portugues_BR_v1.0.pdf" \
            "pt"

      - name: Commit temporary QA assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/nist_visual_qa
          git commit -m 'Add temporary NIST visual QA contact sheets'
          git push origin HEAD:production/multilingual-grc-editions
