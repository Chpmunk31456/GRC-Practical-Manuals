name: Build GRC risk register manual

on:
  pull_request:
    branches: [main]
    paths:
      - '08-templates-and-tools/GRC_Risk_Register_and_Treatment/chapters/**'
      - '08-templates-and-tools/GRC_Risk_Register_and_Treatment/templates/**'
      - '08-templates-and-tools/GRC_Risk_Register_and_Treatment/scripts/**'
      - '08-templates-and-tools/GRC_Risk_Register_and_Treatment/SOURCES.md'
      - '08-templates-and-tools/GRC_Risk_Register_and_Treatment/README.md'
      - '.github/workflows/build-grc-risk-register-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grc-risk-register-manual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-english:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install document tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils unzip

      - name: Assemble controlled English master
        run: |
          set -euo pipefail
          python3 08-templates-and-tools/GRC_Risk_Register_and_Treatment/scripts/assemble_english_manual.py

      - name: Build DOCX and searchable PDF
        shell: bash
        run: |
          set -euo pipefail
          root='08-templates-and-tools/GRC_Risk_Register_and_Treatment'
          stem='GRC_Risk_Register_and_Risk_Treatment_Practical_Manual_English_v1.0'
          master="$root/English/$stem.md"
          docx="$root/English/$stem.docx"
          pdf="$root/English/$stem.pdf"

          pandoc "$master" --toc --toc-depth=3 --metadata title='GRC Risk Register and Risk Treatment Practical Manual' --metadata author='Alberto Al Leiva' -o "$docx"
          libreoffice --headless --convert-to pdf --outdir "$root/English" "$docx" >/tmp/lo-output.txt

          test -s "$master"
          test -s "$docx"
          test -s "$pdf"
          unzip -t "$docx" >/dev/null
          pdftotext "$pdf" - | grep -q 'Risk Management Foundations'
          pdfinfo "$pdf" | grep -q '^Pages:'

      - name: Validate templates and write release evidence
        shell: bash
        run: |
          set -euo pipefail
          root='08-templates-and-tools/GRC_Risk_Register_and_Treatment'
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path('08-templates-and-tools/GRC_Risk_Register_and_Treatment')
          register = root / 'templates/Risk_Register_Template.csv'
          treatment = root / 'templates/Risk_Treatment_Plan_Template.csv'
          with register.open(encoding='utf-8', newline='') as f:
              register_rows = list(csv.reader(f))
          with treatment.open(encoding='utf-8', newline='') as f:
              treatment_rows = list(csv.reader(f))
          if len(register_rows[0]) != 41:
              raise SystemExit(f'Risk register field count is {len(register_rows[0])}, expected 41')
          if len(treatment_rows[0]) != 27:
              raise SystemExit(f'Treatment-plan field count is {len(treatment_rows[0])}, expected 27')

          files = sorted((root / 'English').glob('*')) + [register, treatment, root / 'templates/Risk_Acceptance_Record.md']
          checksums = []
          for path in files:
              if path.is_file():
                  checksums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / 'English/ENGLISH_SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          report = {
              'status': 'PASS',
              'risk_register_fields': len(register_rows[0]),
              'treatment_plan_fields': len(treatment_rows[0]),
              'docx_zip_integrity': 'PASS',
              'pdf_searchable_text': 'PASS',
              'checksummed_files': len(checksums),
              'human_review_limitations': [
                  'Automated checks do not replace legal or regulatory review.',
                  'Automated checks do not replace assistive-technology testing.',
                  'Automated checks do not replace full page-by-page human review.'
              ]
          }
          (root / 'English/ENGLISH_PACKAGE_QA.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          (root / 'English/ENGLISH_PACKAGE_QA.md').write_text(
              '# English Package QA\n\n'
              '- Status: **PASS**\n'
              f"- Risk-register fields: {report['risk_register_fields']}\n"
              f"- Treatment-plan fields: {report['treatment_plan_fields']}\n"
              '- DOCX ZIP integrity: PASS\n'
              '- PDF searchable text: PASS\n'
              f"- Checksummed files: {report['checksummed_files']}\n\n"
              '## Human-review limitations\n\n'
              '- Legal, regulatory, and standards interpretation requires qualified human review.\n'
              '- Assistive-technology behavior requires testing in native applications.\n'
              '- Final visual approval requires page-by-page inspection.\n',
              encoding='utf-8'
          )
          PY

      - name: Commit generated English package
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 08-templates-and-tools/GRC_Risk_Register_and_Treatment/English
          if git diff --cached --quiet; then
            echo 'No generated package changes.'
          else
            git commit -m 'Build and validate English risk-register manual package'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload English candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grc-risk-register-english-candidate
          path: 08-templates-and-tools/GRC_Risk_Register_and_Treatment/English
          if-no-files-found: error
          retention-days: 30
