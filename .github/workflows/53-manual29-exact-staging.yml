name: "53 - Manual 29 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/53-manual29-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 29 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual29-candidate
          mkdir -p /tmp/manual29-candidate
          gh run download 33403413629 -R "$GITHUB_REPOSITORY" -n manual29-six-binary-candidate -D /tmp/manual29-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual29-candidate
          printf '%s  %s\n' \
            1396adae831ce8e564d69be254ec4559082b9f3b43c7796b225abfb94af039b3 Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_EN.docx \
            b3ed3e5ba625dbaf0d7b5d72d8f1ba7e584f2e85784bc503da6f60e8d6e1ca61 Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_EN.pdf \
            faaab9abc32816742e806023aa01bdbc6657eed48ce82160c1b19bd11e3a83fc Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_ES-419.docx \
            78de8c2cfc7386e3b9304862f45570176436f9d987c3bb3bc2eb2e3d1bd71df9 Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_ES-419.pdf \
            260515992de52104d213d66a810bc59c008d16e32cec95f81dd53a4e51016208 Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_PT-BR.docx \
            8178bd3255c4393722d2db355b9ff3d24b1c7b79d06cb3da82946382401c76e0 Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='06-cloud-and-technology-risk/Software_AI_Supply_Chain_Assurance/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual29-candidate/Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual29-candidate/Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual29-candidate/Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual29-candidate/Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual29-candidate/Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual29-candidate/Manual_29_Software_AI_Supply_Chain_Assurance_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/53-manual29-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/53-manual29-exact-staging.yml
          git commit -m 'Stage Manual 29 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
