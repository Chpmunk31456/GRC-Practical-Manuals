name: "98 - Manual 12 Durable Stage Temporary"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/98-manual12-durable-stage-temporary.yml"

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install LibreOffice conversion dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install publication dependencies
        run: python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate Manual 12 controlled publication package
        run: python3 scripts/run_ccpa_cpra_manual_12_publication.py --output-root "$RUNNER_TEMP/manual12-publication" --source-head "${{ github.event.pull_request.base.sha }}"
      - name: Fail closed on generated PDF content
        run: python3 scripts/pdf_content_preflight.py "$RUNNER_TEMP/manual12-publication/publication"
      - name: Stage durable package and QA evidence
        run: |
          set -euo pipefail
          target="04-regulatory-compliance/CCPA_CPRA_Controlled_Implementation/publication"
          rm -rf "$target"
          mkdir -p "$target/qa"
          cp -a "$RUNNER_TEMP/manual12-publication/publication/." "$target/"
          cp -a "$RUNNER_TEMP/manual12-publication/qa/." "$target/qa/"
          git rm .github/workflows/98-manual12-durable-stage-temporary.yml
          git add "$target"
      - name: Commit durable Manual 12 package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage verified Manual 12 durable publication package"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
