name: Integrate CIS Spanish Section 30

on:
  workflow_dispatch:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - 'qa/requests/INTEGRATE_CIS_SPANISH_SECTION_30.md'
      - 'qa/rewrite/CIS_CONTROLS_V8_1_ES_SECTION_30_REVIEWED.md'
      - 'qa/tools/integrate_cis_spanish_section_30.py'
      - 'qa/tools/audit_cis_spanish_full_manual.py'
      - '.github/workflows/integrate-cis-spanish-section-30.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Integrate reviewed Section 30
        run: python3 qa/tools/integrate_cis_spanish_section_30.py

      - name: Run full-manual corruption audit
        run: python3 qa/tools/audit_cis_spanish_full_manual.py

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md \
            qa/CIS_CONTROLS_V8_1_ES_FULL_MANUAL_AUDIT.md
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
          else
            git commit -m "Integrate reviewed CIS Spanish Section 30 cleanup"
            git push origin HEAD:production/multilingual-grc-editions
          fi
