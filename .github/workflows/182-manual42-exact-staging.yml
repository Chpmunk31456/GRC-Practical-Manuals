name: "182 - Manual 42 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/182-manual42-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download frozen candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33445214696 -n manual42-six-binary-candidate -D candidate
      - name: Verify exact provenance-bound hashes
        run: |
          echo "ef3911d260c4c222d54b47e8959e744275dc1ab93f1a583fe6f63d8bd9611f3f  candidate/Manual_42_Canada_Privacy_Controlled_EN.docx" | sha256sum -c -
          echo "b9646b813e376655b8d764a44f8438a46ba34c61422d4813850cd055b817ca20  candidate/Manual_42_Canada_Privacy_Controlled_EN.pdf" | sha256sum -c -
          echo "520e54d6b5c71b16c14945fba2e80864b9dd765d793deec4ed1a8ae1ad7bd62c  candidate/Manual_42_Canada_Privacy_Controlled_ES-419.docx" | sha256sum -c -
          echo "647159d160f533d9dd6e448a0aeb5d9d79b740872ed8bf674b71ebd979648747  candidate/Manual_42_Canada_Privacy_Controlled_ES-419.pdf" | sha256sum -c -
          echo "833ea6c2f25b23facbef3edd9b1b27c6c3cc2f2de02dab9dd6b29b9f7489788d  candidate/Manual_42_Canada_Privacy_Controlled_PT-BR.docx" | sha256sum -c -
          echo "88ee01f84ec3d1eecd716aa3adeecba4fed5711c6e5b36ccfc7ab25f1a1e1aac  candidate/Manual_42_Canada_Privacy_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact bytes and self-remove workflow
        run: |
          ROOT='04-regulatory-compliance/Canada_Privacy_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp candidate/Manual_42_Canada_Privacy_Controlled_EN.docx "$ROOT/en/"
          cp candidate/Manual_42_Canada_Privacy_Controlled_EN.pdf "$ROOT/en/"
          cp candidate/Manual_42_Canada_Privacy_Controlled_ES-419.docx "$ROOT/es-419/"
          cp candidate/Manual_42_Canada_Privacy_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp candidate/Manual_42_Canada_Privacy_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp candidate/Manual_42_Canada_Privacy_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/182-manual42-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/182-manual42-exact-staging.yml
          git commit -m 'Stage Manual 42 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
