name: "37 - Manual 15 Durable Staging"

on:
  push:
    branches:
      - "release/manual15-durable-binaries-r2-2026-08-30"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_ID: "9741396149"
  TARGET: "04-regulatory-compliance/SOC_2_Controlled_Implementation"

jobs:
  stage-exact-artifact:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: "release/manual15-durable-binaries-r2-2026-08-30"
          fetch-depth: 0

      - name: Download exact successful candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/manual15.zip
          rm -rf /tmp/manual15-artifact
          mkdir -p /tmp/manual15-artifact
          unzip -q /tmp/manual15.zip -d /tmp/manual15-artifact

      - name: Verify exact candidate hashes fail closed
        run: |
          set -euo pipefail
          cd /tmp/manual15-artifact
          printf '%s  %s\n' \
            '335c1219291f2528f1c769ea190df375d454586150f7123b129d8d0711008de9' 'publication/en/Manual_15_SOC_2_Controlled_Implementation_EN.docx' \
            '6b70290b538cd201cae82e85ea70d0380899c01ce03e7e74eb71618fee8707ee' 'publication/en/Manual_15_SOC_2_Controlled_Implementation_EN.pdf' \
            '6c8ca66c19db10178f30b83093dd50bf737fd206246c436474d83ffe3fe2f4ce' 'publication/es-419/Manual_15_SOC_2_Controlled_Implementation_ES-419.docx' \
            '11a27d858bea59d4e80612a09bb85253a00eed7f1c14e878cc3c47c87934aaaa' 'publication/es-419/Manual_15_SOC_2_Controlled_Implementation_ES-419.pdf' \
            '7ebbb4bfef17c79f1f13e271a1a9166f272333d2cf3dd6b66ce048467953da6c' 'publication/pt-BR/Manual_15_SOC_2_Controlled_Implementation_PT-BR.docx' \
            '0b2faa2c479d78ab376a66a23936f12b29f49137146a7af344d5facef4ade454' 'publication/pt-BR/Manual_15_SOC_2_Controlled_Implementation_PT-BR.pdf' \
            > /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256
          diff -u /tmp/expected.sha256 qa/MANUAL_15_SHA256SUMS.txt

      - name: Stage exact durable package and self-remove workflow
        run: |
          set -euo pipefail
          mkdir -p "${TARGET}/publication" "${TARGET}/qa"
          cp -a /tmp/manual15-artifact/publication/. "${TARGET}/publication/"
          cp /tmp/manual15-artifact/qa/MANUAL_15_PUBLICATION_REPORT.json "${TARGET}/qa/"
          cp /tmp/manual15-artifact/qa/MANUAL_15_SHA256SUMS.txt "${TARGET}/qa/"
          rm -f .github/workflows/37-manual15-durable-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET}/publication" "${TARGET}/qa/MANUAL_15_PUBLICATION_REPORT.json" "${TARGET}/qa/MANUAL_15_SHA256SUMS.txt" .github/workflows/37-manual15-durable-staging.yml
          git diff --cached --exit-code && { echo 'No staging changes produced'; exit 1; } || true
          git commit -m "Stage exact Manual 15 publication binaries [skip ci]"
          git push origin HEAD:"release/manual15-durable-binaries-r2-2026-08-30"
