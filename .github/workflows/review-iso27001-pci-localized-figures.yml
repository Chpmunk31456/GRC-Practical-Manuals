name: Review ISO 27001 and PCI localized figures

on:
  push:
    branches:
      - audit/iso27001-pci-dss-localized-figures
    paths:
      - scripts/generate_iso27001_pci_localized_review_figures.py
      - .github/workflows/review-iso27001-pci-localized-figures.yml
      - qa/images/LEGACY_IMAGE_PROVENANCE_INVENTORY.json
      - 02-management-systems/ISO_IEC_27001_27002/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_v1.0.docx
      - 04-regulatory-compliance/PCI_DSS_v4.0.1/PCI_DSS_v4.0.1_Practical_Manager_and_Junior_Analyst_Manual_v1.0.docx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4
        with:
          ref: audit/iso27001-pci-dss-localized-figures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate localized review candidates
        run: python scripts/generate_iso27001_pci_localized_review_figures.py

      - name: Validate review candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          out = Path('review/iso27001-pci-dss-localized-figures')
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          if len(manifest) != 18:
              raise SystemExit(f'Expected 18 manifest records, found {len(manifest)}')
          if sum(item['manual_family'] == 'ISO/IEC 27001/27002' for item in manifest) != 9:
              raise SystemExit('Expected 9 ISO review candidates.')
          if sum(item['manual_family'] == 'PCI DSS v4.0.1' for item in manifest) != 9:
              raise SystemExit('Expected 9 PCI review candidates.')
          for item in manifest:
              path = Path(item['review_file'])
              if not path.exists():
                  raise SystemExit(f'Missing review candidate: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.format != 'PNG' or image.size != (item['width'], item['height']):
                      raise SystemExit(f'Invalid review image: {path}')
              if item['status'] != 'review_only_pending_owner_approval':
                  raise SystemExit(f'Unexpected status: {path}')
          print('All 18 review-only candidates passed integrity and exact-dimension validation.')
          PY

      - name: Commit validated review candidates
        run: |
          if [ -z "$(git status --porcelain -- review/iso27001-pci-dss-localized-figures)" ]; then
            echo 'Review candidates unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f review/iso27001-pci-dss-localized-figures
          git commit -m 'Add ISO and PCI localized review candidates'
          git push origin HEAD:audit/iso27001-pci-dss-localized-figures

      - name: Upload review candidates
        uses: actions/upload-artifact@v4
        with:
          name: iso27001-pci-localized-review-candidates
          path: review/iso27001-pci-dss-localized-figures/
          if-no-files-found: error
          retention-days: 30
