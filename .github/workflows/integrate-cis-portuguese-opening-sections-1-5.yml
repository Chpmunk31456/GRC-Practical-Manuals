name: Audit NIST RMF and SP 800-53 English master baseline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'qa/requests/TRIGGER_CIS_PORTUGUESE_OPENING_FROM_MAIN.md'

permissions:
  contents: write

concurrency:
  group: nist-rmf-english-controlled-review
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Run NIST RMF English master baseline audit
        run: python3 qa/tools/audit_nist_rmf_800_53_english_master.py

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/NIST_RMF_SP_800_53_ENGLISH_MASTER_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No audit report changes to commit.'
            exit 0
          fi
          git commit -m 'Audit NIST RMF and SP 800-53 English master baseline'
          for attempt in 1 2 3; do
            if git push origin HEAD:production/multilingual-grc-editions; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            sleep $((attempt * 5))
          done
