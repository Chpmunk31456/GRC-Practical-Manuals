name: "23 - Manual 22 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/23-manual22-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 22 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual22-candidate
          mkdir -p /tmp/manual22-candidate
          gh run download 33370864191 -R "$GITHUB_REPOSITORY" -n manual22-six-binary-candidate -D /tmp/manual22-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual22-candidate
          printf '%s  %s\n' \
            f9d97cd18bcc947eb2fe455c9968b94a88277b41bd4d07f2a6dc49c7d60b8e05 Manual_22_Cloud_Security_Controlled_EN.docx \
            8678bb1816866d2f5718eee32a9c242ce8335ba78c5c537bd1366558cd9c9ecc Manual_22_Cloud_Security_Controlled_EN.pdf \
            5b1a4c66244cace28b566a21a9e8069467cb1666817c237ea50294743684ca17 Manual_22_Cloud_Security_Controlled_ES-419.docx \
            2ba27181dcc1f37e1a7fe91be4cc09f4dce200405261efefdaccc48291d40213 Manual_22_Cloud_Security_Controlled_ES-419.pdf \
            bacc1dd78a028acd722f693929578d72c7fda34dfc812206b681520b723668ab Manual_22_Cloud_Security_Controlled_PT-BR.docx \
            896c98b935491b88ba62d470be5a331885f174bc2d39361f8031ff91b75fa76d Manual_22_Cloud_Security_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='06-cloud-and-technology-risk/Cloud_Security_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual22-candidate/Manual_22_Cloud_Security_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual22-candidate/Manual_22_Cloud_Security_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual22-candidate/Manual_22_Cloud_Security_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual22-candidate/Manual_22_Cloud_Security_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual22-candidate/Manual_22_Cloud_Security_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual22-candidate/Manual_22_Cloud_Security_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/23-manual22-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/23-manual22-exact-staging.yml
          git commit -m 'Stage Manual 22 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
