name: "07 - Release Package QA"

on:
  pull_request:
    branches:
      - main
    paths:
      - "01-foundations/**"
      - "02-management-systems/**"
      - "03-assurance-and-audit/**"
      - "04-regulatory-compliance/**"
      - "05-operational-resilience/**"
      - "06-cloud-and-technology-risk/**"
      - "07-third-party-risk/**"
      - "08-templates-and-tools/**"
      - ".compliance/**"
      - ".zenodo.json"
      - "LICENSE"
      - "README.md"
      - "scripts/compliance_qa.py"
      - ".github/workflows/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the complete release-readiness gate
        run: python3 scripts/compliance_qa.py release --output "$RUNNER_TEMP/release-qa-report.json"
      - name: Display the release QA report
        if: always()
        run: python3 -m json.tool "$RUNNER_TEMP/release-qa-report.json"
