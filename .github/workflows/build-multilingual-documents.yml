name: Build multilingual GRC documents

on:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - '**/Espanol/*.md'
      - '**/Portugues_BR/*.md'
      - '.github/workflows/build-multilingual-documents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Build DOCX and PDF files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -path '*/Espanol/*.md' -o -path '*/Portugues_BR/*.md' \) -print0 |
          while IFS= read -r -d '' source; do
            stem="${source%.md}"
            pandoc "$source" --resource-path="$(dirname "$source")" -o "${stem}.docx"
            libreoffice --headless --convert-to pdf --outdir "$(dirname "$source")" "${stem}.docx"
            test -s "${stem}.docx"
            test -s "${stem}.pdf"
            unzip -t "${stem}.docx" >/dev/null
            pdftotext "${stem}.pdf" - | grep -q '[[:alnum:]]'
          done

      - name: Commit generated binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '**/Espanol/*.docx' '**/Espanol/*.pdf' '**/Portugues_BR/*.docx' '**/Portugues_BR/*.pdf' || true
          if git diff --cached --quiet; then
            echo 'No generated binary changes to commit.'
          else
            git commit -m 'Build multilingual DOCX and PDF editions'
            git push origin HEAD:production/multilingual-grc-editions
          fi

# Controlled rebuild trigger after localized NIST CSF graphics integration.
