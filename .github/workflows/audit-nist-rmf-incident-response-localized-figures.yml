name: Audit NIST RMF and Incident Response localized figures

on:
  push:
    branches:
      - audit/nist-rmf-incident-response-localized-figures
    paths:
      - scripts/audit_nist_rmf_incident_response_localized_figures.py
      - .github/workflows/audit-nist-rmf-incident-response-localized-figures.yml
      - qa/images/LEGACY_IMAGE_PROVENANCE_INVENTORY.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 4 audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/nist-rmf-incident-response-localized-figures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run read-only Batch 4 audit
        run: python scripts/audit_nist_rmf_incident_response_localized_figures.py

      - name: Verify audit assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path('qa/images/NIST_RMF_INCIDENT_RESPONSE_LOCALIZED_FIGURE_AUDIT.md')
          text = report.read_text(encoding='utf-8')
          required = [
              'Total unresolved reference records: **20**',
              'NIST RMF / SP 800-53 records: **10**',
              'Incident Response / BCDR records: **10**',
              'Unique authoritative English source assets: **20**',
              'Existing localized destination files: **0**',
              'Language scope: **Brazilian Portuguese only**',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Batch 4 audit assertions: {missing}')
          print('Batch 4 audit assertions passed.')
          PY

      - name: Commit audit report
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- qa/images/NIST_RMF_INCIDENT_RESPONSE_LOCALIZED_FIGURE_AUDIT.md)" ]; then
            echo 'Audit report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/images/NIST_RMF_INCIDENT_RESPONSE_LOCALIZED_FIGURE_AUDIT.md
          git commit -m 'Record NIST RMF and Incident Response figure audit'
          git push origin HEAD:audit/nist-rmf-incident-response-localized-figures

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nist-rmf-incident-response-localized-figure-audit
          path: qa/images/NIST_RMF_INCIDENT_RESPONSE_LOCALIZED_FIGURE_AUDIT.md
          if-no-files-found: error
          retention-days: 30
