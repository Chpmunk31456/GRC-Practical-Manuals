name: Build control mapping practical manual

on:
  pull_request:
    branches: [main]
    paths:
      - '08-templates-and-tools/Control_Mapping_and_Crosswalk/**'
      - '.github/workflows/build-control-mapping-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-mapping-english-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-english:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install document tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils unzip

      - name: Assemble controlled English manual
        run: |
          set -euo pipefail
          python3 08-templates-and-tools/Control_Mapping_and_Crosswalk/scripts/assemble_english_manual.py

      - name: Build DOCX and searchable PDF
        run: |
          set -euo pipefail
          root='08-templates-and-tools/Control_Mapping_and_Crosswalk'
          stem='Control_Mapping_and_Crosswalk_Practical_Manual_English_v1.0'
          md="$root/English/$stem.md"
          docx="$root/English/$stem.docx"
          pdf="$root/English/$stem.pdf"
          pandoc "$md" --toc --toc-depth=3 --metadata author='Alberto Al Leiva' -o "$docx"
          libreoffice --headless --convert-to pdf --outdir "$root/English" "$docx" >/dev/null
          test -s "$md"
          test -s "$docx"
          test -s "$pdf"
          unzip -t "$docx" >/dev/null
          words=$(pdftotext "$pdf" - | wc -w)
          test "$words" -ge 3500
          pdftotext "$pdf" - | grep -q 'Mapping Governance and Intended Use'

      - name: Validate release evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path('08-templates-and-tools/Control_Mapping_and_Crosswalk')
          expected = {
              'Control_Mapping_Register.csv': 40,
              'Requirement_Decomposition_Worksheet.csv': 30,
              'Mapping_Review_Checklist.csv': 38,
              'Gap_Overlap_and_Conflict_Register.csv': 32,
          }
          counts = {}
          for name, wanted in expected.items():
              with (root / 'tools' / name).open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              got = len(rows[0])
              if got != wanted:
                  raise SystemExit(f'{name}: expected {wanted}, found {got}')
              counts[name] = got
          md = root / 'English/Control_Mapping_and_Crosswalk_Practical_Manual_English_v1.0.md'
          docx = md.with_suffix('.docx')
          pdf = md.with_suffix('.pdf')
          files = [md, docx, pdf, root / 'English/ENGLISH_ASSEMBLY_REPORT.md', root / 'English/ENGLISH_ASSEMBLY_REPORT.json']
          files += sorted((root / 'tools').glob('*.csv'))
          sums = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}" for p in files]
          (root / 'English/ENGLISH_SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          report = {
              'status': 'PASS',
              'docx_zip_integrity': 'PASS',
              'pdf_searchable_text': 'PASS',
              'tool_field_counts': counts,
              'checksummed_files': len(files),
              'human_review_limitations': [
                  'Mappings require qualified source, legal, licensing, control and audit review.',
                  'Automated validation does not establish compliance or equivalence.',
                  'Native-language, assistive-technology and full page-by-page visual review are not represented.'
              ]
          }
          (root / 'English/ENGLISH_PACKAGE_QA.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          lines = ['# English Package QA', '', '- Status: **PASS**', '- DOCX ZIP integrity: PASS', '- PDF searchable text: PASS']
          lines += [f'- {name}: {count} fields' for name, count in counts.items()]
          lines += ['', '## Human-review limitations', '', '- Qualified source, legal, licensing, control and audit review remains required.', '- Automated validation does not establish compliance or equivalence.', '- Native-language, assistive-technology and page-by-page visual review are not represented as completed.', '']
          (root / 'English/ENGLISH_PACKAGE_QA.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit generated English package
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          branch='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 08-templates-and-tools/Control_Mapping_and_Crosswalk/English
          if git diff --cached --quiet; then
            echo 'No generated English changes.'
          else
            git commit -m 'Build and validate English control mapping package'
            git fetch origin "$branch"
            git rebase "origin/$branch"
            git push origin "HEAD:$branch"
          fi

      - name: Upload English review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-mapping-english-candidate
          path: 08-templates-and-tools/Control_Mapping_and_Crosswalk/English
          if-no-files-found: error
          retention-days: 30
