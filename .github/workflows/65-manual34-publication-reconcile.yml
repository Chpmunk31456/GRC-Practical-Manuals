name: "65 - Manual 34 Publication Reconcile"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/65-manual34-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fail closed and reconcile Manual 34 publication state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          releases_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          releases = json.loads(releases_path.read_text(encoding='utf-8'))

          pred_id = 'sec-cybersecurity-governance-disclosure-controlled'
          new_id = 'iso-iec-27701-2025-controlled'
          cats = catalog.get('manuals', catalog if isinstance(catalog, list) else [])
          rels = releases.get('released_work_products', releases.get('work_products', releases.get('releases', releases if isinstance(releases, list) else [])))
          if not isinstance(cats, list) or not isinstance(rels, list):
              raise SystemExit('unexpected registry structure')

          pred_cat = next((x for x in cats if x.get('id') == pred_id), None)
          pred_rel = next((x for x in rels if x.get('id') == pred_id), None)
          if not pred_cat or pred_cat.get('status') != 'published' or pred_cat.get('release_state') != 'published':
              raise SystemExit('Manual 33 not published in catalog')
          if not pred_rel or pred_rel.get('release_state') != 'published':
              raise SystemExit('Manual 33 not published in release registry')
          if any(x.get('id') == new_id for x in cats) or any(x.get('id') == new_id for x in rels):
              raise SystemExit('Manual 34 publication record already exists')

          root = Path('04-regulatory-compliance/ISO_IEC_27701_Privacy_Information_Management_Controlled_Implementation/publication')
          files = [
            root/'en/Manual_34_ISO_IEC_27701_2025_Privacy_Information_Management_Controlled_EN.docx',
            root/'en/Manual_34_ISO_IEC_27701_2025_Privacy_Information_Management_Controlled_EN.pdf',
            root/'es-419/Manual_34_ISO_IEC_27701_2025_Privacy_Information_Management_Controlled_ES-419.docx',
            root/'es-419/Manual_34_ISO_IEC_27701_2025_Privacy_Information_Management_Controlled_ES-419.pdf',
            root/'pt-BR/Manual_34_ISO_IEC_27701_2025_Privacy_Information_Management_Controlled_PT-BR.docx',
            root/'pt-BR/Manual_34_ISO_IEC_27701_2025_Privacy_Information_Management_Controlled_PT-BR.pdf',
          ]
          for p in files:
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'missing/empty staged artifact: {p}')

          entry = {
            'id': new_id,
            'title': 'Manual 34 — ISO/IEC 27701:2025 Privacy Information Management Controlled Implementation',
            'path': '04-regulatory-compliance/ISO_IEC_27701_Privacy_Information_Management_Controlled_Implementation',
            'status': 'published',
            'release_state': 'published',
            'layout': 'controlled-build',
            'series_order': 34,
          }
          toolkit_index = next((i for i,x in enumerate(cats) if x.get('id') == 'ai-governance-audit-toolkit'), len(cats))
          cats.insert(toolkit_index, entry)

          rels.append({
            'id': new_id,
            'type': 'manual',
            'release_state': 'published',
            'release_evidence': 'Manual 34 ISO/IEC 27701:2025 Privacy Information Management controlled EN/es-419/pt-BR package merged through PR #417 after release-time verification that ISO/IEC 27701:2025 Edition 2 is current and the 2019 edition is withdrawn. Exact six-binary candidate workflow run 33421561721 / artifact 9769107949 is bound to artifact digest sha256:dff723aab2fe28411808261d3b5b610bbcaaf7448e9f2ec1edcf55e5bbe49585. PR #419 bound all six exact SHA-256/byte identities plus 32-chapter completeness, zero-finding DOCX accessibility audits, searchable PDF checks, and full rendered review of all 43 PDF/DOCX pages without regeneration. PR #420 durably staged the exact six binaries after fail-closed SHA-256 verification; exact staging head 3ed8d3f23de006cfb41a283bc5ee4f1d8ff29b0f passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA before merge at e167ff61fb3b497c722c0b5536e64c42e5ffed62. Predecessor Manual 33 is published; no unresolved material source, applicability, localization, integrity, packaging, accessibility, provenance, workflow-security, copyright-boundary, or substantive defect is recorded.'
          })

          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          releases_path.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Self-remove reconciliation workflow and push state
        run: |
          rm .github/workflows/65-manual34-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/65-manual34-publication-reconcile.yml
          git commit -m 'Reconcile Manual 34 published state and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
