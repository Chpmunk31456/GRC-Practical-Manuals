name: "33 - Manual 13 SOX ICFR QA"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/33-manual13-sox-icfr-qa.yml"
      - "04-regulatory-compliance/SOX_ITGC_ICFR_Controlled_Implementation/**"
      - ".compliance/sox-itgc-icfr-manual-13-*.json"
      - ".compliance/MANUAL_13_*.md"
      - "scripts/validate_sox_itgc_icfr_manual_13.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manual13:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Manual 13 controlled source and boundaries
        run: python3 scripts/validate_sox_itgc_icfr_manual_13.py
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_sox_itgc_icfr_manual_13.py
