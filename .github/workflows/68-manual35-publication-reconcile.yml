name: "68 - Manual 35 Publication Reconcile"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/68-manual35-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fail closed and reconcile Manual 35 publication state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          releases_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          releases = json.loads(releases_path.read_text(encoding='utf-8'))

          pred_id = 'iso-iec-27701-2025-controlled'
          new_id = 'singapore-ai-privacy-governance-controlled'
          cats = catalog.get('manuals', catalog if isinstance(catalog, list) else [])
          rels = releases.get('released_work_products', releases.get('work_products', releases.get('releases', releases if isinstance(releases, list) else [])))
          if not isinstance(cats, list) or not isinstance(rels, list):
              raise SystemExit('unexpected registry structure')

          pred_cat = next((x for x in cats if x.get('id') == pred_id), None)
          pred_rel = next((x for x in rels if x.get('id') == pred_id), None)
          if not pred_cat or pred_cat.get('status') != 'published' or pred_cat.get('release_state') != 'published':
              raise SystemExit('Manual 34 not published in catalog')
          if not pred_rel or pred_rel.get('release_state') != 'published':
              raise SystemExit('Manual 34 not published in release registry')
          if any(x.get('id') == new_id for x in cats) or any(x.get('id') == new_id for x in rels):
              raise SystemExit('Manual 35 publication record already exists')

          root = Path('04-regulatory-compliance/Singapore_AI_Privacy_Governance_Controlled_Implementation/publication')
          files = [
            root/'en/Manual_35_Singapore_AI_Privacy_Governance_Controlled_EN.docx',
            root/'en/Manual_35_Singapore_AI_Privacy_Governance_Controlled_EN.pdf',
            root/'es-419/Manual_35_Singapore_AI_Privacy_Governance_Controlled_ES-419.docx',
            root/'es-419/Manual_35_Singapore_AI_Privacy_Governance_Controlled_ES-419.pdf',
            root/'pt-BR/Manual_35_Singapore_AI_Privacy_Governance_Controlled_PT-BR.docx',
            root/'pt-BR/Manual_35_Singapore_AI_Privacy_Governance_Controlled_PT-BR.pdf',
          ]
          for p in files:
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'missing/empty staged artifact: {p}')

          entry = {
            'id': new_id,
            'title': 'Manual 35 — Singapore AI & Privacy Governance Controlled Implementation',
            'path': '04-regulatory-compliance/Singapore_AI_Privacy_Governance_Controlled_Implementation',
            'status': 'published',
            'release_state': 'published',
            'layout': 'controlled-build',
            'series_order': 35,
          }
          toolkit_index = next((i for i,x in enumerate(cats) if x.get('id') == 'ai-governance-audit-toolkit'), len(cats))
          cats.insert(toolkit_index, entry)

          rels.append({
            'id': new_id,
            'type': 'manual',
            'release_state': 'published',
            'release_evidence': 'Manual 35 Singapore AI & Privacy Governance controlled EN/es-419/pt-BR package merged through PR #422 after release-time verification of Singapore PDPA/PDPC obligations and current IMDA/PDPC/AI Verify Traditional, Generative, and Agentic AI governance boundaries. Exact six-binary candidate workflow run 33424241191 / artifact 9770121831 is bound to artifact digest sha256:558d95eaad2e4c4e37c7b103978611a70d3fff8b1d4e9ad7bf69622caf679501. PR #424 bound all six exact SHA-256/byte identities plus deterministic DOCX/PDF integrity, 32-chapter completeness, zero-finding DOCX accessibility, searchable PDF checks, and complete rendered-page review without regeneration. PR #425 durably staged the exact six binaries after fail-closed SHA-256 verification; its owner-authored exact staging head passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA before merge at b1bf10ab417839fc0efdb5e52bbb636520c41052. Predecessor Manual 34 is published. Data Portability remains explicitly change-watch/non-operative absent implementing regulations, and dated breach-notification and AI-framework facts remain subject to release-time source control. No unresolved material source, applicability, localization, integrity, packaging, accessibility, provenance, workflow-security, or substantive defect is recorded.'
          })

          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          releases_path.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Self-remove reconciliation workflow and push state
        run: |
          rm .github/workflows/68-manual35-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/68-manual35-publication-reconcile.yml
          git commit -m 'Reconcile Manual 35 published state and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}