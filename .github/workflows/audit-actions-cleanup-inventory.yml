name: Audit Actions cleanup inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/triggers/actions-cleanup-inventory.md'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Build workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root = Path('.github/workflows')
          rows = []
          for path in sorted(root.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8', errors='replace')
              name = re.search(r'^name:\s*(.+)$', text, re.M)
              triggers = []
              for token in ['workflow_dispatch','schedule','push','pull_request','workflow_run','release']:
                  if re.search(rf'^\s*{re.escape(token)}\s*:', text, re.M):
                      triggers.append(token)
              trigger_paths = re.findall(r"['\"]([^'\"]*\.github/triggers/[^'\"]+)['\"]", text)
              lower = path.name.lower()
              one_time_markers = ['integrate-','promote-','review-','restore-','recover-','regenerate-','repair-','rebuild-','normalize-','trigger-','analyze-','reconcile-','audit-cis-','audit-iso','audit-nist','audit-cloud','generate-gdpr','generate-nist','publish-eu-ai-act-translations-approved','actions-cleanup-inventory']
              classification = 'one-time-candidate' if any(m in lower for m in one_time_markers) or trigger_paths else 'retain-candidate'
              rows.append({
                  'path': path.as_posix(),
                  'name': name.group(1).strip() if name else '',
                  'triggers': triggers,
                  'trigger_paths': trigger_paths,
                  'classification': classification,
                  'bytes': path.stat().st_size,
              })

          Path('qa').mkdir(exist_ok=True)
          Path('qa/ACTIONS_WORKFLOW_INVENTORY.json').write_text(json.dumps(rows, indent=2) + '\n', encoding='utf-8')
          lines = ['# GitHub Actions Workflow Inventory','',f'- Workflow files: {len(rows)}','']
          for row in rows:
              lines.append(f"- `{row['path']}` — **{row['classification']}** — triggers: {', '.join(row['triggers']) or 'unparsed'}" + (f" — trigger files: {', '.join(row['trigger_paths'])}" if row['trigger_paths'] else ''))
          Path('qa/ACTIONS_WORKFLOW_INVENTORY.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(f'Inventoried {len(rows)} workflows')
          PY

      - name: Commit inventory evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/ACTIONS_WORKFLOW_INVENTORY.json qa/ACTIONS_WORKFLOW_INVENTORY.md
          git commit -m 'Inventory GitHub Actions workflows for cleanup'
          git push origin HEAD:main
