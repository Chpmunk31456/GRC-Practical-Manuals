name: "12 - NIST AI 600-1 Manual 04 QA"

# Lifecycle-aware validation preserves the legacy integrity gate after publication.
on:
  pull_request:
    branches:
      - main
      - "build/nist-ai-rmf-manual-03-2026"
    paths:
      - "01-foundations/NIST_AI_600-1_Generative_AI_Profile/**"
      - ".compliance/nist-ai-600-1-manual-04-baseline.json"
      - ".compliance/authoritative-sources.json"
      - ".compliance/manual-catalog.json"
      - ".compliance/work-product-releases.json"
      - "VISUAL_LEARNING_STANDARD.md"
      - "scripts/nist_ai_600_1_manual_04_qa.py"
      - "scripts/run_legacy_manual_qa_release_state.py"
      - "scripts/compliance_qa.py"
      - ".github/workflows/12-nist-ai-600-1-manual-04-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nist-ai-600-1-manual-04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nist-ai-600-1-manual-04:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate the NIST AI 600-1 controlled implementation intake
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('.compliance/manual-catalog.json').read_text(encoding='utf-8'))
          match = [m for m in catalog['manuals'] if m.get('id') == 'nist-ai-600-1']
          if len(match) != 1:
              raise SystemExit('Manual 04 catalog entry must be unique')
          print(match[0].get('status', ''))
          PY
          )"
          if [[ "$STATUS" == "published" ]]; then
            python3 scripts/run_legacy_manual_qa_release_state.py \
              --manual-id nist-ai-600-1 \
              --script scripts/nist_ai_600_1_manual_04_qa.py
          else
            python3 scripts/nist_ai_600_1_manual_04_qa.py
          fi
      - name: Validate the authoritative-source registry
        run: python3 scripts/compliance_qa.py sources
      - name: Validate the controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog
