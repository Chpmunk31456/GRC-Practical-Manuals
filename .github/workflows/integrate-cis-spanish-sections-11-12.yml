name: Integrate reviewed CIS Spanish Sections 11-12

on:
  workflow_dispatch:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - 'qa/requests/INTEGRATE_CIS_SPANISH_SECTIONS_11_12.md'
      - 'qa/tools/integrate_cis_spanish_sections_11_12.py'
      - 'qa/rewrite/CIS_CONTROLS_V8_1_ES_SECTIONS_11_12_REVIEWED.md'
      - '.github/workflows/integrate-cis-spanish-sections-11-12.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Integrate reviewed Sections 11-12
        run: python3 qa/tools/integrate_cis_spanish_sections_11_12.py

      - name: Run full-manual corruption audit
        id: audit
        continue-on-error: true
        run: python3 qa/tools/audit_cis_spanish_full_manual.py

      - name: Commit corrected source and refreshed audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md' \
            'qa/CIS_CONTROLS_V8_1_ES_FULL_MANUAL_AUDIT.md'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'Integrate reviewed CIS Spanish Sections 11 and 12'

          for attempt in 1 2 3; do
            if git push origin HEAD:production/multilingual-grc-editions; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'Push failed after three attempts.' >&2
              exit 1
            fi

            echo "Production advanced during integration; rebasing before retry ${attempt}."
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            sleep $((attempt * 5))
          done

      - name: Report remaining audit status
        if: steps.audit.outcome != 'success'
        run: echo 'Sections 11-12 were integrated; remaining defects are recorded in the refreshed audit.'
