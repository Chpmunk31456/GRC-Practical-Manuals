name: "284 - Manual 43 Publication Reconciliation"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/284-manual43-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify exact staged publication bytes
        run: |
          ROOT='06-cloud-and-technology-risk/ISO_IEC_27017_27018_Controlled_Implementation/publication'
          echo "548119669747a6d175d846473353a8f0631f6c24bc6ccac0bc7e13a5a4b346fb  $ROOT/en/Manual_43_ISO_IEC_27017_27018_Controlled_EN.docx" | sha256sum -c -
          echo "30ec3172b842b181c4898d8f4d02086a75848d0571ca05427e3946e27d88844c  $ROOT/en/Manual_43_ISO_IEC_27017_27018_Controlled_EN.pdf" | sha256sum -c -
          echo "cb391d78def21dce654be01acd4cb28cc85c092fb44b222a0374e50a116a40b4  $ROOT/es-419/Manual_43_ISO_IEC_27017_27018_Controlled_ES-419.docx" | sha256sum -c -
          echo "77a6b00cf6e25aef115d51f52bf347793b074f043a6d443cd72a4d4b852b1eb2  $ROOT/es-419/Manual_43_ISO_IEC_27017_27018_Controlled_ES-419.pdf" | sha256sum -c -
          echo "26c852ec495a5b0bb54b0399150fe524395be2b006491bbbd499836bce79574f  $ROOT/pt-BR/Manual_43_ISO_IEC_27017_27018_Controlled_PT-BR.docx" | sha256sum -c -
          echo "d748a29421dc3523621839096e9652818942d5c055443fe301e3af88979859a0  $ROOT/pt-BR/Manual_43_ISO_IEC_27017_27018_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Reconcile catalog and release registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog_path = Path('.compliance/manual-catalog.json')
          registry_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          registry = json.loads(registry_path.read_text(encoding='utf-8'))

          pred = next((m for m in catalog['manuals'] if m.get('series_order') == 42), None)
          assert pred and pred.get('status') == 'published' and pred.get('release_state') == 'published', 'Manual 42 predecessor is not published in catalog'
          pred_r = next((m for m in registry['released_work_products'] if m.get('id') == 'canada-privacy-controlled'), None)
          assert pred_r and pred_r.get('release_state') == 'published', 'Manual 42 predecessor is not published in registry'

          manual_id = 'iso-iec-27017-27018-controlled'
          entry = {
              'id': manual_id,
              'title': 'Manual 43 — ISO/IEC 27017 & 27018 Cloud Security and Privacy Controlled Implementation',
              'path': '06-cloud-and-technology-risk/ISO_IEC_27017_27018_Controlled_Implementation',
              'status': 'published',
              'release_state': 'published',
              'layout': 'controlled-build',
              'series_order': 43,
          }
          existing = next((m for m in catalog['manuals'] if m.get('id') == manual_id), None)
          if existing is None:
              catalog['manuals'].append(entry)
          else:
              existing.update(entry)

          evidence = (
              'Manual 43 ISO/IEC 27017 & 27018 controlled EN/es-419/pt-BR package merged through PR #458, with project-authored implementation guidance preserving the ISO copyright boundary and no authorized-translation claim. '
              'Exact six-binary candidate workflow run 33445224426 / artifact 9777780098 is bound to artifact digest sha256:965c7638b02e856bbcdd55ccacc669f130db6b6107346dc946d798125da2f9f4. '
              'PR #463 bound all six immutable SHA-256/byte identities after independent artifact verification confirmed manifest equality, 32 chapters in every DOCX, searchable nonblank unencrypted PDFs, and full rendered-page inspection across all 11 PDF pages without a material layout defect. '
              'PR #464 durably staged the exact six binaries after fail-closed SHA-256 verification; cleaned staged head bb7e3a9eedb3bc9b9debfa292d94df64133091a7 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA. '
              'Predecessor Manual 42 is published; the candidate transaction also passed Workflow Security and Release Pipeline Meta QA, and no unresolved material source, applicability, localization, copyright-boundary, integrity, packaging, accessibility, provenance, workflow-security, or substantive defect is recorded.'
          )
          reg_entry = {'id': manual_id, 'type': 'manual', 'release_state': 'published', 'release_evidence': evidence}
          existing_r = next((m for m in registry['released_work_products'] if m.get('id') == manual_id), None)
          if existing_r is None:
              registry['released_work_products'].append(reg_entry)
          else:
              existing_r.update(reg_entry)

          catalog['last_updated'] = '2026-08-31'
          registry['last_updated'] = '2026-08-31'
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit reconciliation and self-remove workflow
        run: |
          rm .github/workflows/284-manual43-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/284-manual43-publication-reconcile.yml
          git commit -m 'Publish Manual 43 — reconcile ISO cloud publication state'
          git push origin HEAD:${{ github.head_ref }}
