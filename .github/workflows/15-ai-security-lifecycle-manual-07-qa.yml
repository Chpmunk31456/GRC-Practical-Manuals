name: "15 - AI Security Lifecycle Manual 07 QA"

on:
  pull_request:
    branches:
      - "build/hipaa-implementation-manual-06-2026"
    paths:
      - "06-cloud-and-technology-risk/AI_Security_and_Lifecycle/**"
      - ".compliance/ai-security-lifecycle-manual-07-baseline.json"
      - ".compliance/authoritative-sources.json"
      - ".compliance/manual-catalog.json"
      - "scripts/ai_security_lifecycle_manual_07_qa.py"
      - "scripts/compliance_qa.py"
      - ".github/workflows/15-ai-security-lifecycle-manual-07-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-security-lifecycle-manual-07-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ai-security-lifecycle-manual-07:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Manual 07 controlled implementation intake
        run: python3 scripts/ai_security_lifecycle_manual_07_qa.py
      - name: Validate authoritative-source registry
        run: python3 scripts/compliance_qa.py sources
      - name: Validate controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog
