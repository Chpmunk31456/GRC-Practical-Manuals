name: Build GRC policy template toolkit

on:
  pull_request:
    branches: [main]
    paths:
      - '08-templates-and-tools/Policy_Template_Toolkit/**'
      - '.github/workflows/build-policy-template-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-template-toolkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-english:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install document tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils unzip

      - name: Assemble controlled English toolkit
        run: |
          set -euo pipefail
          python3 08-templates-and-tools/Policy_Template_Toolkit/scripts/assemble_english_toolkit.py

      - name: Build combined DOCX PDF and editable DOCX templates
        run: |
          set -euo pipefail
          root='08-templates-and-tools/Policy_Template_Toolkit'
          stem='GRC_Policy_Template_Toolkit_English_v1.0'
          md="$root/English/$stem.md"
          docx="$root/English/$stem.docx"
          pdf="$root/English/$stem.pdf"
          pandoc "$md" --toc --toc-depth=3 --metadata title='GRC Policy Template Toolkit' --metadata author='Alberto Al Leiva' -o "$docx"
          libreoffice --headless --convert-to pdf --outdir "$root/English" "$docx" >/dev/null
          test -s "$md"
          test -s "$docx"
          test -s "$pdf"
          unzip -t "$docx" >/dev/null
          pdftotext "$pdf" - | grep -q 'Policy Governance and Document Hierarchy'
          words=$(pdftotext "$pdf" - | wc -w)
          test "$words" -ge 4500
          mkdir -p "$root/English/editable-policy-docx"
          for template in "$root"/templates/*.md; do
            name=$(basename "${template%.md}")
            pandoc "$template" --metadata author='Alberto Al Leiva' -o "$root/English/editable-policy-docx/$name.docx"
            unzip -t "$root/English/editable-policy-docx/$name.docx" >/dev/null
          done
          test "$(find "$root/English/editable-policy-docx" -type f -name '*.docx' | wc -l)" -eq 10

      - name: Validate templates tools and release evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, re
          from pathlib import Path
          root = Path('08-templates-and-tools/Policy_Template_Toolkit')
          expected = {
              'Policy_Register.csv': 25,
              'Policy_Exception_Tracker.csv': 25,
              'Policy_Adoption_and_Review_Checklist.csv': 33,
          }
          counts = {}
          for name, wanted in expected.items():
              with (root / 'tools' / name).open(encoding='utf-8', newline='') as f:
                  rows = list(csv.reader(f))
              got = len(rows[0])
              if got != wanted:
                  raise SystemExit(f'{name}: expected {wanted} fields, found {got}')
              counts[name] = got
          templates = sorted((root / 'templates').glob('*.md'))
          if len(templates) != 10:
              raise SystemExit(f'Expected 10 policy templates, found {len(templates)}')
          safeguard_terms = ('review', 'adapt', 'validate', 'resolve', 'confirm', 'consult')
          placeholder_counts = {}
          for template in templates:
              text = template.read_text(encoding='utf-8')
              count = len(re.findall(r'\[[A-Z][A-Z0-9 _/.-]*\]', text))
              if count < 5:
                  raise SystemExit(f'{template.name}: insufficient controlled placeholders ({count})')
              opening = text.splitlines()[1:10]
              warning = ' '.join(line.strip() for line in opening if line.lstrip().startswith('>')).lower()
              if not warning or not any(term in warning for term in safeguard_terms):
                  raise SystemExit(f'{template.name}: missing substantive drafting safeguard')
              placeholder_counts[template.name] = count
          files = sorted((root / 'English').rglob('*')) + sorted((root / 'tools').glob('*.csv')) + templates
          sums = []
          for path in files:
              if path.is_file():
                  sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / 'English/ENGLISH_SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          report = {
              'status': 'PASS',
              'policy_templates': len(templates),
              'editable_docx_templates': 10,
              'tool_field_counts': counts,
              'template_placeholder_counts': placeholder_counts,
              'combined_docx_zip_integrity': 'PASS',
              'pdf_searchable_text': 'PASS',
              'checksummed_files': len(sums),
              'human_review_limitations': [
                  'Templates require organization-specific legal, regulatory, privacy, labor, records, and contractual review.',
                  'Automated checks do not replace native-language editorial review.',
                  'Automated checks do not replace assistive-technology or full page-by-page visual testing.'
              ]
          }
          (root / 'English/ENGLISH_PACKAGE_QA.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          lines = ['# English Package QA', '', '- Status: **PASS**', '- Policy templates: 10', '- Editable policy DOCX files: 10', '- Combined DOCX ZIP integrity: PASS', '- Combined PDF searchable text: PASS']
          for name, count in counts.items():
              lines.append(f'- {name}: {count} fields')
          lines += ['', '## Human-review limitations', '', '- Legal, regulatory, privacy, labor, records, contractual, and standards review requires qualified humans.', '- Assistive-technology behavior requires native-application testing.', '- Final visual approval requires page-by-page inspection.', '']
          (root / 'English/ENGLISH_PACKAGE_QA.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Commit generated English package
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          branch='${{ github.event.pull_request.head.ref }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 08-templates-and-tools/Policy_Template_Toolkit/English
          if git diff --cached --quiet; then
            echo 'No generated English changes.'
          else
            git commit -m 'Build and validate English policy toolkit package'
            git fetch origin "$branch"
            git rebase "origin/$branch"
            git push origin "HEAD:$branch"
          fi

      - name: Upload English review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: policy-template-toolkit-english-candidate
          path: 08-templates-and-tools/Policy_Template_Toolkit/English
          if-no-files-found: error
          retention-days: 30
