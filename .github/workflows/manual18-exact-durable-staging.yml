name: "Manual 18 Exact Durable Staging"

on:
  push:
    branches:
      - release/manual18-durable-package-r2-2026-08-30
    paths:
      - ".github/workflows/manual18-exact-durable-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/manual18-durable-package-r2-2026-08-30
          fetch-depth: 0
      - name: Download exact candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/9743589509/zip > /tmp/manual18.zip
          mkdir -p /tmp/manual18
          unzip -q /tmp/manual18.zip -d /tmp/manual18
      - name: Verify exact candidate hashes
        run: |
          set -euo pipefail
          cd /tmp/manual18
          echo "65efb6ff547b3ddec29b8540f1b44ff768854d77a218de38159311f70f15d8a8  Manual_18_GLBA_FTC_Safeguards_Controlled_EN.docx" | sha256sum -c -
          echo "ffc42d6fb60852c7bc865ce6e12070a6bbb1d2d03c9e02961bb1419ae69774ac  Manual_18_GLBA_FTC_Safeguards_Controlled_EN.pdf" | sha256sum -c -
          echo "f2c0f32868403d4f03828e9015af46aa384af418c53237d3b739f0963bdadda1  Manual_18_GLBA_FTC_Safeguards_Controlled_ES-419.docx" | sha256sum -c -
          echo "d04ad4840a82372ef63c6b84f9d0079db9c6d1d658d2f3d4187705a5e1abf5ed  Manual_18_GLBA_FTC_Safeguards_Controlled_ES-419.pdf" | sha256sum -c -
          echo "cacf88ac1c872caab8402d225ce98cd794e7bb5aeafae1ffda18ccb38c4ed319  Manual_18_GLBA_FTC_Safeguards_Controlled_PT-BR.docx" | sha256sum -c -
          echo "0d29e706ba3da0affa9090bc9ed6b9eec52051410aa8908895e2c793acdd8d96  Manual_18_GLBA_FTC_Safeguards_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact durable package and provenance
        run: |
          set -euo pipefail
          ROOT="04-regulatory-compliance/GLBA_FTC_Safeguards_Controlled_Implementation/publication"
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual18/Manual_18_GLBA_FTC_Safeguards_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual18/Manual_18_GLBA_FTC_Safeguards_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual18/Manual_18_GLBA_FTC_Safeguards_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual18/Manual_18_GLBA_FTC_Safeguards_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual18/Manual_18_GLBA_FTC_Safeguards_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual18/Manual_18_GLBA_FTC_Safeguards_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          cp /tmp/manual18/MANUAL_18_CANDIDATE_MANIFEST.json "$ROOT/MANUAL_18_CANDIDATE_MANIFEST.json"
      - name: Commit exact package and remove temporary staging workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-regulatory-compliance/GLBA_FTC_Safeguards_Controlled_Implementation/publication
          git rm .github/workflows/manual18-exact-durable-staging.yml
          git commit -m "Stage Manual 18 exact durable publication package"
          git push origin HEAD:release/manual18-durable-package-r2-2026-08-30
