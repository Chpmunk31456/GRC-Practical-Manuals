name: Manual 53 final publication transfer

on:
  push:
    branches:
      - publish/manual53-final-2026-09-01
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/manual53-final-2026-09-01
          fetch-depth: 0

      - name: Download frozen Manual 53 artifact
        uses: actions/download-artifact@v4
        with:
          name: manual53-six-binary-candidate
          run-id: 33573114591
          github-token: ${{ github.token }}
          repository: Chpmunk31456/GRC-Practical-Manuals
          path: /tmp/manual53-artifact

      - name: Verify exact frozen hashes and bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/manual53-artifact')
          expected={
            'Manual_53_AI_Privacy_Data_Governance_EN.docx':(40482,'c2933ec816b39d949ab6e1cd6323a2947ba7b4cd51669b532a4c31389823ab92'),
            'Manual_53_AI_Privacy_Data_Governance_EN.pdf':(66019,'33b1c8c69fbcc91ccc5585ea0bb0a62c5227a60d3879a06fc24eeb607f1c3885'),
            'Manual_53_AI_Privacy_Data_Governance_ES-419.docx':(40585,'2bb08e0fba506e80d35577cd42de561e4c34208e90f7eeecec516443b2bad3ed'),
            'Manual_53_AI_Privacy_Data_Governance_ES-419.pdf':(67340,'957a4df75bd1b734c0ff3b94a8d6179c471178c9d08a6c42a047f5bb89534bef'),
            'Manual_53_AI_Privacy_Data_Governance_PT-BR.docx':(40642,'f4a93ca8a7ed681a60be68ff975efd23578fb685eb0284871d016100abb8d896'),
            'Manual_53_AI_Privacy_Data_Governance_PT-BR.pdf':(68619,'a0a281f1adac54f3957b2fb2487d44773cab63f7c6fbda32501814493fe288d9'),
          }
          found={p.name:p for p in root.rglob('*') if p.is_file() and p.name in expected}
          assert set(found)==set(expected)
          for name,(size,sha) in expected.items():
              data=found[name].read_bytes(); assert len(data)==size; assert hashlib.sha256(data).hexdigest()==sha
              print('verified',name,size,sha)
          PY

      - name: Stage exact bytes, controlled sources and publication registries
        shell: bash
        run: |
          set -euo pipefail
          ROOT='10-ai-governance/Manual_53_AI_Privacy_Data_Governance'
          mkdir -p "$ROOT/controlled/en" "$ROOT/controlled/es-419" "$ROOT/controlled/pt-BR" "$ROOT/qa"
          find /tmp/manual53-artifact -type f \( -name '*.docx' -o -name '*.pdf' \) -exec cp {} "$ROOT/" \;
          manifest=$(find /tmp/manual53-artifact -name MANUAL_53_CANDIDATE_MANIFEST.json -type f -print -quit); test -n "$manifest"; cp "$manifest" "$ROOT/qa/MANUAL_53_CANDIDATE_MANIFEST.json"
          git fetch origin release/manual53-candidate-2026-09-01
          git show origin/release/manual53-candidate-2026-09-01:"$ROOT/controlled/en/MANUAL_53_CONTROLLED_EN.md" > "$ROOT/controlled/en/MANUAL_53_CONTROLLED_EN.md"
          git show origin/release/manual53-candidate-2026-09-01:"$ROOT/controlled/es-419/MANUAL_53_CONTROLLED_ES_419.md" > "$ROOT/controlled/es-419/MANUAL_53_CONTROLLED_ES_419.md"
          git show origin/release/manual53-candidate-2026-09-01:"$ROOT/controlled/pt-BR/MANUAL_53_CONTROLLED_PT_BR.md" > "$ROOT/controlled/pt-BR/MANUAL_53_CONTROLLED_PT_BR.md"
          python - <<'PY'
          from pathlib import Path
          import json
          cp=Path('.compliance/manual-catalog.json'); c=json.loads(cp.read_text()); ms=c.setdefault('manuals',[])
          e={'id':'manual-53-ai-privacy-data-governance','title':'Manual 53 — AI Privacy & Data Governance','path':'10-ai-governance/Manual_53_AI_Privacy_Data_Governance','layout':'controlled-build','series_order':53,'status':'published','release_state':'published'}
          idx=[i for i,m in enumerate(ms) if m.get('series_order')==53 or m.get('id')==e['id'] or m.get('path')==e['path']]
          if idx:
              ms[idx[0]]=e
              for i in reversed(idx[1:]): del ms[i]
          else: ms.append(e)
          cp.write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          rp=Path('.compliance/work-product-releases.json'); r=json.loads(rp.read_text()); ps=r.setdefault('released_work_products',[])
          rid=e['id']; ev='Manual 53 exact trilingual candidate: workflow 33573114591, artifact 9825670619, source head e15050e25f8625480ee30d86daf67004b14ce71e, archive digest sha256:02eedc9e8ea53f693694da20ea38aa874cf0db1340c5f38c97fa4f11d8e187da. Six DOCX/PDF binaries passed deterministic build, visible-text, raster-render and PD-01 through PD-20 parity checks; exact bytes were hash/size verified before durable staging. Predecessor Manual 52 is published.'
          ne={'id':rid,'type':'manual','release_state':'published','release_evidence':ev}; ix=[i for i,p in enumerate(ps) if p.get('id')==rid]
          if ix: ps[ix[0]]=ne
          else: ps.append(ne)
          r['last_updated']='2026-09-01'; rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Remove temporary workflow and commit publication transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/105-manual53-final-publication-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Manual 53 exact frozen binaries and registry state'
          git push origin HEAD:publish/manual53-final-2026-09-01
