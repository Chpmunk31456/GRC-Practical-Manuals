name: Audit CIS Portuguese full manual

on:
  workflow_dispatch:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - 'qa/requests/AUDIT_CIS_PORTUGUESE_FULL_MANUAL.md'
      - 'qa/tools/audit_cis_portuguese_full_manual.py'
      - '.github/workflows/audit-cis-portuguese-full-manual.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Run full-manual audit
        run: python3 qa/tools/audit_cis_portuguese_full_manual.py

      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/CIS_CONTROLS_V8_1_PTBR_FULL_MANUAL_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No audit report change to commit.'
          else
            git commit -m 'Audit CIS Portuguese full manual'
            git push origin HEAD:production/multilingual-grc-editions
          fi
