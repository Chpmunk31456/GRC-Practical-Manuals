name: "28 - Manual 25 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/28-manual25-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact-bytes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact Manual 25 candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual25-candidate
          mkdir -p /tmp/manual25-candidate
          gh run download 33390353180 -R "$GITHUB_REPOSITORY" -n manual25-six-binary-candidate -D /tmp/manual25-candidate
      - name: Verify exact candidate SHA-256 identities
        run: |
          cd /tmp/manual25-candidate
          printf '%s  %s\n' \
            74f9ff06517466ba8d74f3774e1f6eeea0075b198a092fa1da83f11d9221f77c Manual_25_ISO_22301_Controlled_EN.docx \
            9623dcaa191eba3ca803ebafbd34992975f0a2543b135558ecdbc10a0f0bec46 Manual_25_ISO_22301_Controlled_EN.pdf \
            df448cdc7c09aed1f55f32dd8878dcf699a0173bfccd8d1c5c2e9f237d2250a9 Manual_25_ISO_22301_Controlled_ES-419.docx \
            618111659d75c1e3a8c3c0d05c7897e8a4a3788a185495a54613d7f9632e4586 Manual_25_ISO_22301_Controlled_ES-419.pdf \
            d5f754019672a42bed1d6090e7abc7e1d3d78067b5ef39c4bbe63f8f71294e22 Manual_25_ISO_22301_Controlled_PT-BR.docx \
            fd07431ca5366435c753a9fb02e93e600c87b07aee78acbdb05eab8bfa908e45 Manual_25_ISO_22301_Controlled_PT-BR.pdf | sha256sum -c -
      - name: Copy exact bytes without regeneration and self-remove staging workflow
        run: |
          ROOT='05-operational-resilience/ISO_22301_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp /tmp/manual25-candidate/Manual_25_ISO_22301_Controlled_EN.docx "$ROOT/en/"
          cp /tmp/manual25-candidate/Manual_25_ISO_22301_Controlled_EN.pdf "$ROOT/en/"
          cp /tmp/manual25-candidate/Manual_25_ISO_22301_Controlled_ES-419.docx "$ROOT/es-419/"
          cp /tmp/manual25-candidate/Manual_25_ISO_22301_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp /tmp/manual25-candidate/Manual_25_ISO_22301_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp /tmp/manual25-candidate/Manual_25_ISO_22301_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/28-manual25-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/28-manual25-exact-staging.yml
          git commit -m 'Stage Manual 25 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
