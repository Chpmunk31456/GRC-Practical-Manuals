name: Regenerate ISO PT-BR sections 25 and 28

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/triggers/iso-ptbr-sections-25-28.md'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0
      - run: python3 qa/tools/regenerate_iso_ptbr_sections_25_28.py
      - continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_sources.py
      - continue-on-error: true
        run: python3 qa/tools/audit_iso_localized_section_parity.py
      - name: Commit source and evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '02-management-systems/ISO_IEC_27001_27002/Portugues_BR/ISO_IEC_27001_27002_Practical_Manager_and_Junior_Analyst_Manual_Portugues_BR_v1.0.md' qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.md qa/ISO_IEC_27001_27002_LOCALIZED_SOURCE_AUDIT.json qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.md qa/ISO_IEC_27001_27002_SECTION_PARITY_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate ISO PT-BR sections 25 and 28'
            git fetch origin production/multilingual-grc-editions
            git rebase origin/production/multilingual-grc-editions
            git push origin HEAD:production/multilingual-grc-editions
          fi
      - name: Preserve fail-closed publication gate
        run: |
          echo 'Structural repair committed; publication still requires package and visual QA.'
          exit 1
