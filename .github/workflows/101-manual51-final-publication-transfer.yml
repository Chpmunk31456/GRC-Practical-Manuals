name: Manual 51 final publication transfer

on:
  push:
    branches:
      - publish/manual51-final-2026-09-01
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publish/manual51-final-2026-09-01
          fetch-depth: 0

      - name: Download frozen Manual 51 artifact
        uses: actions/download-artifact@v4
        with:
          name: manual51-six-binary-candidate
          run-id: 33571776851
          github-token: ${{ github.token }}
          repository: Chpmunk31456/GRC-Practical-Manuals
          path: /tmp/manual51-artifact

      - name: Verify exact frozen hashes and bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/manual51-artifact')
          expected={
            'Manual_51_Agentic_AI_Governance_Security_EN.docx':(41251,'869d249b287afd4609ec4ad3c834b34003f39bd21a16be5e5f3871fc9978035b'),
            'Manual_51_Agentic_AI_Governance_Security_EN.pdf':(68309,'adac9a4dc57febf7ba1d41ea647aff7705f1bcc6fe9f5ee1b5946952a241878d'),
            'Manual_51_Agentic_AI_Governance_Security_ES-419.docx':(40667,'7ba0c6bc964cb9b6ed22c314f636936c3c6acf894ffa94d855f659d1f10baca2'),
            'Manual_51_Agentic_AI_Governance_Security_ES-419.pdf':(67177,'4b0446dbbd70863d0f1324a28eafb674e66b5c5db09fbb38fa542c39eeec4fa4'),
            'Manual_51_Agentic_AI_Governance_Security_PT-BR.docx':(40705,'c55af256c46fa6e64eadb5f88a277c0bfebb9f45edd8f2e17aabb62a8da5f562'),
            'Manual_51_Agentic_AI_Governance_Security_PT-BR.pdf':(68805,'5c3b831fca6129392c89d73045e67499790c9a14c1b6a8dfe720482fdba1d10b'),
          }
          found={p.name:p for p in root.rglob('*') if p.is_file() and p.name in expected}
          assert set(found)==set(expected), (set(expected)-set(found), set(found)-set(expected))
          for name,(size,sha) in expected.items():
              data=found[name].read_bytes()
              assert len(data)==size,(name,len(data),size)
              got=hashlib.sha256(data).hexdigest()
              assert got==sha,(name,got,sha)
              print('verified',name,size,sha)
          PY

      - name: Stage exact bytes, controlled sources and publication registries
        shell: bash
        run: |
          set -euo pipefail
          ROOT='10-ai-governance/Manual_51_Agentic_AI_Governance_Security'
          mkdir -p "$ROOT/controlled/en" "$ROOT/controlled/es-419" "$ROOT/controlled/pt-BR" "$ROOT/qa"
          for f in /tmp/manual51-artifact/**/Manual_51_Agentic_AI_Governance_Security_* /tmp/manual51-artifact/Manual_51_Agentic_AI_Governance_Security_*; do
            [ -f "$f" ] || continue
            case "$f" in *.docx|*.pdf) cp "$f" "$ROOT/" ;; esac
          done
          manifest=$(find /tmp/manual51-artifact -name MANUAL_51_CANDIDATE_MANIFEST.json -type f -print -quit)
          test -n "$manifest"
          cp "$manifest" "$ROOT/qa/MANUAL_51_CANDIDATE_MANIFEST.json"
          git fetch origin release/manual51-candidate-2026-09-01
          git show origin/release/manual51-candidate-2026-09-01:"$ROOT/controlled/en/MANUAL_51_CONTROLLED_EN.md" > "$ROOT/controlled/en/MANUAL_51_CONTROLLED_EN.md"
          git show origin/release/manual51-candidate-2026-09-01:"$ROOT/controlled/es-419/MANUAL_51_CONTROLLED_ES_419.md" > "$ROOT/controlled/es-419/MANUAL_51_CONTROLLED_ES_419.md"
          git show origin/release/manual51-candidate-2026-09-01:"$ROOT/controlled/pt-BR/MANUAL_51_CONTROLLED_PT_BR.md" > "$ROOT/controlled/pt-BR/MANUAL_51_CONTROLLED_PT_BR.md"
          python - <<'PY'
          from pathlib import Path
          import json
          catalog_path=Path('.compliance/manual-catalog.json')
          catalog=json.loads(catalog_path.read_text(encoding='utf-8'))
          manuals=catalog.setdefault('manuals',[])
          entry={
            'id':'manual-51-agentic-ai-governance-security',
            'title':'Manual 51 — Agentic AI Governance, Security & Human Accountability',
            'path':'10-ai-governance/Manual_51_Agentic_AI_Governance_Security',
            'layout':'controlled-build','series_order':51,
            'status':'published','release_state':'published'
          }
          matches=[i for i,m in enumerate(manuals) if m.get('series_order')==51 or m.get('id')==entry['id'] or m.get('path')==entry['path']]
          if matches:
              manuals[matches[0]]=entry
              for i in reversed(matches[1:]): del manuals[i]
          else:
              insert=next((i+1 for i,m in enumerate(manuals) if m.get('series_order')==50),len(manuals))
              manuals.insert(insert,entry)
          catalog_path.write_text(json.dumps(catalog,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          rel_path=Path('.compliance/work-product-releases.json')
          rel=json.loads(rel_path.read_text(encoding='utf-8'))
          products=rel.setdefault('released_work_products',[])
          rid='manual-51-agentic-ai-governance-security'
          evidence=('Manual 51 exact trilingual candidate was produced by successful workflow run 33571776851 '
                    '/ artifact 9825198686 at source head 07471a6c92dd951df8cfdc5292a56bb84edcb7c3. '
                    'The six EN/es-419/pt-BR DOCX/PDF binaries passed deterministic build, visible-text, raster-render, '
                    'and AG-01 through AG-20 trilingual parity checks; artifact archive digest '
                    'sha256:919673132e93b5c40e054d1201ac1f5027b932c2ea5287aafe6815dd31502c1d. '
                    'Exact bytes were fail-closed hash/size verified before durable staging. IMDA, NIST and OWASP source '
                    'status was reconciled as of 1 September 2026 without overstating voluntary, concept-stage or community '
                    'guidance. Predecessor Manual 50 is published. The temporary write-enabled transfer workflow removes '
                    'itself before the final publication tree; publication merge remains subject to retained exact-head CI.')
          entry={'id':rid,'type':'manual','release_state':'published','release_evidence':evidence}
          matches=[i for i,p in enumerate(products) if p.get('id')==rid]
          if matches:
              products[matches[0]]=entry
              for i in reversed(matches[1:]): del products[i]
          else: products.append(entry)
          rel['last_updated']='2026-09-01'
          rel_path.write_text(json.dumps(rel,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit publication transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/101-manual51-final-publication-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Manual 51 exact frozen binaries and registry state'
          git push origin HEAD:publish/manual51-final-2026-09-01
