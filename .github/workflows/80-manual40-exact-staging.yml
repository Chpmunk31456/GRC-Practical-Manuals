name: "80 - Manual 40 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/80-manual40-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download frozen candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33439699453 -n manual40-six-binary-candidate -D candidate
      - name: Verify exact provenance-bound hashes
        run: |
          echo "8ba4e7d27c20d649c546efab734a83b9400604ff22d051982f0ebf30a0d62edb  candidate/Manual_40_CJIS_Security_Policy_Controlled_EN.docx" | sha256sum -c -
          echo "9e1b0ac4bfdd79e345d10ebe9a553643c85d61d8dda2fa00b41c63f470589219  candidate/Manual_40_CJIS_Security_Policy_Controlled_EN.pdf" | sha256sum -c -
          echo "54de09ad9267038a0c22be1a275291ecc5b4ae961671af93a6ea119fb2a6adfe  candidate/Manual_40_CJIS_Security_Policy_Controlled_ES-419.docx" | sha256sum -c -
          echo "3f03bc68b383bb44b3e9664d9db12e9717c7484d16877a0e6fb67ff1bca35e7c  candidate/Manual_40_CJIS_Security_Policy_Controlled_ES-419.pdf" | sha256sum -c -
          echo "aaad35c5d378a775d1ccfb9546e29d98b4e4a87ff4c32f8bad0087b216d57716  candidate/Manual_40_CJIS_Security_Policy_Controlled_PT-BR.docx" | sha256sum -c -
          echo "5a8a7c13ad265e5b03c76cb1a425ef2a299c6fffb557e41f91f75e82657bd1a3  candidate/Manual_40_CJIS_Security_Policy_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact bytes and self-remove workflow
        run: |
          ROOT='04-regulatory-compliance/CJIS_Security_Policy_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp candidate/Manual_40_CJIS_Security_Policy_Controlled_EN.docx "$ROOT/en/"
          cp candidate/Manual_40_CJIS_Security_Policy_Controlled_EN.pdf "$ROOT/en/"
          cp candidate/Manual_40_CJIS_Security_Policy_Controlled_ES-419.docx "$ROOT/es-419/"
          cp candidate/Manual_40_CJIS_Security_Policy_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp candidate/Manual_40_CJIS_Security_Policy_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp candidate/Manual_40_CJIS_Security_Policy_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/80-manual40-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/80-manual40-exact-staging.yml
          git commit -m 'Stage Manual 40 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}