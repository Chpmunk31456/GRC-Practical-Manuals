name: Generate Spanish GDPR figures

on:
  push:
    branches:
      - restore/gdpr-spanish-figures-1-4
    paths:
      - scripts/generate_gdpr_spanish_figures.py
      - .github/workflows/generate-gdpr-spanish-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: restore/gdpr-spanish-figures-1-4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate figures
        run: python scripts/generate_gdpr_spanish_figures.py

      - name: Validate PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('04-regulatory-compliance/GDPR/Espanol/media')
          expected = {
              'image1.png': (1628, 857),
              'image2.png': (1628, 886),
              'image3.png': (1628, 886),
              'image4.png': (1628, 915),
          }
          for name, size in expected.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing generated file: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.format != 'PNG' or image.size != size:
                      raise SystemExit(f'Invalid {path}: format={image.format}, size={image.size}, expected={size}')
          print('Validated four Spanish GDPR PNG figures.')
          PY

      - name: Commit generated figures
        run: |
          git add 04-regulatory-compliance/GDPR/Espanol/media/image1.png \
            04-regulatory-compliance/GDPR/Espanol/media/image2.png \
            04-regulatory-compliance/GDPR/Espanol/media/image3.png \
            04-regulatory-compliance/GDPR/Espanol/media/image4.png
          if git diff --cached --quiet; then
            echo 'Generated figures are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate Spanish GDPR figures 1-4'
          git push origin HEAD:restore/gdpr-spanish-figures-1-4
