name: Review CIS Controls localized figures

on:
  push:
    branches:
      - audit/cis-controls-v8.1-localized-figures
    paths:
      - scripts/generate_cis_localized_review_figures.py
      - .github/workflows/review-cis-controls-localized-figures.yml
      - 01-foundations/CIS_Controls_v8.1/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_v1.0.docx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/cis-controls-v8.1-localized-figures

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate localized review candidates
        run: python scripts/generate_cis_localized_review_figures.py

      - name: Validate candidates against authoritative DOCX dimensions
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image

          docx = Path('01-foundations/CIS_Controls_v8.1/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_v1.0.docx')
          out = Path('review/cis-controls-v8.1-localized-figures')
          with ZipFile(docx) as z:
              expected = {}
              for i in range(1, 11):
                  with Image.open(BytesIO(z.read(f'word/media/image{i}.png'))) as src:
                      expected[i] = src.size

          files = [out / 'es-LATAM-image3.png'] + [out / f'pt-BR-image{i}.png' for i in range(1, 11)]
          if len(files) != 11 or any(not p.exists() for p in files):
              raise SystemExit('Expected 11 review PNGs.')

          for p in files:
              number = int(p.stem.split('image')[1])
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  if im.format != 'PNG' or im.size != expected[number]:
                      raise SystemExit(f'{p}: expected PNG {expected[number]}, got {im.format} {im.size}')
          print('All 11 CIS review candidates passed integrity and exact-dimension validation.')
          PY

      - name: Commit validated review candidates
        run: |
          if [ -z "$(git status --porcelain -- review/cis-controls-v8.1-localized-figures)" ]; then
            echo 'Review candidates unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f review/cis-controls-v8.1-localized-figures
          git commit -m 'Add CIS localized review candidates'
          git push

      - name: Upload review candidates
        uses: actions/upload-artifact@v4
        with:
          name: cis-controls-localized-review-candidates
          path: review/cis-controls-v8.1-localized-figures/
          if-no-files-found: error
          retention-days: 30
