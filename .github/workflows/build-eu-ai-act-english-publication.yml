name: Build EU AI Act English publication

on:
  push:
    branches:
      - manual/eu-ai-act-grc-compliance
      - production/multilingual-grc-editions
    paths:
      - '04-regulatory-compliance/EU_AI_Act_GRC/**'
      - '.github/workflows/build-eu-ai-act-english-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out controlled branch
        uses: actions/checkout@v4

      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            libreoffice-writer \
            python3-uno \
            poppler-utils \
            fonts-dejavu-core \
            fonts-liberation

      - name: Inventory all English sources
        run: |
          python3 04-regulatory-compliance/EU_AI_Act_GRC/tools/inventory_english_sources.py \
            --repo-root .

      - name: Assemble canonical English Markdown
        run: |
          python3 04-regulatory-compliance/EU_AI_Act_GRC/tools/build_english_publication.py \
            --repo-root . \
            --out-dir build/eu-ai-act

      - name: Normalize publication heading hierarchy
        run: |
          python3 04-regulatory-compliance/EU_AI_Act_GRC/tools/normalize_publication_headings.py \
            --build-dir build/eu-ai-act

      - name: Generate DOCX
        run: |
          pandoc \
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Master.md \
            --from markdown+raw_tex \
            --to docx \
            --toc \
            --toc-depth=1 \
            --number-sections \
            --metadata title='EU Artificial Intelligence Act GRC Compliance Manual' \
            --output build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.docx

      - name: Refresh DOCX table of contents
        env:
          HOME: ${{ runner.temp }}/lo-toc-home
        run: |
          mkdir -p "$HOME"
          libreoffice \
            --headless \
            --accept='socket,host=127.0.0.1,port=2002;urp;StarOffice.ServiceManager' \
            --norestore \
            --nofirststartwizard \
            > "$RUNNER_TEMP/libreoffice-toc.log" 2>&1 &
          LO_PID=$!
          trap 'kill "$LO_PID" 2>/dev/null || true' EXIT
          python3 04-regulatory-compliance/EU_AI_Act_GRC/tools/update_docx_toc.py \
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.docx \
            --port 2002
          kill "$LO_PID" 2>/dev/null || true
          wait "$LO_PID" 2>/dev/null || true
          trap - EXIT

      - name: Generate PDF from DOCX
        env:
          HOME: ${{ runner.temp }}/lo-pdf-home
        run: |
          mkdir -p "$HOME" build/eu-ai-act/pdf-output
          libreoffice \
            --headless \
            --convert-to pdf \
            --outdir build/eu-ai-act/pdf-output \
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.docx
          mv \
            build/eu-ai-act/pdf-output/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.pdf \
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.pdf

      - name: Render PDF pages for visual review package
        run: |
          mkdir -p build/eu-ai-act/rendered-pages
          pdftoppm \
            -png \
            -r 110 \
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.pdf \
            build/eu-ai-act/rendered-pages/page
          pdfinfo build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.pdf \
            > build/eu-ai-act/PDF_INFO.txt

      - name: Run fail-closed automated QA
        run: |
          python3 04-regulatory-compliance/EU_AI_Act_GRC/tools/qa_english_publication.py \
            --build-dir build/eu-ai-act

      - name: Create artifact checksums
        run: |
          cd build/eu-ai-act
          sha256sum \
            EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Master.md \
            EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.docx \
            EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.pdf \
            CANONICAL_BUILD_MANIFEST.json \
            AUTOMATED_QA_REPORT.json \
            > SHA256SUMS.txt

      - name: Upload controlled review package
        uses: actions/upload-artifact@v4
        with:
          name: eu-ai-act-english-controlled-review
          path: |
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Master.md
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.docx
            build/eu-ai-act/EU_AI_Act_GRC_Compliance_Manual_English_Controlled_Review.pdf
            build/eu-ai-act/CANONICAL_BUILD_MANIFEST.json
            build/eu-ai-act/AUTOMATED_QA_REPORT.json
            build/eu-ai-act/PDF_INFO.txt
            build/eu-ai-act/SHA256SUMS.txt
            build/eu-ai-act/rendered-pages/
          retention-days: 30
          if-no-files-found: error
