name: "20 - Manual 03 Publication Repair"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/20-manual03-publication-repair.yml"
      - "01-foundations/NIST_AI_RMF_1.0/**"
      - ".compliance/nist-ai-rmf-manual-03-baseline.json"
      - "scripts/generate_nist_ai_rmf_manual_03_publication*.py"
      - "scripts/pdf_content_preflight.py"

permissions:
  contents: read

jobs:
  generate-publication-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install LibreOffice conversion dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install publication dependencies
        run: python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate Manual 03 controlled publication package
        run: python3 scripts/generate_nist_ai_rmf_manual_03_publication_v3.py --output-root "$RUNNER_TEMP/manual03-repair" --source-head "${{ github.event.pull_request.head.sha }}"
      - name: Fail closed on generated PDF content
        run: python3 scripts/pdf_content_preflight.py "$RUNNER_TEMP/manual03-repair/publication"
      - name: Upload repair package for controlled reconciliation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual03-publication-repair
          path: |
            ${{ runner.temp }}/manual03-repair/publication
            ${{ runner.temp }}/manual03-repair/qa
            ${{ runner.temp }}/manual03-repair/contact-sheets
          if-no-files-found: error
          retention-days: 1
