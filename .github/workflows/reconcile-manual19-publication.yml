name: "Reconcile Manual 19 publication state"

on:
  push:
    branches:
      - release/manual19-publication-reconciliation-2026-08-31
    paths:
      - ".github/workflows/reconcile-manual19-publication.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/manual19-publication-reconciliation-2026-08-31
          fetch-depth: 0
      - name: Reconcile catalog and work-product registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          registry_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          registry = json.loads(registry_path.read_text(encoding='utf-8'))

          manual_id = 'fedramp-fisma-controlled'
          entry = {
              'id': manual_id,
              'title': 'Manual 19 — FedRAMP / FISMA Controlled Implementation',
              'path': '04-regulatory-compliance/FedRAMP_FISMA_Controlled_Implementation',
              'status': 'published',
              'release_state': 'published',
              'layout': 'controlled-build',
              'series_order': 19,
          }
          manuals = catalog['manuals']
          existing = next((m for m in manuals if m.get('id') == manual_id), None)
          if existing:
              existing.update(entry)
          else:
              toolkit_index = next((i for i,m in enumerate(manuals) if m.get('id') == 'ai-governance-audit-toolkit'), len(manuals))
              manuals.insert(toolkit_index, entry)
          catalog['last_updated'] = '2026-08-31'

          evidence = (
              'Manual 19 controlled English was frozen to blob 6dc279577768f23f9c2d799b04a0544fa1bfe1c4 and controlled es-419/pt-BR localizations were merged. '
              'The stale unconditional localization-review wording was aligned to the canonical release policy through PR #318. '
              'The exact six-binary candidate was generated successfully by workflow run 33366244377 / artifact 9748385723 at candidate head cc09d80206ddcccd9e061dce8a4fc27d90e667c7, with artifact digest sha256:79b6718596eb218f1762ab07999e4978f2732cc7c5774a47c03051aafdcb543c. '
              'Workflow Security, Release Pipeline Meta QA, Release Package QA, and Manual 19 Candidate Build passed on that exact candidate. '
              'PR #320 bound the six SHA-256 identities plus deterministic rendered/document/accessibility QA with no identified defect requiring regeneration. '
              'PR #322 durably staged the exact EN/es-419/pt-BR DOCX/PDF bytes after fail-closed hash verification; staging head 56155a766f2ab2dbd8800749dd304828509a59a7 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA before merge. '
              'Predecessor Manual 18 is published. Standing release authorization applies under the canonical no-errors/no-issues rule because applicable objective gates are green and no unresolved material source, technical, localization, integrity, packaging, accessibility, provenance, or substantive defect is recorded.'
          )
          released = registry['released_work_products']
          rentry = {'id': manual_id, 'type': 'manual', 'release_state': 'published', 'release_evidence': evidence}
          rexisting = next((r for r in released if r.get('id') == manual_id), None)
          if rexisting:
              rexisting.update(rentry)
          else:
              released.append(rentry)
          registry['last_updated'] = '2026-08-31'

          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/reconcile-manual19-publication.yml
      - name: Commit reconciliation and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Manual 19 catalog and release-state reconciliation'
          git push origin HEAD:release/manual19-publication-reconciliation-2026-08-31
