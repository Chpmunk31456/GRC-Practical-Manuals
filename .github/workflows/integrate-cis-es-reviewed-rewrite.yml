name: Integrate reviewed CIS Spanish rewrite

on:
  push:
    branches:
      - production/multilingual-grc-editions
    paths:
      - '.github/workflows/integrate-cis-es-reviewed-rewrite.yml'
      - 'scripts/integrate_cis_es_reviewed_rewrite.py'
      - 'qa/rewrite/CIS_CONTROLS_V8_1_ES_CONTROL_18_AND_TOOLS_REVIEWED.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-cis-es-reviewed-rewrite
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/multilingual-grc-editions
          fetch-depth: 0

      - name: Integrate reviewed sections 23 and 24
        run: python3 scripts/integrate_cis_es_reviewed_rewrite.py

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          source='01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md'
          test "$(grep -c '^| 18\.[1-5] |' "$source")" -eq 5
          test "$(grep -c '^# 23\. Control 18 — Pruebas de penetración$' "$source")" -eq 1
          test "$(grep -c '^# 24\. Herramientas de código abierto$' "$source")" -eq 1
          ! grep -E 'TEN TODO|tención|Silencioso|tóxico' "$source"

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01-foundations/CIS_Controls_v8.1/Espanol/CIS_Critical_Security_Controls_v8.1_Practical_Manager_and_Junior_Analyst_Manual_Espanol_v1.0.md'
          if git diff --cached --quiet; then
            echo 'No source change to commit.'
          else
            git commit -m 'Integrate reviewed CIS Spanish Control 18 and tools sections'
            git push origin HEAD:production/multilingual-grc-editions
          fi
