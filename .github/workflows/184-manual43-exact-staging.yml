name: "184 - Manual 43 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/184-manual43-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download frozen candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33445224426 -n manual43-six-binary-candidate -D candidate
      - name: Verify exact provenance-bound hashes
        run: |
          echo "548119669747a6d175d846473353a8f0631f6c24bc6ccac0bc7e13a5a4b346fb  candidate/Manual_43_ISO_IEC_27017_27018_Controlled_EN.docx" | sha256sum -c -
          echo "30ec3172b842b181c4898d8f4d02086a75848d0571ca05427e3946e27d88844c  candidate/Manual_43_ISO_IEC_27017_27018_Controlled_EN.pdf" | sha256sum -c -
          echo "cb391d78def21dce654be01acd4cb28cc85c092fb44b222a0374e50a116a40b4  candidate/Manual_43_ISO_IEC_27017_27018_Controlled_ES-419.docx" | sha256sum -c -
          echo "77a6b00cf6e25aef115d51f52bf347793b074f043a6d443cd72a4d4b852b1eb2  candidate/Manual_43_ISO_IEC_27017_27018_Controlled_ES-419.pdf" | sha256sum -c -
          echo "26c852ec495a5b0bb54b0399150fe524395be2b006491bbbd499836bce79574f  candidate/Manual_43_ISO_IEC_27017_27018_Controlled_PT-BR.docx" | sha256sum -c -
          echo "d748a29421dc3523621839096e9652818942d5c055443fe301e3af88979859a0  candidate/Manual_43_ISO_IEC_27017_27018_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact bytes and self-remove workflow
        run: |
          ROOT='06-cloud-and-technology-risk/ISO_IEC_27017_27018_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp candidate/Manual_43_ISO_IEC_27017_27018_Controlled_EN.docx "$ROOT/en/"
          cp candidate/Manual_43_ISO_IEC_27017_27018_Controlled_EN.pdf "$ROOT/en/"
          cp candidate/Manual_43_ISO_IEC_27017_27018_Controlled_ES-419.docx "$ROOT/es-419/"
          cp candidate/Manual_43_ISO_IEC_27017_27018_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp candidate/Manual_43_ISO_IEC_27017_27018_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp candidate/Manual_43_ISO_IEC_27017_27018_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/184-manual43-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/184-manual43-exact-staging.yml
          git commit -m 'Stage Manual 43 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
