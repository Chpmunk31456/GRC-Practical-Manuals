name: "37 - Manual 06 Corrected Durable Restage"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/37-manual06-corrected-durable-restage.yml"

# Temporary same-repository repair workflow. Writes only to the dedicated
# Manual 06 reviewer-readiness branch and is deleted before merge.
permissions:
  contents: write

jobs:
  restage-manual06:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fail closed outside Manual 06 repair branch
        run: test "$(git branch --show-current)" = "repair/manual06-reviewer-ready-preflight-2026-08-29"
      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python3 -m pip install --disable-pip-version-check pymupdf pillow python-docx
      - name: Generate and validate corrected Manual 06 package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/manual06-corrected"
          python3 scripts/generate_hipaa_implementation_manual_06_publication_v2.py --output-root "$OUT" --source-head "${{ github.event.pull_request.head.sha }}"
          python3 scripts/pdf_content_preflight.py "$OUT/publication"
          python3 scripts/localized_publication_regression_qa.py "$OUT/publication" --manual-number 6
          test "$(find "$OUT/publication" -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT/publication" -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 3
      - name: Stage corrected Manual 06 package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/manual06-corrected"
          DEST="04-regulatory-compliance/HIPAA_Implementation_Series/publication"
          mkdir -p "$DEST/qa"
          cp "$OUT/publication/"*.docx "$DEST/"
          cp "$OUT/publication/"*.pdf "$DEST/"
          cp -a "$OUT/qa/." "$DEST/qa/"
      - name: Commit corrected Manual 06 durable package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-regulatory-compliance/HIPAA_Implementation_Series/publication
          if git diff --cached --quiet; then
            echo "Manual 06 durable package already matches corrected candidate."
            exit 0
          fi
          git commit -m "Durably restage corrected Manual 06 publication package"
          git push origin HEAD:${{ github.head_ref }}
