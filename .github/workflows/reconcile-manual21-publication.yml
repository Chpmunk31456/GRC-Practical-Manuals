name: "Reconcile Manual 21 publication state"

on:
  push:
    branches:
      - release/manual21-publication-reconciliation-2026-08-31
    paths:
      - ".github/workflows/reconcile-manual21-publication.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message != 'Publish Manual 21 and remove reconciliation workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/manual21-publication-reconciliation-2026-08-31
          fetch-depth: 0
      - name: Reconcile catalog and release registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          entry = {
              'id': 'ot-ics-security-controlled',
              'title': 'Manual 21 — OT / ICS Security Controlled Implementation',
              'path': '06-cloud-and-technology-risk/OT_ICS_Security_Controlled_Implementation',
              'status': 'published',
              'release_state': 'published',
              'layout': 'controlled-build',
              'series_order': 21,
          }
          existing = next((m for m in catalog['manuals'] if m.get('series_order') == 21 or m.get('id') == entry['id']), None)
          if existing:
              existing.update(entry)
          else:
              insert_at = next((i for i,m in enumerate(catalog['manuals']) if m.get('id') == 'ai-governance-audit-toolkit'), len(catalog['manuals']))
              catalog['manuals'].insert(insert_at, entry)
          catalog['last_updated'] = '2026-08-31'
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          releases_path = Path('.compliance/work-product-releases.json')
          releases = json.loads(releases_path.read_text(encoding='utf-8'))
          evidence = ('Manual 21 controlled English was frozen to blob e0a7095d14ce988e988077327ba1f01a8ffbde88 and controlled es-419/pt-BR localizations were merged through PR #331. '
                      'The exact six-binary candidate was generated successfully by workflow run 33369538327 / artifact 9749517564 at candidate head fa0efcc62b0819f7308765705e56f18357c55e5a, with artifact digest sha256:35f6104324627d43f8ce2189eea7d4e665d0a8a327b4f62202a13d39366751bc. '
                      'Manual 21 Candidate Build, Workflow Security, Release Pipeline Meta QA, and Release Package QA passed on that exact candidate. PR #334 bound all six SHA-256 identities plus deterministic PDF/DOCX rendering and accessibility-structure QA with no identified defect requiring regeneration. '
                      'PR #335 durably staged the exact EN/es-419/pt-BR DOCX/PDF bytes after fail-closed hash verification; staging head 0777ee99056f8a5df037b8330329e80dd2a0bb59 changed only the six publication binaries and removed the temporary write workflow. '
                      'Predecessor Manual 20 is published. Standing release authorization applies under the canonical no-errors/no-unresolved-material-issues rule because applicable objective gates are green and no specific genuine non-deterministic substantive blocker is recorded.')
          release_entry = {'id':'ot-ics-security-controlled','type':'manual','release_state':'published','release_evidence':evidence}
          existing_r = next((r for r in releases['released_work_products'] if r.get('id') == release_entry['id']), None)
          if existing_r:
              existing_r.update(release_entry)
          else:
              releases['released_work_products'].append(release_entry)
          releases['last_updated'] = '2026-08-31'
          releases_path.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = Path('06-cloud-and-technology-risk/OT_ICS_Security_Controlled_Implementation/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('controlled-build source and eventual publication package', 'controlled-build source and published trilingual package')
          marker = '\n\n**Publication state:** Published — EN, es-419, and pt-BR DOCX/PDF artifacts are durably staged and SHA-256 bound.\n'
          if '**Publication state:** Published' not in text:
              text = text.rstrip() + marker
          readme.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/reconcile-manual21-publication.yml
      - name: Commit publication reconciliation and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Manual 21 and remove reconciliation workflow'
          git push origin HEAD:release/manual21-publication-reconciliation-2026-08-31
