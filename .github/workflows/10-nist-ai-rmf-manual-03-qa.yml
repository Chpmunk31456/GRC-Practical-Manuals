name: "10 - NIST AI RMF Manual 03 QA"

on:
  pull_request:
    branches:
      - main
      - "build/iso-iec-42001-manual-02-2026"
    paths:
      - "01-foundations/NIST_AI_RMF_1.0/**"
      - ".compliance/nist-ai-rmf-manual-03-baseline.json"
      - ".compliance/authoritative-sources.json"
      - ".compliance/manual-catalog.json"
      - ".compliance/work-product-releases.json"
      - "qa/manual03-publication-readiness/**"
      - "VISUAL_LEARNING_STANDARD.md"
      - "scripts/nist_ai_rmf_manual_03_qa.py"
      - "scripts/run_legacy_manual_qa_release_state.py"
      - "scripts/nist_ai_rmf_manual_03_localization_qa.py"
      - "scripts/nist_ai_rmf_manual_03_publication_gate_qa.py"
      - "scripts/generate_nist_ai_rmf_manual_03_publication.py"
      - "scripts/generate_nist_ai_rmf_manual_03_publication_v2.py"
      - "scripts/generate_nist_ai_rmf_manual_03_publication_v3.py"
      - "scripts/compliance_qa.py"
      - ".github/workflows/10-nist-ai-rmf-manual-03-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nist-ai-rmf-manual-03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nist-ai-rmf-manual-03:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate the NIST AI RMF controlled implementation intake
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('.compliance/manual-catalog.json').read_text(encoding='utf-8'))
          match = [m for m in catalog['manuals'] if m.get('id') == 'nist-ai-rmf-1-0']
          if len(match) != 1:
              raise SystemExit('Manual 03 catalog entry must be unique')
          print(match[0].get('status', ''))
          PY
          )"
          if [[ "$STATUS" == "published" ]]; then
            python3 scripts/run_legacy_manual_qa_release_state.py \
              --manual-id nist-ai-rmf-1-0 \
              --script scripts/nist_ai_rmf_manual_03_qa.py
          else
            python3 scripts/nist_ai_rmf_manual_03_qa.py
          fi

      - name: Validate localized chapter semantic depth and parity
        run: python3 scripts/nist_ai_rmf_manual_03_localization_qa.py

      - name: Validate localized implementation publication source
        run: python3 scripts/nist_ai_rmf_manual_03_publication_gate_qa.py

      - name: Validate the authoritative-source registry
        run: python3 scripts/compliance_qa.py sources

      - name: Validate the controlled manual catalog
        run: python3 scripts/compliance_qa.py catalog

      - name: Install publication QA dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            python-docx==1.2.0 Pillow==11.3.0 PyMuPDF==1.26.3
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu-core

      - name: Generate and inspect isolated publication QA candidates
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/manual03-publication"
          python3 scripts/generate_nist_ai_rmf_manual_03_publication_v3.py \
            --output-root "$OUT" \
            --source-head "$SOURCE_HEAD"
          test -s "$OUT/qa/MANUAL_03_PUBLICATION_REPORT.json"
          test -s "$OUT/qa/MANUAL_03_SHA256SUMS.txt"
          test "$(find "$OUT/publication" -maxdepth 1 -type f -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT/publication" -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 3

      - name: Upload Manual 03 publication QA package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual03-publication-qa
          path: ${{ runner.temp }}/manual03-publication
          if-no-files-found: error
          retention-days: 7
