name: "61 - Manual 32 Publication Reconcile"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/61-manual32-publication-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fail closed and reconcile Manual 32 publication state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('.compliance/manual-catalog.json')
          releases_path = Path('.compliance/work-product-releases.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          releases = json.loads(releases_path.read_text(encoding='utf-8'))

          pred_id = 'nydfs-part-500-controlled'
          new_id = 'ffiec-controlled'
          cats = catalog.get('manuals', catalog if isinstance(catalog, list) else [])
          rels = releases.get('released_work_products', releases.get('work_products', releases.get('releases', releases if isinstance(releases, list) else [])))
          if not isinstance(cats, list) or not isinstance(rels, list):
              raise SystemExit('unexpected registry structure')

          pred_cat = next((x for x in cats if x.get('id') == pred_id), None)
          pred_rel = next((x for x in rels if x.get('id') == pred_id), None)
          if not pred_cat or pred_cat.get('status') != 'published' or pred_cat.get('release_state') != 'published':
              raise SystemExit('Manual 31 not published in catalog')
          if not pred_rel or pred_rel.get('release_state') != 'published':
              raise SystemExit('Manual 31 not published in release registry')
          if any(x.get('id') == new_id for x in cats) or any(x.get('id') == new_id for x in rels):
              raise SystemExit('Manual 32 publication record already exists')

          root = Path('04-regulatory-compliance/FFIEC_Controlled_Implementation/publication')
          files = [
            root/'en/Manual_32_FFIEC_Controlled_EN.docx',
            root/'en/Manual_32_FFIEC_Controlled_EN.pdf',
            root/'es-419/Manual_32_FFIEC_Controlled_ES-419.docx',
            root/'es-419/Manual_32_FFIEC_Controlled_ES-419.pdf',
            root/'pt-BR/Manual_32_FFIEC_Controlled_PT-BR.docx',
            root/'pt-BR/Manual_32_FFIEC_Controlled_PT-BR.pdf',
          ]
          for p in files:
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'missing/empty staged artifact: {p}')

          entry = {
            'id': new_id,
            'title': 'Manual 32 — FFIEC Controlled Implementation',
            'path': '04-regulatory-compliance/FFIEC_Controlled_Implementation',
            'status': 'published',
            'release_state': 'published',
            'layout': 'controlled-build',
            'series_order': 32,
          }
          toolkit_index = next((i for i,x in enumerate(cats) if x.get('id') == 'ai-governance-audit-toolkit'), len(cats))
          cats.insert(toolkit_index, entry)

          rels.append({
            'id': new_id,
            'type': 'manual',
            'release_state': 'published',
            'release_evidence': 'Manual 32 FFIEC controlled EN/es-419/pt-BR package passed structure, trilingual parity, and release-package QA before candidate generation. Exact candidate workflow run 33415623228 / artifact 9766895211 is bound to artifact digest sha256:ffc7f19ccf321e23bdcaa34ffb76f5b1e399e64cbe2f46278a187655987896f0. PR #407 bound all six exact SHA-256 identities, 32-chapter completeness, zero-finding DOCX accessibility audits, searchable PDF preflight, and complete rendered-page review without regeneration. PR #409 durably staged the exact six binaries after fail-closed hash verification; its owner-authored exact staging head 45b3aa8384f6b2f2de091d366c7aec0b7a061452 passed Manual Structure QA, Trilingual Publication Parity, and Release Package QA before merge at af1c120f672cd811303665cfb105d18d9965f457. Release-time source boundary uses the active FFIEC IT Examination Handbook and applicable member-agency overlays; the FFIEC Cybersecurity Assessment Tool was sunset August 31, 2025 and is excluded as a current baseline. Predecessor Manual 31 is published and no unresolved material source, applicability, localization, integrity, packaging, accessibility, provenance, workflow-security, or substantive defect is recorded.'
          })

          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          releases_path.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Self-remove reconciliation workflow and push state
        run: |
          rm .github/workflows/61-manual32-publication-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .compliance/manual-catalog.json .compliance/work-product-releases.json .github/workflows/61-manual32-publication-reconcile.yml
          git commit -m 'Reconcile Manual 32 published state and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
