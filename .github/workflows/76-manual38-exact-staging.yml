name: "76 - Manual 38 Exact Durable Staging"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/76-manual38-exact-staging.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-exact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download frozen candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33432384788 -n manual38-six-binary-candidate -D candidate
      - name: Verify exact provenance-bound hashes
        run: |
          echo "1b3e3ad757aab18876dd9ca9bec3e48a416baa91a121354cdf820e0bf44ea1dd  candidate/Manual_38_FERPA_Controlled_EN.docx" | sha256sum -c -
          echo "bb9162c76308c84e6e5f683a7a72a1fa1a043a9ab1e4ed414101aabdd42bbbe6  candidate/Manual_38_FERPA_Controlled_EN.pdf" | sha256sum -c -
          echo "8f1899440bd44088f829c09530959cd4071825f4b1349cb1e5798a8a486fe059  candidate/Manual_38_FERPA_Controlled_ES-419.docx" | sha256sum -c -
          echo "ca470539e709e7f8d1799facf2352d755d8cc718cbfb18bce8c8109156f0b5b7  candidate/Manual_38_FERPA_Controlled_ES-419.pdf" | sha256sum -c -
          echo "04191d95a9fbef8f139eaa4b7a6838adcea60fb5deb78ae75655a88d8959415d  candidate/Manual_38_FERPA_Controlled_PT-BR.docx" | sha256sum -c -
          echo "1b32df8507dcd7f467ab7fbe78df35f41bb3049b5ab922f0462eec06b76917ee  candidate/Manual_38_FERPA_Controlled_PT-BR.pdf" | sha256sum -c -
      - name: Stage exact bytes and self-remove workflow
        run: |
          ROOT='04-regulatory-compliance/FERPA_Controlled_Implementation/publication'
          mkdir -p "$ROOT/en" "$ROOT/es-419" "$ROOT/pt-BR"
          cp candidate/Manual_38_FERPA_Controlled_EN.docx "$ROOT/en/"
          cp candidate/Manual_38_FERPA_Controlled_EN.pdf "$ROOT/en/"
          cp candidate/Manual_38_FERPA_Controlled_ES-419.docx "$ROOT/es-419/"
          cp candidate/Manual_38_FERPA_Controlled_ES-419.pdf "$ROOT/es-419/"
          cp candidate/Manual_38_FERPA_Controlled_PT-BR.docx "$ROOT/pt-BR/"
          cp candidate/Manual_38_FERPA_Controlled_PT-BR.pdf "$ROOT/pt-BR/"
          rm .github/workflows/76-manual38-exact-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT" .github/workflows/76-manual38-exact-staging.yml
          git commit -m 'Stage Manual 38 exact publication bytes and remove temporary workflow'
          git push origin HEAD:${{ github.head_ref }}
