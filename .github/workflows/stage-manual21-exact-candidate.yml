name: "Stage Manual 21 exact candidate"

on:
  push:
    branches:
      - release/manual21-durable-staging-2026-08-31
    paths:
      - ".github/workflows/stage-manual21-exact-candidate.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage:
    if: github.event.head_commit.message != 'Stage Manual 21 exact candidate and remove staging workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/manual21-durable-staging-2026-08-31
          fetch-depth: 0
      - name: Download bound candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/manual21-candidate
          mkdir -p /tmp/manual21-candidate
          gh run download 33369538327 --repo "$GITHUB_REPOSITORY" --name manual21-six-binary-candidate --dir /tmp/manual21-candidate
      - name: Verify exact candidate hashes and stage publication tree
        run: |
          set -euo pipefail
          cd /tmp/manual21-candidate
          echo '1376620d10f33c45bd2a4ee9695c447c0b5b1e620d77e73f4613733c7d3cb374  Manual_21_OT_ICS_Security_Controlled_EN.docx' | sha256sum -c -
          echo '15bf01a0b8d924613dffe66be6f5d18bacc11e375950fc00839c5afa1293a034  Manual_21_OT_ICS_Security_Controlled_EN.pdf' | sha256sum -c -
          echo '3180f45bfd9ce2c55e551692a6b64984028a612c10255d7870bba87a286198e9  Manual_21_OT_ICS_Security_Controlled_ES-419.docx' | sha256sum -c -
          echo '6d1b5d2e4363dc57c2ef56cb6fad3d36c2b92f05446aae469896a76cade7654c  Manual_21_OT_ICS_Security_Controlled_ES-419.pdf' | sha256sum -c -
          echo '4fe17df3c4adb39d510127972ea89ee5574e9289d8c26ef7ff170257dbda1747  Manual_21_OT_ICS_Security_Controlled_PT-BR.docx' | sha256sum -c -
          echo '06a7c6af8c85c796f6d0a033ffa5328e1361ce6208709b19edd123e772af0ef9  Manual_21_OT_ICS_Security_Controlled_PT-BR.pdf' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          base='06-cloud-and-technology-risk/OT_ICS_Security_Controlled_Implementation/publication'
          mkdir -p "$base/en" "$base/es-419" "$base/pt-BR"
          cp /tmp/manual21-candidate/Manual_21_OT_ICS_Security_Controlled_EN.docx "$base/en/"
          cp /tmp/manual21-candidate/Manual_21_OT_ICS_Security_Controlled_EN.pdf "$base/en/"
          cp /tmp/manual21-candidate/Manual_21_OT_ICS_Security_Controlled_ES-419.docx "$base/es-419/"
          cp /tmp/manual21-candidate/Manual_21_OT_ICS_Security_Controlled_ES-419.pdf "$base/es-419/"
          cp /tmp/manual21-candidate/Manual_21_OT_ICS_Security_Controlled_PT-BR.docx "$base/pt-BR/"
          cp /tmp/manual21-candidate/Manual_21_OT_ICS_Security_Controlled_PT-BR.pdf "$base/pt-BR/"
          rm .github/workflows/stage-manual21-exact-candidate.yml
      - name: Commit exact bytes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage Manual 21 exact candidate and remove staging workflow'
          git push origin HEAD:release/manual21-durable-staging-2026-08-31
